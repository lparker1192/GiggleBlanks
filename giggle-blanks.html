ear.\n\nPlease follow these windy day rules:\n1. Hold on to your homework {adverb}. Yesterday, the spelling tests blew all the way to the {noun}.\n2. Do not fly kites at lunch. Last time, a kite pulled Mr. Bell's {noun} right off the table.\n3. If your hair starts to look {adjective}, that is okay. Everyone's hair will look that way today.\n4. Keep your hats in your backpacks. We do not want any more hats stuck on the flagpole next to the {plural noun}.\n5. If you see a flying {noun}, please do not chase it. Tell a teacher, and a teacher will {verb} until it lands.\n\nRecess will be indoors today. We will play board games, read books, and do the {animal} dance in the gym. Thank you for {verb ending in ing} so nicely. Have a {adjective} day!"}, {"id": "wild-weather-06", "theme": "Wild Weather", "title": "A Letter to Mr. Cloud", "text": "Dear Mr. Cloud,\n\nMy name is Lily. I am seven years old, and I live in the yellow house on Oak Street. You float over my house almost every day.\n\nI have a few questions for you. Why are you so {adjective} on Mondays? Do you ever get tired of {verb ending in ing}? What do you eat for breakfast? My grandpa says clouds eat {plural noun}, but I think he is joking.\n\nI also have a favor to ask. My birthday party is on Saturday. Could you please rain {plural noun} instead of water? That would be so {adjective}. My friends would love it. If you say yes, I will {verb} {adverb} for you and draw you a picture of a {noun}.\n\nYour friend on the ground,\nLily\n\nP.S. Please tell the rainbow I like its {color} stripe the best."}, {"id": "wild-weather-07", "theme": "Wild Weather", "title": "Grandma Sky's Rainbow Recipe", "text": "Have you ever wondered how a rainbow is made? Here is the secret recipe, straight from Grandma Sky's kitchen.\n\nYou will need:\n1 big cloud\n2 cups of sunshine\nA bucket of rain\nA pinch of glitter\nA {adjective} spoon\n\nFirst, put the cloud in a large bowl. Pour in the rain and stir it {adverb} until it starts to {verb}. Then add the sunshine one cup at a time.\n\nNext, sprinkle in the glitter and a handful of {plural noun}. Grandma Sky says this is what makes the colors so {adjective}. If you want an extra stripe, add a little bit of {food}.\n\nBake the rainbow in the sky for {number} minutes. When it is done, it should stretch from the school all the way to the {noun}. Serve it after a rainy afternoon, and do not forget to shout \"{exclamation}!\""}, {"id": "wild-weather-08", "theme": "Wild Weather", "title": "Greetings from Breezy Hills", "text": "Dear Aunt Rose,\n\nGreetings from Breezy Hills, the windiest town in the whole country! We are staying here for {number} days.\n\nThe wind here never stops. This morning it blew my pancakes right off my plate and onto a {noun}. Mom had to hold on to her {adjective} sunglasses all through breakfast.\n\nEverybody in town flies kites. Our neighbor has a kite shaped like a {animal} that is as big as a bus. Dad bought me a kite too. It flew {adverb} and got stuck on a {noun} for an hour.\n\nYesterday we went to the Wind Museum. They have a jar of wind from long ago. It smells like {plural noun}. The museum guide told us to {verb} when he opened it. Tomorrow we will see the Breezy Hills Parade, where everyone goes {verb ending in ing} down Main Street.\n\nLove,\nBen"}, {"id": "wild-weather-09", "theme": "Wild Weather", "title": "Dr. Riley's Weather Facts", "text": "Hi! I am Dr. Riley, junior weather scientist. Here are some fun facts about weather that I learned this year.\n\nFact 1: Snowflakes have six sides. No two snowflakes look the same, but some look a little bit like {plural noun}.\nFact 2: Thunder is the sound clouds make when they try to {verb}.\nFact 3: Hail is little balls of ice. In my town, the hail is soft and about the size of a {noun}.\nFact 4: Fog is a cloud that got sleepy and decided to {verb} on the ground.\nFact 5: The hottest day ever in my backyard was {number} degrees. My popsicle melted {adverb} and dripped on my {body part}.\nFact 6: When it rains while the sun is out, a {adjective} rainbow appears. If you look closely, you can see a {animal} {verb ending in ing} on it.\n\nI want to be a real weather scientist when I grow up. I will wear a {adjective} lab coat and drive a truck full of {plural noun}."}, {"id": "wild-weather-10", "theme": "Wild Weather", "title": "The Town Weather Order Form", "text": "Thank you for calling the Town Weather Office! To order your weather, please fill out this form and drop it in the {adjective} box outside City Hall.\n\nName: Jada, age 7\nWeather needed for: Saturday, my soccer game\nWhat kind of sky would you like? A blue sky with {number} fluffy clouds. Please make one of the clouds look like a {noun}.\nHow warm should it be? Warm enough to {verb} outside, but not so hot that my {food} melts.\nWould you like wind? Yes, please. Just a little bit, so our team flag can wave {adverb}.\n\nAnything else? If it has to rain, please make it rain {plural noun}. Our coach says that would be very {adjective}. Also, please send a rainbow right after the game. My whole team will be {verb ending in ing} on the field when it shows up.\n\nThank you! I will pay you with a hug and two {plural noun}."}, {"id": "castles-and-kingdoms-01", "theme": "Castles and Kingdoms", "title": "Royal Pancake Day Announcement", "text": "Hear ye, hear ye! By order of Queen Maple the Kind, tomorrow is Royal Pancake Day in the Kingdom of Oatmeadow. All {plural noun} must be washed and set out on the castle steps by seven in the morning.\n\nThe royal chef will make one giant pancake as big as a {noun}. It will be topped with honey, berries, and a spoonful of {food}. The queen asks that everyone eat {adverb} and say thank you to the cook.\n\nAfter breakfast, the royal band will play a {adjective} song while the king tries to {verb} on one foot. Last year he {past tense verb} right into the fountain, so please stand back.\n\nChildren may bring their pet {animal} to the parade, but please keep it on a leash. Anyone who sees the royal cat {verb ending in ing} on the throne again should ring the {adjective} bell and shout, \"{exclamation}!\" Thank you, and long live the {plural noun}!"}, {"id": "castles-and-kingdoms-02", "theme": "Castles and Kingdoms", "title": "My Week as the Castle Mail Carrier", "text": "Monday: Today was my first day as the castle mail carrier! I got a {adjective} hat and a bag full of {plural noun}. The castle has two hundred stairs, so I walked {adverb} all the way to the top of the tower.\n\nTuesday: The king got a letter from his cousin. It smelled like {food} and was tied with a {noun}. He read it three times and then {past tense verb} for the rest of the afternoon.\n\nWednesday: The queen ordered {number} boxes of {plural noun} for the garden. They were very heavy, so the castle goat helped me carry them. Behind the last box, I found the princess {verb ending in ing}. She said she was practicing for the talent show.\n\nFriday: I got a letter of my very own! It said, \"Thank you for being so {adjective}. Please come back next week and bring a {noun}.\" I can't wait to {verb} again on Monday."}, {"id": "castles-and-kingdoms-03", "theme": "Castles and Kingdoms", "title": "Rules for Visiting Sunnyhill Castle", "text": "Welcome to Sunnyhill Castle! Please follow these rules so everyone has a {adjective} visit. Rule one: Wipe your feet before you walk on the royal rug. The rug is three hundred years old and is made of {plural noun}.\n\nRule two: Do not {verb} in the throne room. The king is very {adjective} about his quiet time. If you must talk, please whisper {adverb}. Rule three: The castle cat, Sir Fluffington, may sleep anywhere he wants, even in the queen's {noun}. Do not wake him up, or he will meow for {number} hours.\n\nRule four: The moat is for ducks only. No swimming, no {verb ending in ing}, and no throwing {plural noun} into the water.\n\nThank you for visiting! On your way out, please stop by the gift shop and buy a {adjective} {noun}. The money helps us feed the royal {animal}."}, {"id": "castles-and-kingdoms-04", "theme": "Castles and Kingdoms", "title": "The Prince's Birthday Feast Menu", "text": "Tonight the castle celebrates the little prince's sixth birthday! To start, each guest will get a warm bowl of tomato soup with a {noun} floating in the middle. The soup will be served {adverb} by the royal chef, who is wearing her best {color} apron.\n\nThe main dish is roasted carrots, mashed potatoes, and a big pile of {plural noun}. The prince asked for extra {food} on the side, so there will be {number} buckets of it on every table.\n\nFor dessert, the bakers made a {adjective} cake shaped like a {noun}. It took them all week, and last night one baker {past tense verb} right into the frosting. When the candles are lit, everyone will sing and the prince will try to {verb} without laughing.\n\nAfter the feast, guests may stay to dance. The queen says the dance floor is very {adjective}, so please wear {plural noun} on your feet. Happy birthday, Prince Teddy!"}, {"id": "castles-and-kingdoms-05", "theme": "Castles and Kingdoms", "title": "Help Wanted: Royal Pillow Fluffer", "text": "HELP WANTED: The castle of King Barnaby is looking for a new Royal Pillow Fluffer. Our last pillow fluffer moved to the seaside to sell {plural noun}.\n\nThe king has {number} pillows on his bed, and every single one must be fluffed {adverb} each morning. Most of the pillows are filled with feathers. One pillow is filled with {food}. Nobody knows why.\n\nThe right person for this job should be {adjective}, patient, and good at {verb ending in ing}. You must be able to {verb} while carrying a tall stack of pillows up the stairs. Napping on the job is only allowed on Tuesdays.\n\nYou will get a room in the tower, a {adjective} uniform, and all the {plural noun} you can eat. To apply, please send a letter to the castle and tell us about a time you {past tense verb} with a pillow. Please include a stles and Kingdoms", "title": "The Royal Lost and Found", "text": "The castle Lost and Found is getting very full! If any of these things belong to you, please come to the front gate and talk to Gerald.\n\nFound in the throne room: one {adjective} crown, two left shoes, and a jar of {plural noun}. The jar has a note on it that says \"Do not open until Tuesday.\" Found in the royal garden: a {noun} with the queen's name on it. The queen says she has never seen it before. It was found {verb ending in ing} under the apple tree.\n\nFound in the kitchen: {number} wooden spoons and a {color} sock. The cook says the sock is not hers, but it smells a little like {food}. Found in the tower: a book called How to {verb} Like a King. Someone has read it very {adverb}.\n\nIf nobody picks up these things by Friday, Gerald will give them to the royal goat. Last week the goat {past tense verb} a whole box of hats. Thank you, and please remember to label your {plural noun}!"}, {"id": "castles-and-kingdoms-09", "theme": "Castles and Kingdoms", "title": "Castle News: The King's New Hat", "text": "Good evening, and welcome to Castle News. Our top story tonight: King Barnaby has a new hat! The hat arrived this morning in a box as big as a {noun}. It is tall, shiny, and covered in {plural noun}. The king put it on {adverb} and looked in the mirror for {number} minutes.\n\nPeople all over the kingdom came to see it. A farmer said it looked like a {adjective} {food}. One little girl said the hat made her want to {verb}. The royal dog {past tense verb} at it and then hid under the table.\n\nThere was only one problem. The hat was so tall that the king could not fit through the door. He spent the whole afternoon {verb ending in ing} in the hallway. The castle builders are now making the door a little bit more {adjective}.\n\nThat is all for tonight. Tomorrow we will report on the queen's {adjective} new shoes. Good night, and sleep {adverb}!"}, {"id": "castles-and-kingdoms-10", "theme": "Castles and Kingdoms", "title": "The Big Castle Sleepover Plan", "text": "The prince is having a sleepover at the castle this Saturday! At six o'clock, guests will arrive at the front gate. Please bring a sleeping bag, a toothbrush, and your favorite {noun}. The guards will help carry your {plural noun} up to the tower.\n\nAt seven o'clock, we will eat pizza in the great hall. The royal cook will put {food} on top, because that is what the prince likes best. After dinner, everyone will play a game called Hide and {verb}. Last time, the king hid inside a {noun} and {past tense verb} until breakfast.\n\nAt eight o'clock, the queen will read a {adjective} story by the fire. Please sit {adverb} and keep your feet off the royal pillows.\n\nAt nine o'clock, it is lights out. If you hear something {verb ending in ing} in the hallway, do not worry. It is just the royal cat. Sweet dreams, and say goodnight to the {adjective} moon!"}, {"id": "friendly-dragons-01", "theme": "Friendly Dragons", "title": "How to Care for Your Baby Dragon", "text": "Congratulations on your new baby dragon! Baby dragons are sweet, curious, and very {adjective}. Please read these instructions before you take yours home.\n\nFeeding: Your dragon should eat three times a day. Breakfast is a bowl of warm oatmeal. Lunch is a pile of {plural noun}. For dinner, most dragons like a plate of {food} with a little bit of ketchup. Sleeping: Baby dragons like to sleep curled up inside a {noun}. They snore {adverb} and sometimes puff tiny clouds of smoke. This is normal.\n\nPlaytime: Your dragon will want to {verb} every afternoon. Take it to the park and let it chase {plural noun}. If it starts {verb ending in ing}, that means it is happy.\n\nBath time: Dragons love bubbles! Fill the tub with warm water and add {number} rubber ducks. When your dragon is clean, it will shine like a {adjective} {noun}."}, {"id": "friendly-dragons-02", "theme": "Friendly Dragons", "title": "Pudding's First Day of Flying School", "text": "Dear Diary, today was my first day at Flying School. I am only a small dragon, and my wings are still a little bit {adjective}. Mom packed me a lunch of {food} and a note that said, \"You can do it!\"\n\nOur teacher, Mrs. Cloudberry, is the oldest dragon in the valley. She can fly {adverb} and do a loop around the moon. She told us to flap our wings {number} times and then jump off a soft, grassy hill.\n\nMy friend Toast went first. He {past tense verb} right into a haystack. Then it was my turn. I closed my eyes, flapped as hard as I could, and started {verb ending in ing}. When I opened my eyes, I was flying over the {plural noun}!\n\nTomorrow we will learn how to {verb} upside down. I am a little nervous, but Mrs. Cloudberry says every dragon feels nervous sometimes. She still gets nervous around {plural noun}. Good night, Diary. Love, Pudding the {adjective} Dragon"}, {"id": "friendly-dragons-03", "theme": "Friendly Dragons", "title": "Help Wanted: Dragon Sitter", "text": "HELP WANTED: Dragon sitter needed for Saturday afternoons. Our dragon, Mr. Biscuit, is big, green, and very {adjective}. He is friendly, but he does not like to be left alone.\n\nYour jobs will include brushing his scales with a {noun}, reading him stories, and taking him for a walk around the lake. On the walk, he likes to stop and smell the {plural noun}. Please let him. Mr. Biscuit eats {number} sandwiches for lunch. He likes them cut into triangles with {food} in the middle. After lunch, he takes a nap and hums {adverb} in his sleep.\n\nImportant: If Mr. Biscuit sneezes, step to the side. His sneezes are warm and smell like toast. Also, please do not let him {verb} in the living room. Last week he {past tense verb} into the lamp, and now it leans to the left.\n\nYou must be good at {verb ending in ing} and not afraid of hugs. Pay is ten dollars and a {adjective} drawing of a {noun}."}, {"id": "friendly-dragons-04", "theme": "Friendly Dragons", "title": "A Dragon Opens a Bakery", "text": "Big news from the village of Puddlebrook! A dragon named Marigold has opened a bakery on Main Street. She uses her own warm breath to bake bread, so she never needs an oven.\n\nOn opening day, the line went all the way to the {noun}. Marigold sold {number} loaves of bread before lunch. Her most popular treat is a {adjective} muffin with {plural noun} on top.\n\nCustomers say the bakery is clean, cozy, and smells like {food}. One boy said the cookies made him want to {verb}. A grandpa liked them so much that he {past tense verb} all the way home.\n\nThere have been a few small problems. Marigold is very tall, so she has to bake while {verb ending in ing} on the floor. When she laughs, flour flies everywhere and lands on people's {plural noun}. The bakery is open every day except Monday. Marigold says to come early and please talk {adverb}, because loud noises make her drop her {plural noun}."}, {"id": "friendly-dragons-05", "theme": "Friendly Dragons", "title": "Kids Ask a Dragon", "text": "Welcome to Kids Talk, the radio show where kids ask the questions! Today our guest is Sparkle, a purple dragon who lives on top of Blueberry Mountain. Our first question came from Ava, age six. She asked, \"What do you eat for breakfast?\" Sparkle said, \"I usually have toast with {food} and a big glass of {plural noun}.\"\n\nNext, Leo asked, \"Do dragons really keep treasure?\" Sparkle laughed {adverb}. \"Most dragons collect something,\" she said. \"My uncle collects {plural noun}. I collect teacups. So far I have {number} cups, and my favorite one has a {noun} painted on it.\"\n\nThen Mia asked, \"What is the hardest part about being a dragon?\" Sparkle thought for a long time. \"Sweaters,\" she said. \"My wings make it very hard to {verb} in a sweater. Also, every time I sneeze, my {body part} gets a little bit warm.\"\n\nLast, the host asked Sparkle for some advice. \"Be kind, eat your vegetables, and always try {verb ending in ing} before bed,\" she said. What a {adjective} dragon!"}, {"id": "friendly-dragons-06", "theme": "Friendly Dragons", "title": "You're Invited to Pip's Party", "text": "You are invited to a birthday party! Pip the dragon is turning one hundred years old, which is very young for a dragon. The party is on Saturday at two o'clock in the big cave behind Willow Hill. Look for the {adjective} balloons and the sign shaped like a {noun}.\n\nThere will be games, music, and a giant cake made of {plural noun}. Pip will blow out the candles very {adverb}, so please stand back a little. Last year he {past tense verb} so hard that the cake ended up on the ceiling. Please wear something {color}, because that is his favorite color. For a gift, Pip would love a new toothbrush, a book about {plural noun}, or a {noun}.\n\nWe will play Pin the Tail on the {animal} and a dancing game called Freeze and {verb}. Prizes go to whoever is best at {verb ending in ing}. Please write back by Thursday so we know how many sandwiches to make. Pip can't wait to {verb} with you!"}, {"id": "friendly-dragons-07", "theme": "Friendly Dragons", "title": "Rules for the Dragon School Bus", "text": "Good morning, students! This year our school bus is a friendly dragon named Gus. Gus is big and gentle, and he flies {adverb} over the trees every morning. Please follow these rules so everyone gets to school on time.\n\nRule one: Hold on tight to the {adjective} handles on his back. Do not stand up, and do not try to {verb} while Gus is flying. Rule two: Gus is ticklish. Please do not touch his {body part}. The last time someone did that, Gus {past tense verb} and we landed in a field full of {plural noun}.\n\nRule three: No snacks on the dragon. Crumbs fall between his scales, and then he starts {verb ending in ing} and can't stop. Rule four: Say thank you when you get off. On Fridays, students may bring Gus a treat. His favorites are {food} and {plural noun}.\n\nIf you have any questions, please ask the bus driver, Mr. Pine. He sits on top of a {noun} and wears a {adjective} helmet."}, {"id": "friendly-dragons-08", "theme": "Friendly Dragons", "title": "A Thank-You Letter from Bramble", "text": "Dear Mrs. Henderson's First Grade Class, thank you so much for the get-well cards! I am feeling much better now. The doctor said I had a cold, and that is why every sneeze came out as {plural noun} instead of smoke.\n\nYour cards are hanging on the wall of my cave. My favorite one has a drawing of me eating a {adjective} {noun}. Tommy, I love how you made my tail {color}. It looks very {adjective}.\n\nI also want to thank you for the soup. It was warm and tasted like {food}. I ate it {adverb} with my biggest spoon. Then I took a long nap and {past tense verb} for {number} hours.\n\nNext week, I will come visit your classroom. I promise to {verb} carefully and not knock over the bookshelf this time. At recess, we can practice {verb ending in ing} together. Please save me a seat by the {noun}.\n\nYour friend,\nBramble the Dragon"}, {"id": "friendly-dragons-09", "theme": "Friendly Dragons", "title": "Ember's First Report Card", "text": "Dragon Valley School Report Card for Ember, Kindergarten. Reading: Ember is a {adjective} reader. He likes books about {plural noun} and reads them out loud to the class. Sometimes he reads so {adverb} that the pages get a little warm.\n\nMath: Ember can count to {number} on his claws. He is still learning to share. Yesterday he hid all the counting blocks under his {noun}. Art: Ember's painting of a {noun} is now hanging in the front hall. Everyone loved it, even though it was a little bit smoky.\n\nMusic: Ember loves to {verb} during music time. His singing voice is very loud. Please practice {verb ending in ing} quietly at home.\n\nBehavior: Ember is kind to his friends and always helps clean up. On Tuesday, he used his wings to blow all the leaves into one big pile, and then he {past tense verb} right in the middle of it. Great job, Ember! Keep being {adjective}!"}, {"id": "friendly-dragons-10", "theme": "Friendly Dragons", "title": "Grandma Dragon's Famous Soup", "text": "This is the soup that Grandma Dragon makes every winter. She says it warms your tummy and makes your scales shiny. You will need a grown-up to help.\n\nFirst, fill a big pot with water and add two carrots, one onion, and a handful of {plural noun}. Grandma Dragon does not use a stove. She just breathes on the pot {adverb} until it bubbles.\n\nNext, add a spoonful of {food} and stir it with a {noun}. Grandma says you must stir {number} times to the left, or the soup will taste {adjective}. While the soup cooks, it is very important to {verb}. Grandma Dragon always does this, and she has been making soup for six hundred years. Some days she also hums while {verb ending in ing}.\n\nWhen the soup is ready, pour it into a {adjective} bowl. Blow on it before you eat it, unless you are a dragon. Grandma Dragon says her soup is so good that her neighbor once {past tense verb} for joy. Enjoy, and save some for the {plural noun}!"}, {"id": "friendly-monsters-01", "theme": "Friendly Monsters", "title": "Gloop Goes to Monster School", "text": "Fuzzyville Monster School report card for Gloop, age seven. Reading: Gloop reads very {adverb}. His favorite book is about a little monster who is afraid of {plural noun}. He has read it {number} times.\n\nMath: Gloop can count all the way to one hundred, but he uses all eleven of his toes, so it takes a long time. Science: Gloop planted a bean in a cup. Instead of a bean plant, it grew a {adjective} {noun}. We are not sure how this happened. Lunch: Gloop eats his sandwich, his apple, and sometimes his lunch box. Please pack him extra {food}.\n\nRecess: Gloop is a great friend on the playground. He lets the smaller monsters {verb} on his back, and he is the best at {verb ending in ing}. Last week he {past tense verb} so high on the swing that he touched a cloud.\n\nTeacher comments: Gloop is kind, helpful, and very {adjective}. Please remind him not to hide in the {noun} during nap time."}, {"id": "friendly-monsters-02", "theme": "Friendly Monsters", "title": "A Note from the Monster Under Your Bed", "text": "Dear Sam, hello! It is me, Bobo, the monster who lives under your bed. I just wanted to say thank you for being such a {adjective} roommate.\n\nI have a few small requests. First, could you please stop leaving {plural noun} under here? I keep tripping on them. Second, your socks smell a little bit like {food}. I like it, but it makes my nose itchy.\n\nEvery night when you fall asleep, I tidy up your room. I fold your shirts, line up your shoes, and tuck in your stuffed animals. Then I {past tense verb} around the room twice to check for crumbs. I also sing a {adjective} song to the goldfish. On Saturday, would you like to {verb} together? I could teach you the monster dance. You wiggle your {body part}, spin around {number} times, and then flop down like a {noun}.\n\nSleep {adverb}, Sam. If you need anything, just knock on the floor three times and I will bring you a {noun}.\n\nYour friend,\nBobo"}, {"id": "friendly-monsters-03", "theme": "Friendly Monsters", "title": "Help Wanted at the Fuzzy Hair Shop", "text": "HELP WANTED: The Fuzzy Hair Shop is looking for a new helper! We are the only barbershop in town just for monsters.\n\nOur customers are very hairy. Some of them have hair on their {body part}, and one of them has hair that is {adjective} and {number} feet long. Every haircut takes about three hours, so you must be patient and {adjective}.\n\nYour jobs will include sweeping up fur, washing combs, and handing out {plural noun} to monsters who sit still. You will also need to {verb} when customers feel nervous. Monsters get nervous about haircuts, just like kids do. The best part of the job is the free lunch. Every day the owner, Mrs. Tangle, makes a big pot of {food} soup.\n\nLast week a monster named Wally {past tense verb} right out of the chair because the water was too cold. Now we warm the water he team has won {number} games in a row, and they all practice {verb ending in ing} together on Saturdays.\n\nThe next game is this Sunday at the park. Fans are asked to bring {plural noun} and cheer {adverb}. Ted will be the one in the {adjective} socks."}, {"id": "friendly-monsters-08", "theme": "Friendly Monsters", "title": "Rules for Camp Snuggleclaw", "text": "Welcome to Camp Snuggleclaw, the summer camp for friendly monsters! We want everyone to have a {adjective} time, so please read the camp rules. Rule one: Lights out is at nine o'clock. If you snore, please snore {adverb} so you do not wake your cabin buddies.\n\nRule two: Please do not eat the canoes. We know they look like {plural noun}, but they are boats. We only have {number} canoes left. Rule three: Campfire time is for songs and marshmallows. You may toast your marshmallows on a stick, but please do not toast your {plural noun}.\n\nRule four: Monsters with more than four arms must take turns on the swings. Last summer, a monster named Flurp {past tense verb} on the swings for six hours, and nobody else got a turn. Rule five: Write a letter home every week. Tell your family about the {noun} you found in the woods and how you learned to {verb} like a frog.\n\nHave fun, be kind, and remember: at Camp Snuggleclaw, we never stop {verb ending in ing}!"}, {"id": "friendly-monsters-09", "theme": "Friendly Monsters", "title": "Postcard from a Monster at the Beach", "text": "Dear Mom and Dad, greetings from Sunny Sands Beach! I am having a {adjective} time. The hotel bed is too small, so I sleep on the balcony with my feet hanging over the edge. Yesterday I built a sandcastle as big as a {noun}. A seagull tried to take my sandwich, so I gave him half. Now we are best friends. His name is {name}.\n\nToday I tried surfing for the first time. I fell off {number} times, but on my last try I {past tense verb} all the way to the shore. Everyone on the beach clapped {adverb}. A little boy asked if my fur was soft, so I let him pet my {body part}. A grandma gave me a hat because she said my ears looked {adjective}.\n\nTomorrow I am going to {verb} with the dolphins and eat {plural noun} for lunch. I will bring you a seashell and a {adjective} {noun}. I miss you, and I miss {verb ending in ing} in our swamp.\n\nLove,\nSnorkel"}, {"id": "friendly-monsters-10", "theme": "Friendly Monsters", "title": "The Monster Talent Show Program", "text": "Welcome to the third yearly Monster Talent Show! Please find a seat and get ready to clap. Act one: Grizzle will juggle {number} {plural noun} while standing on one foot. He has been practicing for weeks, so please do not sneeze during his act.\n\nAct two: The Fuzz Sisters will sing a {adjective} song about their grandma's cooking. The song is eleven minutes long and has a part in the middle where they {verb} together. Act three: Little Blip will play the piano with her {body part}. She plays very {adverb}, so the front row may want to cover their ears.\n\nAct four: Mr. Lumpy will tell jokes. His best joke is about a {noun} who walks into a bakery. Last year the crowd {past tense verb} so hard that the stage wobbled. At the very end, everyone will come on stage {verb ending in ing}. Please join in!\n\nAfter the show, there will be cookies and {food} in the lunchroom. Thank you for coming, and remember: every monster is {adjective} in its own way!"}, {"id": "in-the-kitchen-01", "theme": "In the Kitchen", "title": "Grandpa's Famous Pancakes", "text": "Grandpa makes pancakes every Sunday morning. He says this recipe has been in our family for {number} years. Here is how he does it.\n\nFirst, put two cups of flour in a big {adjective} bowl. Add one egg, a cup of milk, and a handful of {plural noun}. Stir it {adverb} with a wooden spoon until it looks smooth.\n\nNext, Grandpa pours the batter into the pan in the shape of a {noun}. He always lets me choose which shape comes next. Last week one pancake {past tense verb} right off the plate and lande \nSaturday: Leo cleaned my bowl. I spent the whole day {verb ending in ing} and blowing bubbles. Being a fish is the best job in the world, except maybe being a {noun}."}, {"id": "pets-05", "theme": "Pets", "title": "Welcome Home, Puppy", "text": "Dear Puppy,\n\nWelcome to our family! We are so happy you are here. My name is Ella, and I am going to be your best friend.\n\nHere are some things you should know about your new home. Your bed is in the kitchen, next to the {noun}. Your water bowl is blue, and your food bowl is {color}. You may chew on your toys, but please do not chew on Dad's {plural noun}.\n\nWe have a big back yard. You can run and {verb} out there all day long. There is a tree, a swing, and a garden full of {plural noun}.\n\nAt night, I will read you a story about a {adjective} dog who saves the day. I will read it {adverb} so you can fall asleep.\n\nI already picked a name for you. Your name is {silly word}. I hope you like it as much as I do.\n\nLove,\nElla\n\nP.S. When I came home from school today, you {past tense verb} so hard that your whole body wiggled."}, {"id": "pets-06", "theme": "Pets", "title": "Biscuit's Checkup Report", "text": "Patient: Biscuit\nType of Animal: Dog\nAge: Four years old\n\nToday Biscuit came in for his yearly checkup. He walked in wagging his tail and wearing a {adjective} sweater. He is a very good boy.\n\nWe checked his ears, his eyes, and his teeth. His teeth are bright and shiny, like a row of {plural noun}. We listened to his heart, and it sounded just like a {noun}.\n\nBiscuit is healthy and happy. His owner says he likes to {verb} in the back yard and nap on the couch.\n\nDoctor's notes: Biscuit should keep going for walks every day. He may have one dog treat after dinner, plus a small bowl of {plural noun} on special days. Please brush his fur {adverb} once a week.\n\nAt the end of the visit, Biscuit {past tense verb} and gave the doctor a big lick on the {body part}. We gave him a sticker that says \"I Was {ad const THEME_PICS = {
  "Space":"🚀","Robots":"🤖","Superheroes":"🦸","Pirates":"🏴‍☠️","Under the Sea":"🐙","Beach Day":"🏖️",
  "Dinosaurs":"🦕","Jungle Adventure":"🌴","At the Zoo":"🦒","School Days":"🎒","Field Trip":"🚌",
  "Sports Day":"⚽","Birthday Party":"🎂","Snow Day":"⛄","Halloween Fun":"🎃","Camping Trip":"🏕️",
  "On the Farm":"🐄","Wild Weather":"🌈","Castles and Kingdoms":"🏰","Friendly Dragons":"🐉",
  "Friendly Monsters":"👾","In the Kitchen":"🥄","Pets":"🐶","Grocery Store":"🛒","Road Trip":"🚗",
  "Bedtime":"🌙","Construction Site":"🚧"
};

const TYPES = {
  "noun": { label:"Noun", art:"a", meaning:"A person, place, or thing.", ex:["banana","teacher","bathtub","rock","trumpet","lamp","pillow","spoon","cloud","sock"] },
  "plural noun": { label:"Plural Noun", art:"a", meaning:"More than one person, place, or thing. It usually ends in -s.", ex:["pickles","shoes","cupcakes","buttons","pencils","marshmallows","socks","balloons","noodles","crayons"] },
  "verb": { label:"Verb", art:"a", meaning:"An action word. Something you can do.", ex:["jump","wiggle","sing","sneeze","dance","hop","giggle","tiptoe","spin","clap"] },
  "verb ending in ing": { label:"Verb ending in -ing", art:"a", meaning:"An action word that ends in -ing.", ex:["jumping","wiggling","singing","sneezing","dancing","hopping","giggling","tiptoeing","spinning","clapping"] },
  "past tense verb": { label:"Past Tense Verb", art:"a", meaning:"An action word that already happened. It often ends in -ed.", ex:["jumped","wiggled","sang","sneezed","danced","hopped","giggled","tiptoed","spun","clapped"] },
  "adjective": { label:"Adjective", art:"an", meaning:"A describing word. It tells what something is like.", ex:["fuzzy","enormous","sparkly","grumpy","squishy","tiny","slimy","fancy","bumpy","shiny"] },
  "adverb": { label:"Adverb", art:"an", meaning:"A word that tells how something is done. It often ends in -ly.", ex:["quickly","loudly","slowly","sneakily","happily","gently","proudly","sleepily","bravely","wildly"] },
  "number": { label:"Number", art:"a", meaning:"Any number at all.", ex:["7","12","100","3","a million","42","five","zero"] },
  "color": { label:"Color", art:"a", meaning:"Any color.", ex:["purple","green","orange","silver","pink","polka-dot"] },
  "animal": { label:"Animal", art:"an", meaning:"Any kind of animal.", ex:["llama","penguin","hippo","octopus","hamster","giraffe","snail","walrus"] },
  "food": { label:"Food", art:"a", meaning:"Anything you can eat.", ex:["spaghetti","broccoli","pancake","cheese","popcorn","pickle","meatball","jelly"] },
  "place": { label:"Place", art:"a", meaning:"Somewhere you can go.", ex:["the library","the moon","Grandma's house","the park","the bathtub","Alaska"] },
  "body part": { label:"Body Part", art:"a", meaning:"A part of your body.", ex:["elbow","nose","knee","eyebrow","pinky toe","belly button","ear"] },
  "silly word": { label:"Silly Word", art:"a", meaning:"A made-up word. The sillier the better!", ex:["flibbertigibbet","bloop","snorkeldoodle","wibble","zonkers","pickleplop"] },
  "sound": { label:"Sound", art:"a", meaning:"A noise something makes.", ex:["boing","moo","splat","honk","whoosh","beep","kaboom"] },
  "exclamation": { label:"Exclamation", art:"an", meaning:"Something you shout when you are surprised or excited.", ex:["Wow","Yikes","Hooray","Oh my","Ta-da","Whoa","Holy guacamole"] },
  "name": { label:"Name", art:"a", meaning:"Someone's name. It can be a real person or a made-up one.", ex:["Grandpa Joe","Ms. Pickles","Sammy","Captain Fluff","Aunt Rosie"] }
};

/* ---------- helpers ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function store(key, val){ try { if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null"); localStorage.setItem(key, JSON.stringify(val)); } catch(e) { return null; } }

const THEMES = [...new Set(STORIES.map(s => s.theme))];
const byTheme = t => STORIES.filter(s => s.theme === t);
let played = new Set(store("gb-played") || []);
function markPlayed(id){ played.add(id); store("gb-played", [...played]); }

function chooseStory(theme){
  const pool = theme ? byTheme(theme) : STORIES;
  const fresh = pool.filter(s => !played.has(s.id));
  return pick(fresh.length ? fresh : pool);
}

function blanksOf(story){
  const out = []; story.text.replace(/\{([^{}]+)\}/g, (_, t) => { out.push(t); return ""; });
  return out;
}

/* Build the finished story as HTML, fixing a/an before each filled word. */
function renderStory(story, answers){
  let i = 0;
  const tokens = [];
  const withMarks = story.text.replace(/\{([^{}]+)\}/g, (_, t) => { tokens.push({ t, w: answers[i++] || "" }); return "\u0000" + (tokens.length-1) + "\u0000"; });
  // a/an correction: "a" or "A" right before a marker
  const fixed = withMarks.replace(/\b(a|A|an|An)(\s+)\u0000(\d+)\u0000/g, (m, art, sp, n) => {
    const word = tokens[+n].w.trim();
    const vowel = /^[aeiou]/i.test(word) && !/^(uni|use|usu|one|eu)/i.test(word);
    const lower = vowel ? "an" : "a";
    const out = art[0] === "A" ? lower[0].toUpperCase() + lower.slice(1) : lower;
    return out + sp + "\u0000" + n + "\u0000";
  });
  const paras = fixed.split(/\n\s*\n/);
  return paras.map(p => {
    const html = esc(p).replace(/\u0000(\d+)\u0000/g, (m, n) => {
      const tk = tokens[+n];
      const label = (TYPES[tk.t] || {label: tk.t}).label;
      return `<span class="w" tabindex="0" data-type="${esc(label)}">${esc(tk.w)}</span>`;
    });
    return `<p>${html.replace(/\n/g, "<br>")}</p>`;
  }).join("");
}

/* ---------- state ---------- */
let state = { view: "home" };

function go(next){ state = Object.assign({}, state, next); draw(); window.scrollTo(0,0); }

function startStory(theme, keepStory){
  const story = keepStory || chooseStory(theme);
  const blanks = blanksOf(story);
  go({ view: "ask", theme: theme || null, story, blanks, answers: Array(blanks.length).fill(""), step: 0 });
}

/* ---------- views ---------- */
function draw(){
  stopSpeech();
  const app = $("#app");
  if (state.view === "home") app.innerHTML = homeView();
  else if (state.view === "ask") app.innerHTML = askView();
  else if (state.view === "story") app.innerHTML = storyView();
  bind();
}

function header(){
  return `<header class="top">
    <div>
      <div class="logo">Giggle <span class="blank">Blanks</span></div>
      <p class="tag">Fill in the words. Then read the silly story out loud.</p>
    </div>
    ${state.view !== "home" ? `<button class="linkbtn" data-act="home">All themes</button>` : ""}
  </header>`;
}

function homeView(){
  const tiles = THEMES.map(t => {
    const n = byTheme(t).length;
    const left = byTheme(t).filter(s => !played.has(s.id)).length;
    return `<button class="theme" data-act="theme" data-theme="${esc(t)}">
      <span class="pic" aria-hidden="true">${THEME_PICS[t] || "📖"}</span>
      <span class="name">${esc(t)}</span>
      <span class="count">${left === n ? n + " stories" : left + " of " + n + " new"}</span>
    </button>`;
  }).join("");
  return `${header()}
    <section class="shelf" aria-label="Pick a theme">
      <button class="theme surprise" data-act="theme" data-theme="">
        <span class="pic" aria-hidden="true">🎲</span>
        <span class="name">Surprise me!</span>
        <span class="count">Any story at all</span>
      </button>
      ${tiles}
    </section>
    <div class="row" style="justify-content:space-between">
      <span class="stats">${STORIES.length} stories in ${THEMES.length} themes · ${played.size} played</span>
      ${played.size ? `<button class="linkbtn" data-act="reset">Mark all as new</button>` : ""}
    </div>`;
}

function askView(){
  const { story, blanks, answers, step } = state;
  const type = blanks[step];
  const info = TYPES[type] || { label: type, art: "a", meaning: "", ex: [] };
  const dots = blanks.map((_, i) => `<span class="dot ${i < step || (answers[i] && i !== step) ? "done" : ""} ${i === step ? "now" : ""}"></span>`).join("");
  const ex = shuffle(info.ex).slice(0, 3).map(w => `<span class="chip">${esc(w)}</span>`).join("");
  const last = step === blanks.length - 1;
  return `${header()}
    <div class="story-head">
      <div>
        <div class="theme-label">${esc(story.theme)} · Word ${step + 1} of ${blanks.length}</div>
        <h2>${esc(story.title)}</h2>
      </div>
    </div>
    <div class="progress" aria-hidden="true">${dots}</div>
    <form class="card pop" id="askForm" autocomplete="off">
      <p class="ask">Give me ${info.art}</p>
      <div class="kind">${esc(info.label)}</div>
      <p class="meaning">${esc(info.meaning)}</p>
      <div class="examples">Like: ${ex}</div>
      <label for="answer" class="ask" style="position:absolute;left:-9999px">Your ${esc(info.label)}</label>
      <input class="answer" id="answer" value="${esc(answers[step])}" maxlength="40" autocapitalize="off" spellcheck="false" placeholder="Type your word">
      <p class="err" id="err" aria-live="polite"></p>
      <div class="nav">
        <div class="row">
          <button type="button" class="btn" data-act="back" ${step === 0 ? "disabled" : ""}>Back</button>
          <button type="button" class="btn" data-act="helpme">Pick for me</button>
        </div>
        <button type="submit" class="btn go">${last ? "Show my story!" : "Next"}</button>
      </div>
    </form>
    <p class="footnote">No peeking! The story stays secret until every word is in.</p>`;
}

function storyView(){
  const { story, answers } = state;
  const canSpeak = "speechSynthesis" in window;
  return `${header()}
    <article class="page pop">
      <div class="theme-label" style="font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink-soft);font-weight:700;margin-bottom:6px">${esc(story.theme)}</div>
      <h2>${esc(story.title)}</h2>
      <div class="text" id="storyText">${renderStory(story, answers)}</div>
    </article>
    <p class="legend">Tap a yellow word to see what kind of word it was.</p>
    <div class="row">
      ${canSpeak ? `<button class="btn blue" data-act="speak" id="speakBtn">Read it to me</button>` : ""}
      <button class="btn go" data-act="next">Next ${state.theme ? esc(state.theme) : "surprise"} story</button>
      <button class="btn" data-act="again">Same story, new words</button>
    </div>`;
}

/* ---------- events ---------- */
function bind(){
  document.querySelectorAll("[data-act]").forEach(el => el.addEventListener("click", onAct));
  const form = $("#askForm");
  if (form) {
    const input = $("#answer");
    setTimeout(() => { try { input.focus({ preventScroll: true }); } catch(e){} }, 30);
    form.addEventListener("submit", e => { e.preventDefault(); saveAndAdvance(); });
    input.addEventListener("input", () => { $("#err").textContent = ""; });
  }
  document.querySelectorAll(".w").forEach(w => {
    w.addEventListener("click", showTip);
    w.addEventListener("focus", showTip);
    w.addEventListener("blur", hideTip);
  });
}

function saveAndAdvance(){
  const val = $("#answer").value.trim();
  if (!val) { $("#err").textContent = "Type a word first, or tap Pick for me."; return; }
  const answers = state.answers.slice(); answers[state.step] = val;
  if (state.step < state.blanks.length - 1) go({ answers, step: state.step + 1 });
  else { markPlayed(state.story.id); go({ answers, view: "story" }); }
}

function onAct(e){
  const act = e.currentTarget.dataset.act;
  if (act === "home") go({ view: "home" });
  else if (act === "theme") startStory(e.currentTarget.dataset.theme || null);
  else if (act === "reset") { played = new Set(); store("gb-played", []); draw(); }
  else if (act === "back" && state.step > 0) {
    const answers = state.answers.slice(); answers[state.step] = $("#answer").value.trim();
    go({ answers, step: state.step - 1 });
  }
  else if (act === "helpme") {
    const info = TYPES[state.blanks[state.step]];
    if (info) { $("#answer").value = pick(info.ex); $("#err").textContent = ""; }
  }
  else if (act === "next") startStory(state.theme);
  else if (act === "again") startStory(state.theme, state.story);
  else if (act === "speak") toggleSpeech();
}

let tipTimer;
function showTip(e){
  const t = $("#tip"), r = e.currentTarget.getBoundingClientRect();
  t.textContent = e.currentTarget.dataset.type; t.hidden = false;
  const left = Math.min(window.innerWidth - t.offsetWidth - 8, Math.max(8, r.left));
  t.style.left = left + "px"; t.style.top = Math.max(8, r.top - t.offsetHeight - 6) + "px";
  clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 1800);
}
function hideTip(){ $("#tip").hidden = true; }
window.addEventListener("scroll", hideTip, { passive: true });

/* ---------- read aloud ---------- */
let speaking = false;
function stopSpeech(){ try { if (speaking) speechSynthesis.cancel(); } catch(e){} speaking = false; }
function toggleSpeech(){
  const btn = $("#speakBtn");
  if (speaking) { stopSpeech(); if (btn) btn.textContent = "Read it to me"; return; }
  try {
    const text = state.story.title + ". " + $("#storyText").innerText;
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92;
    u.onend = u.onerror = () => { speaking = false; if (btn) btn.textContent = "Read it to me"; };
    speechSynthesis.cancel(); speechSynthesis.speak(u); speaking = true;
    if (btn) btn.textContent = "Stop reading";
  } catch(e) { if (btn) btn.hidden = true; }
}

draw();
</script>
