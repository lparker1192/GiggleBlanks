<style>
/* Layout: a single workbook column — theme shelf, then one prompt card at a time, then the story read-aloud page on ruled paper. */
:root {
  --paper: #fbf9f1;
  --rule: #d6e2f3;
  --margin: #f2a7a0;
  --ink: #1f2c55;
  --ink-soft: #55607f;
  --card: #ffffff;
  --line: #e4e2d6;
  --sun: #ffcb3d;
  --sun-ink: #3a2a00;
  --blue: #2b59c3;
  --blue-ink: #ffffff;
  --fill: #fff1b8;
  --fill-line: #e0a800;
  --display: "Sniglet", "Comic Neue", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --shadow: 0 2px 0 rgba(31,44,85,.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1c2622; --rule: #2a3833; --margin: #6b3f3b;
    --ink: #eef2e6; --ink-soft: #a9b6ac; --card: #24302b; --line: #34433d;
    --sun: #ffcb3d; --sun-ink: #2b1f00; --blue: #7fa6ff; --blue-ink: #10204a;
    --fill: #4a3d12; --fill-line: #ffcb3d; --shadow: 0 2px 0 rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1c2622; --rule: #2a3833; --margin: #6b3f3b;
  --ink: #eef2e6; --ink-soft: #a9b6ac; --card: #24302b; --line: #34433d;
  --sun: #ffcb3d; --sun-ink: #2b1f00; --blue: #7fa6ff; --blue-ink: #10204a;
  --fill: #4a3d12; --fill-line: #ffcb3d; --shadow: 0 2px 0 rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; text-wrap: balance; line-height: 1.1; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 7vw, 44px); letter-spacing: .5px; }
.logo .blank {
  display: inline-block; min-width: 2.6em; border-bottom: 5px solid var(--sun);
  color: var(--blue); text-align: center; margin: 0 .08em;
}
.tag { color: var(--ink-soft); margin: 4px 0 0; }
.linkbtn { background: none; border: 0; color: var(--blue); font-weight: 700; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }

.btn {
  border: 2px solid var(--ink); border-radius: 14px; padding: 12px 20px;
  background: var(--card); color: var(--ink); font-family: var(--display); font-size: 19px;
  box-shadow: 0 3px 0 var(--ink); transition: transform .08s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.go { background: var(--sun); color: var(--sun-ink); }
.btn.blue { background: var(--blue); color: var(--blue-ink); }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Theme shelf */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.theme {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 16px;
  padding: 14px; color: var(--ink); box-shadow: var(--shadow); min-height: 112px;
}
.theme:hover { border-color: var(--blue); }
.theme .pic { font-size: 32px; line-height: 1; }
.theme .name { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.15; }
.theme .count { font-size: 13px; color: var(--ink-soft); }
.theme.surprise { background: var(--sun); color: var(--sun-ink); border-color: var(--sun); }
.theme.surprise .count { color: var(--sun-ink); }
.stats { color: var(--ink-soft); font-size: 15px; }

/* Prompt card */
.story-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.story-head .theme-label { font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-soft); font-weight: 700; }
.story-head h2 { font-size: clamp(24px, 5vw, 32px); }
.progress { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink-soft); }
.dot.done { background: var(--sun); border-color: var(--fill-line); }
.dot.now { background: var(--blue); border-color: var(--blue); }

.card {
  background: var(--card); border: 2px solid var(--ink); border-radius: 22px;
  padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 5px 0 var(--ink);
}
.ask { font-size: 18px; color: var(--ink-soft); margin: 0; }
.kind { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 9vw, 52px); color: var(--blue); line-height: 1; }
.meaning { font-size: 19px; margin: 0; }
.examples { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--ink-soft); font-size: 15px; }
.chip { background: var(--fill); border-bottom: 2px solid var(--fill-line); color: var(--ink); padding: 2px 10px; border-radius: 8px; font-style: italic; }
.answer {
  width: 100%; font: 700 26px var(--body); color: var(--ink); background: transparent;
  border: 0; border-bottom: 4px solid var(--ink); padding: 8px 2px; border-radius: 0;
}
.answer:focus { outline: none; border-bottom-color: var(--blue); }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.err { color: #b3261e; font-weight: 700; margin: 0; min-height: 1.5em; }
:root[data-theme="dark"] .err { color: #ff9c92; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .err { color: #ff9c92; } }

/* Story reveal on ruled paper */
.page {
  position: relative; border-radius: 6px; padding: 28px 22px 28px 46px;
  background-color: var(--card);
  background-image:
    linear-gradient(to right, transparent 32px, var(--margin) 32px, var(--margin) 34px, transparent 34px);
  box-shadow: var(--shadow); border: 1px solid var(--line);
}
.page h2 { font-size: clamp(26px, 6vw, 36px); margin-bottom: 14px; }
.page .text {
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 36px, var(--rule) 36px, var(--rule) 38px, transparent 38px, transparent 40px);
}
.page .text p { font-size: clamp(19px, 4.4vw, 23px); line-height: 40px; margin: 0 0 40px; }
.page .text p:last-child { margin-bottom: 0; }
.w {
  background: var(--fill); border-bottom: 3px solid var(--fill-line); padding: 0 4px;
  font-weight: 700; border-radius: 4px; cursor: help; position: relative;
}
.w.reading { background: var(--sun); color: var(--sun-ink); }
.legend { color: var(--ink-soft); font-size: 15px; margin: 0; }
.tip {
  position: fixed; z-index: 20; background: var(--ink); color: var(--paper); font-size: 14px;
  padding: 6px 10px; border-radius: 8px; pointer-events: none; max-width: 240px;
}
.footnote { color: var(--ink-soft); font-size: 14px; text-align: center; }
@media (max-width: 480px) {
  .card { padding: 18px; }
  .page { padding: 22px 14px 22px 42px; }
  .btn { padding: 11px 16px; font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }
.pop { animation: pop .18s ease-out; }
</style>

<script>
const STORIES = [{"id": "space-01", "theme": "Space", "title": "Postcard from the Moon", "text": "Dear Grandpa,\nGreetings from the moon! The flight here took {number} hours, and the pilot let me hold a {adjective} {noun} the whole time. The moon is very dusty and smells a little bit like {food}. My hotel room has a window, a tiny bed, and a big pile of {plural noun} in the corner.\n\nYesterday I went for a moon walk. Everything floats up here, so I {past tense verb} right over a crater by accident. A friendly moon guide named Doris showed me how to {verb} without bouncing away. She moves very {adverb} and wears a helmet shaped like a {noun}.\n\nTomorrow we get to visit the gift shop. I will bring you back a jar of {plural noun}. Please tell Mom I am still {verb ending in ing} every single night before bed.\nLove,\nSam"}, {"id": "space-02", "theme": "Space", "title": "Rules for the Space Station Kitchen", "text": "Welcome to the kitchen on Space Station Ten! There is no gravity up here, so please follow these rules.\n\nRule one: Always buckle your sandwich to the table. Last week a sandwich got loose and floated right into Commander Lopez's {body part}. She was very {adjective} about it. Rule two: Do not open the jar of {plural noun} without asking. When it opens, everything inside drifts {adverb} around the room for a whole day.\n\nRule three: Drinks come in pouches. Please do not {verb} while you drink, or the juice will turn into {number} floating {plural noun}. Rule four: Pizza night is on Fridays. The cook makes it with tomato sauce, cheese, and a sprinkle of {plural noun}. Everyone eats it upside down while {verb ending in ing}.\n\nIf you see a {adjective} {noun} floating near the oven, do not touch it. Just shout \"{exclamation}!\" and the cleaning robot will come get it."}, {"id": "space-03", "theme": "Space", "title": "Help Wanted: Astronaut", "text": "Help wanted! The Starlight Space Company is looking for a {adjective} astronaut to fly our newest rocket. The rocket is very shiny and is about the size of a {noun}.\n\nAstronauts must be able to {verb} for three hours without stopping. You should also know how to steer with your {body part} and carry {number} {plural noun} at the same time.\n\nOn a normal day, you will check the engines, water the space plants, and say hello to the {plural noun} who live on the moon. Lunch is a tube of {food} and a {adjective} cookie.\n\nTo apply, please send us a letter and a drawing of yourself {verb ending in ing} in space. Our last astronaut {past tense verb} all the way to Mars and decided to stay, so we need someone new by Tuesday. Please write your letter {adverb} and in crayon."}, {"id": "space-04", "theme": "Space", "title": "Breaking News from Mars", "text": "Good evening. This is Channel Seven News with a big story from Mars. This morning, a friendly alien named Zib opened the very first bakery on the red planet.\n\nThe bakery is small and {adjective}, with a sign shaped like a {noun}. The most popular treat is a muffin filled with {plural noun}. \"I bake everything {adverb},\" Zib told our reporter. \"That is the secret.\"\n\nThe line was very long. Some customers waited {number} hours and passed the time {verb ending in ing} in the red dust. One astronaut was so happy that he {past tense verb} all the way back to his rocket.\n\nZib hopes to open a second bakery on the moon next year. For now, the bakery is open every day except Tuesday, when Zib likes to {verb} with friends. Now back to you, {name}, with the {adjective} weather report."}, {"id": "space-05", "theme": "Space", "title": "How to Make Moon Pancakes", "text": "Moon pancakes are the favorite breakfast of every astronaut on the space station. Here is how to make them.\n\nFirst, put two cups of flour and a handful of {plural noun} into a {adjective} bowl. Add one egg and a splash of milk. Stir it {adverb} with a {noun} until it looks like moon dust.\n\nNext, pour the batter into a pan. There is no gravity, so the pancakes will float away, and you must {verb} to catch them. Flip each pancake {number} times. When it turns {color}, it is ready.\n\nFinally, stack your pancakes on a plate and top them with syrup and {plural noun}. Commander Kim likes to eat hers while {verb ending in ing} past the window. Serve with a glass of {adjective} juice, and always say \"{exclamation}!\" before the first bite."}, {"id": "space-06", "theme": "Space", "title": "An Interview with the Moon", "text": "Today our class newspaper got to interview the moon! The moon was very polite and only a little bit sleepy.\n\nFirst, we asked what it does all day. \"Mostly I float around Earth and look {adjective},\" the moon said. \"On weekends I like to {verb} with the stars.\" Then we asked about its favorite food. \"Cheese, of course,\" it said. \"But I also love a big bowl of {plural noun}.\"\n\nNext, we asked who comes to visit. \"Astronauts, sometimes,\" said the moon. \"The last one brought me a {noun} as a present and {past tense verb} across my craters for an hour. It was very {adjective}.\"\n\nLast, we asked for advice for kids. \"Always eat your {food},\" the moon said {adverb}. \"Wear a {color} hat when it is chilly. And never stop {verb ending in ing} before bedtime.\" Then it waved goodbye and went back to work."}, {"id": "space-07", "theme": "Space", "title": "Captain's Log, Day Three", "text": "Captain's log, day three. Our rocket is flying past Jupiter, and everything is going {adverb}. The crew had {plural noun} for breakfast again. Nobody complained.\n\nAt ten o'clock, a {adjective} comet zoomed past the window. It was shaped exactly like a {noun}. My copilot, a dog named Biscuit, {past tense verb} at it until it was gone. Biscuit is the best copilot in the whole galaxy, but he still does not know how to {verb}.\n\nAt lunch, the ship's computer said the engine was making a funny noise, like \"{sound}.\" I fixed it with tape and two {plural noun}. Then I took a short nap.\n\nTomorrow we will land on a small planet covered in {plural noun}. I plan to spend the whole day {verb ending in ing}. I will bring my {adjective} flag and a snack for Biscuit."}, {"id": "space-08", "theme": "Space", "title": "How to Pack for Saturn", "text": "Going to Saturn? Saturn is very far away, so you need to pack carefully. Here is what to bring.\n\nFirst, pack a warm coat and {number} pairs of socks. Saturn is chilly, and the wind blows {adverb}. Next, bring a {adjective} helmet. The best helmets are round, clear, and about the size of a {noun}.\n\nDo not forget your snacks. Most travelers bring crackers, apples, and a bag of {plural noun}. If you want to {verb} on Saturn's rings, you will also need roller skates and a {color} map.\n\nFinally, pack something to do on the long ride. Many kids bring a book about {plural noun} or spend the trip {verb ending in ing} with their family. When you land, the Saturn welcome team will shake your {body part} and hand you a {adjective} snow cone."}, {"id": "space-09", "theme": "Space", "title": "Welcome Aboard Rocket Flight Nine", "text": "Hello, passengers, and welcome aboard Rocket Flight Nine to the moon! This is your captain talking. Our trip will take about {number} hours. Please keep your seat belts on and your {plural noun} under your seat.\n\nIn a few minutes, a robot will come by with snacks. Today we have peanuts, orange slices, and warm {plural noun}. If you feel {adjective}, please press the blue light above your seat, and a helper will bring you a {noun}.\n\nOn the left side of the rocket, you can see Earth. It looks very small and {adjective} from up here. On the right side, you can see a family of space ducks {verb ending in ing} past the window. Please do not {verb} at them. They are shy.\n\nWe will land {adverb} on the moon at lunchtime. Thank you for flying with us, and have a {adjective} day."}, {"id": "space-10", "theme": "Space", "title": "Letter Home from Space Camp", "text": "Dear Mom and Dad,\nSpace camp is going great! My bunk bed is shaped like a rocket, and my counselor, Ms. Rivera, is very {adjective}. Every morning we wake up at six and eat a bowl of {plural noun}.\n\nOn Monday we practiced floating in the big pool. I {past tense verb} so well that Ms. Rivera gave me a gold star. On Tuesday we built model rockets out of cardboard and {plural noun}. Mine flew {adverb} all the way over the {noun} before it landed.\n\nTonight we are having a star party. We will look through a giant telescope and try to {verb} the Big Dipper. My friend Max says he once saw a planet that looked exactly like a {food}.\n\nPlease send more socks and a {adjective} flashlight. I miss you and the {animal} very much.\nLove,\nJordan"}, {"id": "robots-01", "theme": "Robots", "title": "Meet Your New Helper Robot", "text": "Congratulations on your new Helper Robot 3000! Please read these instructions before you turn it on.\n\nTo start your robot, pull the {adjective} lever on its back and say its name {adverb}. It will open its eyes, beep twice, and ask for a {noun}. This is normal. Your robot can sweep the floor, fold the laundry, and {verb} while you sleep.\n\nEvery night, plug your robot into the wall and give it a snack of {number} {plural noun}. Do not let it near water or {plural noun}. If your robot starts {verb ending in ing} in the kitchen, it is just happy.\n\nIf you have a problem, check the little screen on its chest. A {color} light means it needs a nap. A blinking light means it {past tense verb} into the closet again. Please call our {adjective} helper line any time, day or night."}, {"id": "robots-02", "theme": "Robots", "title": "Diary of a Robot Who Loves to Dance", "text": "Dear Diary,\nMy name is Unit Six. I work at the cookie factory, where I put sprinkles on cookies all day. It is a {adjective} job, but secretly I want to be a dancer.\n\nToday after work, I practiced in the parking lot. First I spun around {number} times. Then I tried to {verb} like the people on TV. My arms went one way and my wheels went the other way, and I {past tense verb} right into a {noun}.\n\nA little girl named Rosa saw me. She did not laugh. She showed me a dance called the {silly word}. You wiggle your {body part}, clap your hands {adverb}, and spin like a washing machine.\n\nTomorrow I will teach the dance to the other robots. We will practice it every day at lunch, even while {verb ending in ing}. My boss will be so {adjective}."}, {"id": "robots-03", "theme": "Robots", "title": "Rules for the Robot Science Fair", "text": "Welcome to the Maple Street Robot Science Fair! Every robot must follow these rules.\n\nAll robots must be shorter than the gym door and lighter than a {noun}. Each robot must do one helpful job, like sweeping, sorting socks, or carrying {number} {plural noun} at once. Robots may not {verb} during the judging. Last year a robot did that, and the judges were {adjective} for a week.\n\nPlease keep your robot's battery charged. If your robot runs out of power, it might start {verb ending in ing} in the corner. Please do not feed your robot {plural noun}. It is bad for the wires.\n\nFirst prize is a shiny trophy and a {adjective} ribbon. Mr. Ortiz, our judge, will walk {adverb} past each table and take notes. Good luck, and may the best robot {verb}!"}, {"id": "robots-04", "theme": "Robots", "title": "Wanted: A Robot to Walk the Dog", "text": "Wanted: one friendly robot to walk our dog, Noodle. Noodle is small, fluffy, and very {adjective}. He weighs about as much as a {noun}.\n\nNoodle needs a walk every morning at seven. He likes to stop and sniff every tree, mailbox, and {noun} on our street. The robot must hold the leash {adverb} and never let Noodle {verb} in the mud.\n\nAfter the walk, the robot will give Noodle a bath and a treat shaped like a {food}. Noodle also likes to hear songs about {plural noun}. Our last robot sang to him every day, but it {past tense verb} so loudly that the neighbors closed their windows.\n\nThe pay is {number} shiny bolts a week and all the oil you want. If you are good at {verb ending in ing}, please knock on the blue door at our house."}, {"id": "robots-05", "theme": "Robots", "title": "Robot Wins the Town Pie Contest", "text": "This just in from the Pine Hill Fair! For the first time ever, a robot has won the town pie contest. The robot, named Gizmo, baked a {adjective} pie filled with apples and {plural noun}.\n\nThe judges took one bite and {past tense verb} right out of their chairs. \"It tastes like {food} and sunshine,\" said Judge Patel. \"I have never had anything like it.\" Gizmo says the secret is to stir the filling {adverb} and to {verb} while the pie bakes.\n\nLast year's winner, Mrs. Green, was a good sport. She shook Gizmo's metal {body part} and asked for the recipe. Gizmo printed it out on a long strip of paper.\n\nGizmo won a blue ribbon and a brand-new {noun}. Next year, Gizmo plans to bake {number} pies and spend the summer {verb ending in ing} at the beach."}, {"id": "robots-06", "theme": "Robots", "title": "Robo-Chef's Famous Tuesday Soup", "text": "Hello, I am Robo-Chef, and this is my famous Tuesday soup. It is the favorite soup of everyone at the robot repair shop.\n\nFirst, fill a big pot with water and three {plural noun}. Turn on the stove and wait until the water is {adjective}. Next, chop one carrot, two potatoes, and a {noun}. Drop them in {adverb}, one at a time.\n\nNow it is time for my secret ingredient: a pinch of {plural noun}. Stir the soup with your longest {body part} for {number} minutes. If the soup starts to {verb}, that means it is almost ready.\n\nPour the soup into bowls and top each one with a little {food}. My helpers like to eat it while {verb ending in ing} by the window. Enjoy, and do not forget to {verb} your bowl when you are done!"}, {"id": "robots-07", "theme": "Robots", "title": "A Thank-You Note to My Robot Vacuum", "text": "Dear Beep-Bop,\nThank you for cleaning our house every single day. You are the most {adjective} vacuum in the whole neighborhood. You zoom {adverb} under the couch and come out covered in {plural noun}.\n\nI am sorry about last Tuesday. I did not mean to leave a {noun} in the hallway. I know it got stuck in your wheels and you {past tense verb} in a circle for an hour. Grandma says you sounded like \"{sound}\" the whole time.\n\nAlso, thank you for not eating my building blocks this week. I know you wanted to. Mom says I should {verb} my toys every night, and I will try my best.\n\nTo say thank you, I made you a sticker shaped like a {food}. I hope you like it. Please keep {verb ending in ing} and being our {adjective} friend.\nLove,\nPenny"}, {"id": "robots-08", "theme": "Robots", "title": "A Chat with the Robot Crossing Guard", "text": "This week, our school paper talked to Bolt, the robot crossing guard on Elm Street. Bolt has worked there for {number} years and has never missed a day.\n\nFirst, we asked Bolt about the best part of the job. \"I love to {verb} with the kids every morning,\" Bolt said. \"And I get to hold a {adjective} stop sign.\" Next, we asked what Bolt eats for lunch. \"Mostly oil,\" said Bolt. \"But on Fridays I have a plate of {plural noun}.\"\n\nThen we asked about the busiest day ever. Bolt said it was the day a {noun} rolled into the street and a duck family {past tense verb} right behind it. \"I stopped all the cars,\" Bolt said {adverb}. \"Everyone got across just fine.\"\n\nLast, we asked for advice. \"Always look both ways,\" said Bolt. \"Never cross while {verb ending in ing}. And wear something {color} so drivers can see you.\""}, {"id": "robots-09", "theme": "Robots", "title": "Robot Day at Oak Hill School", "text": "Good morning, Oak Hill School! This is Principal Brooks with a special announcement. This Friday is Robot Day!\n\nEvery student is invited to dress up as a robot. You can use cardboard boxes, tin foil, and as many {plural noun} as you want. Please do not wear anything bigger than a {noun}, or you will not fit through the door.\n\nIn the morning, the music teacher will teach everyone a {adjective} robot dance. You will move your arms {adverb} and say \"{silly word}\" every time you turn. At lunch, the cafeteria will serve robot pizza topped with little bolts made of {food}.\n\nIn the afternoon, we will have a parade around the playground. The best costume wins a {adjective} trophy and the chance to {verb} with me on the morning announcements. Remember, robots never run in the halls. Robots walk, and they like to {verb} quietly. Beep boop, and have a {adjective} day!"}, {"id": "robots-10", "theme": "Robots", "title": "Robot School Report Card", "text": "This is the report card for Zip, a robot in Mrs. Hall's second grade class.\n\nMath: Zip is great at counting. Zip can count to one hundred in two seconds, but sometimes says {silly word} instead of seven. Reading: Zip reads {adverb} and loves books about {plural noun}. Last week, Zip read a whole book while {verb ending in ing} on one wheel.\n\nArt: Zip painted a picture of a {adjective} {noun}. It is now hanging in the front office. Music: Zip can sing, but whenever Zip tries to {verb}, bubbles come out of its ears. Recess: Zip is very good at tag, but once Zip {past tense verb} into the sandbox and had to be shaken off.\n\nTeacher's note: Zip is a kind and {adjective} friend. Zip shares snacks and always holds the door. Next year, please send Zip to school with more oil and a {color} lunchbox."}, {"id": "superheroes-01", "theme": "Superheroes", "title": "Now Hiring: Sidekick", "text": "Now hiring! Captain Kindness is looking for a {adjective} sidekick to help around town. You will work with Captain Kindness every Saturday from nine until lunchtime.\n\nYour jobs will include helping kittens down from trees, carrying groceries for neighbors, and finding lost {plural noun}. You must be able to run {adverb}, hop over a {noun}, and {verb} without getting dizzy.\n\nEvery sidekick gets a cape, a mask, and a bright {color} belt with {number} pockets. Captain Kindness will also teach you the secret hero handshake. It uses your {body part} and a little bit of {verb ending in ing}.\n\nOur last sidekick {past tense verb} so much that he needed a long vacation. To apply, please bring a smile and a {adjective} sandwich to the library on Tuesday."}, {"id": "superheroes-02", "theme": "Superheroes", "title": "My First Week with Super Powers", "text": "Dear Diary,\nOn Monday I woke up and found out I have super powers! I can fly, but only about as high as a {noun}. I can also see through walls, but only if I wiggle my {body part} first.\n\nOn Tuesday I used my powers for good. I helped Mrs. Kim find her {adjective} glasses. They were on top of her head. Then I flew to the park and {past tense verb} with the ducks.\n\nOn Wednesday I tried to {verb} faster than a train. I went so fast that my socks flew off and landed in a pile of {plural noun}. Mom says superheroes still have to pick up their socks.\n\nToday I made my own cape out of a blanket and {number} {plural noun}. Tomorrow I will practice {verb ending in ing} and flying {adverb} at the same time."}, {"id": "superheroes-03", "theme": "Superheroes", "title": "Rules at Superhero Headquarters", "text": "Welcome to Superhero Headquarters! Please read these rules before you put on your cape.\n\nRule one: No flying in the hallways. Last week Thunder Girl flew into a {noun} and tipped over the lemonade. Rule two: Please hang your cape on a hook, not on the {plural noun}. Rule three: Please do not {verb} on the new carpet in muddy boots.\n\nRule four: The kitchen is for snacks only. Our cook, Mr. Fox, makes a {adjective} sandwich with cheese and {plural noun}. Please eat it {adverb}, and do not use your heat vision to warm it up.\n\nRule five: When the hero phone rings, answer it right away. Someone may need help finding a lost {animal} or carrying {number} heavy bags. Every hero must be ready to go, even while {verb ending in ing}. Thank you, and have n a {color} cape and sat in Ms. Gray's chair.\n\nFirst, we asked how he got his powers. \"I ate a {adjective} sandwich at the library,\" he said. \"The next morning, I could lift {number} {plural noun} with one finger.\" Then we asked about his favorite power. \"Flying,\" he said. \"But I also like to {verb} really fast.\"\n\nNext, we asked about his best rescue ever. He said a little boy once lost his {noun} at the park. Captain Helpful searched {adverb} for three hours and finally found it under a slide.\n\nLast, we asked what kids can do to be heroes. \"Be kind, share your {plural noun}, and help your family,\" he said. \"And never stop {verb ending in ing}.\" Then he waved and {past tense verb} out the door."}, {"id": "superheroes-07", "theme": "Superheroes", "title": "Letter Home from Hero Camp", "text": "Dear Grandma,\nHero camp is the best place ever! My cabin is called Blue Lightning, and it has {number} bunk beds. My camp leader is named Captain Sunny. She is very {adjective} and can fly backwards.\n\nEvery morning we practice our powers. Yesterday I practiced super strength by lifting a {noun} over my head. My friend Leo practiced being invisible, but we could still see his {body part}. In the afternoon we learned how to {verb} on the soft grass.\n\nAt dinner we eat hero stew, which is mostly carrots and {plural noun}. After that we sit by the campfire and sing songs about {plural noun}. Captain Sunny sings {adverb}. Last night I {past tense verb} so hard that I fell asleep before the song ended.\n\nI will be home on Sunday. Please save me a slice of pie and tell the dog I have been {verb ending in ing} every day.\nLove,\nAva"}, {"id": "superheroes-08", "theme": "Superheroes", "title": "How to Design Your Own Cape", "text": "Every hero needs a good cape. Here is how to make your very own.\n\nFirst, find an old towel or blanket. Ask a grown-up first! Lay it flat on the floor and decorate it with markers, stickers, and {plural noun}. Many heroes like to draw  Here is how to use it.\n\nStep one: Unroll the map {adverb}. Old maps are very {adjective} and can rip if you pull too hard.\n\nStep two: Find the big red X. That is where the treasure is. If the X is next to a drawing of a {noun}, you are going the right way.\n\nStep three: Count your steps. Most maps say something like \"Walk ten steps past the {adjective} tree, then hop like a {animal}.\" Always do what the map says, even the hopping part.\n\nStep four: Start {verb ending in ing}. Real pirates dig with a shovel, but my uncle Pete uses a {noun}.\n\nStep five: Open the chest. Inside you might find gold coins, shiny jewels, or {number} {plural noun}. Last summer my sister found a whole box of {plural noun}. She {past tense verb} all the way home."}, {"id": "pirates-06", "theme": "Pirates", "title": "Pirate News at Six", "text": "Good evening, and welcome to Pirate News at Six. I'm Polly Anchor.\n\nOur top story tonight: Captain Bea and her crew have found the lost treasure of Pickle Island! The treasure was buried under a giant {noun} for {number} years. When the crew opened the chest, they found gold coins, silver cups, and a pile of {adjective} {plural noun}. Captain Bea was so happy that she {past tense verb} right there on the sand.\n\nIn other news, the town parrot contest was held today. The winner was a parrot named Kiwi, who can say \"{exclamation}\" and {verb} at the same time. The judges said Kiwi was the most {adjective} bird they had ever seen.\n\nNow for the weather. Tomorrow will be sunny with a chance of {plural noun} in the afternoon. Sailors should bring a {noun} and sail {adverb}. Good night, mateys!"}, {"id": "pirates-07", "theme": "Pirates", "title": "Cook Marigold's Famous Ship Stew", "text": "Every Friday on the good ship Snapdragon, Cook Marigold makes her famous ship stew. The whole crew lines up with their bowls. Here is her secret recipe.\n\nYou will need one big pot, three carrots, one {adjective} potato, and a cup of {food}.\n\nFirst, fill the pot with water and stir it {adverb} with a wooden spoon. Next, add the carrots, the potato, and a spoonful of {plural noun}. Let it bubble for one hour. While you wait, you can {verb} around the kitchen.\n\nWhen the stew turns {color}, it is ready. Cook Marigold always adds a tiny pinch of {plural noun} at the very end. She says that is the secret.\n\nServe it hot with a slice of bread. The crew says it tastes like a {adjective} {noun}. Last Friday, Captain Lou ate three bowls and then {past tense verb} until bedtime."}, {"id": "pirates-08", "theme": "Pirates", "title": "A Chat with Captain Crackers", "text": "Today our class newspaper is talking to Captain Crackers, the oldest parrot on Coconut Bay.\n\nQ: Hello, Captain Crackers! How old are you?\nA: I am {number} years old. That is very old for a parrot.\n\nQ: What is your favorite thing about being a pirate parrot?\nA: I love sitting on the captain's {body part} and looking for treasure. Also, the snacks. Our cook makes {adjective} crackers with {plural noun} on top.\n\nQ: Have you ever found real treasure?\nA: Yes! Once I found a chest full of {plural noun} buried under a {noun}. The captain {past tense verb} with joy.\n\nQ: Can you say any words?\nA: I can say \"Hello,\" \"Ahoy,\" and \"{silly word}.\" I am learning to {verb}, too, but it is hard with wings.\n\nQ: Any advice for young pirates?\nA: Always be {adjective}, brush your feathers {adverb}, and never forget your {noun}."}, {"id": "pirates-09", "theme": "Pirates", "title": "Postcard from Treasure Island", "text": "Dear Grandpa,\n\nGreetings from Treasure Island! Our pirate ship got here on Tuesday after sailing for {number} whole days. The water here is {color} and the sand feels like {plural noun} between my toes.\n\nThis morning Captain Nell let me hold the treasure map. We walked past a waterfall and a very {adjective} cave until we found the big X. I dug {adverb} for an hour. Inside the chest were old coins, a golden spoon, and a {adjective} {noun}. The captain was so happy that she {past tense verb} all the way back to the ship.\n\nTonight we are having a beach party. Everyone is {verb ending in ing} around the campfire, and the ship's parrot is wearing a tiny {noun} on his head. I wish you could {verb} with us.\n\nLove,\nMaya"}, {"id": "pirates-10", "theme": "Pirates", "title": "Lost and Found on the Jolly Muffin", "text": "Attention, crew of the Jolly Muffin! This is your captain speaking. Our Lost and Found box is full again, so please listen carefully.\n\nWe found one striped sock, two eye patches, and a {adjective} {noun} under the map table. If they belong to you, please come and get them.\n\nSomeone left {number} {plural noun} in the captain's hammock. That is not a good place for them. They made the hammock very {adjective}.\n\nAlso, our parrot, Sunny, has been {verb ending in ing} on the mast since breakfast. We think he wants his {noun} back. If you borrowed it, please return it {adverb}.\n\nLast of all, whoever used the cooking pot to bury treasure, please {verb} to the deck right away. Cook Ada needs it to make {food} for dinner.\n\nThank you, crew. Now let's all shout \"{exclamation}!\" and get back to work."}, {"id": "under-the-sea-01", "theme": "Under the Sea", "title": "First Day at Coral Reef School", "text": "Good morning, little fish! Welcome to Coral Reef School. My name is Mrs. Finley, and I will be your teacher this year.\n\nClass starts when the big shell bell rings. Please swim in a straight line and do not {verb} in the halls. Last year a young crab did that, and he {past tense verb} right into the principal.\n\nIn the morning we will learn to read, count bubbles, and swim {adverb}. After lunch, Mr. Inky the octopus will teach art. He has eight arms, so he can paint {number} {plural noun} at the same time.\n\nFor snack, please bring seaweed and a little bag of {plural noun}. Our class pet is a {adjective} sea snail named Pudding. She is very shy, so please talk to her {adverb}.\n\nI just know this will be a {adjective} year. Now let's all wave our {plural noun} and say hello!"}, {"id": "under-the-sea-02", "theme": "Under the Sea", "title": "The Diary of Olive the Octopus", "text": "Dear Diary,\n\nToday was a busy day. I woke up in my cave and put on all eight of my {plural noun}. That takes a long time when you have eight arms.\n\nFor breakfast I ate a bowl of {food} with my best friend, a crab named Nibbles. Then we went to the reef to play hide and seek. I am really good at hiding because I can turn {color}. Nibbles looked for me for {number} hours. He finally found me when I {past tense verb} by accident.\n\nIn the afternoon, I helped Grandma Squid in her garden. She grows the most {adjective} {plural noun} in the whole ocean. Then we sat on a rock and watched the whales go {verb ending in ing} by.\n\nNow it is bedtime. I am tucked in with my {adjective} blanket and a {noun}. Tomorrow I will try to {verb} with all eight arms at once."}, {"id": "under-the-sea-03", "theme": "Under the Sea", "title": "Rules for the Mermaid Library", "text": "Welcome to the Mermaid Library at the bottom of Shell Bay. We have over {number} books, and all of them are waterproof. Please follow these rules.\n\n1. Swim quietly. If you need to talk, please whisper like a {animal}.\n\n2. Do not let the sea horses {verb} on the shelves. They are not allowed to check out books until they are {adjective}.\n\n3. Please return your books in one week. If a book is late, the librarian, Miss Coral, will {verb} at you {adverb}.\n\n4. No snacks near the books. The last time someone brought {plural noun} in here, a whole school of fish {past tense verb} into the picture book corner.\n\n5. Story time is every Tuesday. This week Miss Coral will read a book about a {adjective} {noun} who learns to {verb}.\n\nThank you, and happy reading! Remember, a good book is better than a pile of {plural noun}."}, {"id": "under-the-sea-04", "theme": "Under the Sea", "title": "Chef Clawdia's Seaweed Smoothie", "text": "Hello, ocean friends! I am Chef Clawdia, the best crab cook on the whole reef. Today I will teach you how to make my famous seaweed smoothie.\n\nFirst, find a big clam shell to use as a bowl. Fill it with two handfuls of green seaweed and one {adjective} {noun}. Next, add a scoop of {food} and {number} tiny {plural noun}. My grandpa always added those, and he was the happiest crab in the sea.\n\nNow it is time to mix. Hold the shell with both claws and shake it {adverb}. If you are a fish, you can ask a friendly octopus to help. While it shakes, you can {verb} nearby.\n\nWhen the smoothie turns {color}, it is ready! Pour it into a cup and drink it while {verb ending in ing}. It tastes like a {adjective} sock, but in a good way.\n\nMy customers say it makes them want to {verb} all day long. Enjoy, and remember to share with your {plural noun}!"}, {"id": "under-the-sea-05", "theme": "Under the Sea", "title": "Meet Grandpa Shelby the Sea Turtle", "text": "This week, the Reef Times talked to Grandpa Shelby, the oldest sea turtle in the bay.\n\nQ: How old are you, Grandpa Shelby?\nA: I am {number} years old, give or take a week.\n\nQ: What did you do when you were young?\nA: I swam all over the world. My favorite place was a beach where the sand was made of {plural noun}.\n\nQ: What is your favorite food?\nA: Sea grape jam on toast. Also {food}, but only on Sundays.\n\nQ: How do you stay so healthy?\nA: Every morning I like to {verb} for ten minutes and eat a {adjective} breakfast. I also take a long nap inside my {adjective} shell.\n\nQ: What is the secret to a long, happy life?\nA: Swim {adverb}, be kind to every {noun}, and never forget to say \"{silly word}\" to your friends.\n\nQ: Thank you, Grandpa Shelby!\nA: You are welcome. Now please excuse me. It is time for me to go {verb ending in ing}."}, {"id": "under-the-sea-06", "theme": "Under the Sea", "title": "Whale Sings at Ocean Concert", "text": "This is Bubbles McFin reporting live from the Deep Blue Concert Hall.\n\nLast night, more than {number} sea creatures came to hear Wanda the Whale sing her new song. Wanda wore a {adjective} hat and a necklace made of {plural noun}. When she began to sing, the whole ocean shook {adverb}.\n\nThe crowd loved it. A group of clownfish {past tense verb} in the front row, and a shy jellyfish started {verb ending in ing} in the back. Even the grumpy old lobster said the song made him want to {verb}.\n\nAfter the show, I asked Wanda where she got the idea for her song. She said, \"I was eating a bowl of {food} and thinking about my {noun}.\" Then she swam away to say hello to her fans.\n\nWanda will sing again next Friday. Tickets cost one shiny shell and a {adjective} {noun}. Back to you at the news desk!"}, {"id": "under-the-sea-07", "theme": "Under the Sea", "title": "Help Wanted: Jellyfish Night-Light", "text": "HELP WANTED at the Deep Dark Trench Hotel!\n\nOur hotel is at the very bottom of the ocean, where it is very dark. Our guests keep bumping into each other on the way to bed. We need a friendly jellyfish to glow in the hallway every night.\n\nThe right jellyfish must be able to glow {color} and stay {adjective} all night long. You will also help guests find their rooms. Some guests are very {adjective}, like Mr. Grumble the walrus, who sleeps in a {noun} and asks for {number} pillows.\n\nOther jobs include reading bedtime stories to baby squids, singing softly to the {plural noun}, and reminding Mr. Grumble to {verb} more quietly. You must not be {verb ending in ing} on the job. Last week our old night-light {past tense verb} instead of glowing, and everyone woke up in the wrong room.\n\nPay is three shells a week and all the {plural noun} you can eat. To apply, please swim {adverb} to the front desk."}, {"id": "under-the-sea-08", "theme": "Under the Sea", "title": "Postcard from the Yellow Submarine", "text": "Dear Aunt June,\n\nGreetings from the bottom of the sea! Dad and I are riding in a yellow submarine with a round window. So far we have seen {number} {plural noun} swim past us.\n\nThis morning a curious octopus stuck to the window and stared at my {body part}. Then she waved all eight arms and {past tense verb} away. Dad was so surprised that he dropped his {noun}.\n\nAt lunch we parked next to a coral reef. The coral was {color} and looked like a giant {adjective} {noun}. A school of tiny fish swam by {adverb}, and I think they were {verb ending in ing}.\n\nTomorrow we are going to visit an old sunken ship to look for treasure. Dad says we might also see a {adjective} whale. I hope it wants to {verb} with us.\n\nLove,\nOwen"}, {"id": "under-the-sea-09", "theme": "Under the Sea", "title": "How to Throw a Pufferfish Party", "text": "Your friend Pip the pufferfish is having a birthday! Here is how to throw the perfect party.\n\nStep one: Send the invitations. Write them on flat shells and tell every guest to bring a {noun}.\n\nStep two: Decorate the reef. Hang seaweed streamers and blow up a bunch of {plural noun}. Do not use real balloons. Pip might think they are his cousins.\n\nStep three: Make the cake. Pufferfish love cake made of sand and {food}. Put a {adjective} candle on top.\n\nStep four: Plan some games. Pip loves to play Pin the Tail on the {animal}. He also likes musical rocks, where everyone has to {verb} until the music stops.\n\nStep five: Get ready for the surprise. When Pip swims in {adverb}, everyone shouts \"{exclamation}!\" When Pip gets surprised, he puffs up and looks like a giant {adjective} {noun}.\n\nAt the end, Pip will be so happy that he {past tense verb} all the way home."}, {"id": "under-the-sea-10", "theme": "Under the Sea", "title": "Letter to My Pen Pal Coco", "text": "Dear Coco,\n\nThank you for your letter! I loved hearing about your new home in the sea anemone. It sounds very {adjective} and cozy.\n\nThings are busy here in Sandy Cove. Last week my little brother learned how to {verb}. He practices all day long, even at dinner. Mom says he is the most {adjective} starfish she has ever seen.\n\nOn Saturday, we went to the Reef Fair. I rode the giant clam ride {number} times and won a prize for {verb ending in ing}. The prize was a jar of {plural noun}. I am saving one for you.\n\nAlso, guess what? A sea turtle moved in next door. He is very nice, but every morning he {past tense verb} so loudly that our whole rock shakes. Dad says we should bake him a {noun} to say hello.\n\nPlease write back soon and tell me about your {plural noun}. I miss you {adverb}!\n\nYour friend,\nStella"}, {"id": "beach-day-01", "theme": "Beach Day", "title": "My Beach Bag Packing List", "text": "Tomorrow is Beach Day! My mom said I could pack my own bag this year, so I made a list.\n\nThings to bring: sunscreen, so my nose does not get pink. A big striped towel. Two {adjective} buckets. A shovel for digging up {plural noun}. My lucky {noun}. Snacks: grapes, crackers, and a box of {food}.\n\nThings my little brother wants to bring: his {adjective} dinosaur, exactly {number} {plural noun}, and a pet {animal}. Mom said no to all of them.\n\nDad is in charge of the umbrella. Last year he {past tense verb} while he was carrying it, and it flew away. This year he says he will hold it {adverb}.\n\nI am so excited that I cannot stop {verb ending in ing}. I hope tomorrow is the most {adjective} day ever!"}, {"id": "beach-day-02", "theme": "Beach Day", "title": "How to Build the Best Sandcastle", "text": "Building a sandcastle is easy if you follow these steps. My big sister Rosie taught me, and she has won the Sandy Shores contest {number} times.\n\nFirst, find a good spot. Not too close to the water, and not too close to the family with the {adjective} radio.\n\nNext, fill your bucket with wet sand. Pat it down {adverb} and flip it over. Now you have a tower! Make three more and put a {noun} on top of each one.\n\nThen dig a moat all the way around. Rosie says a good moat keeps out crabs, seagulls, and {plural noun}. Last year a seagull landed on her castle anyway and {past tense verb} on the tallest tower.\n\nNow decorate. Use shells for windows and seaweed for the door. Rosie always adds a few {adjective} {plural noun} to make it fancy.\n\nLast of all, stand back and admire your castle. If anyone asks who built it, put your hands on your hips and say \"{silly word}!\" Then go {verb ending in ing} into the waves to celebrate."}, {"id": "beach-day-03", "theme": "Beach Day", "title": "Lifeguard Larry's Beach Rules", "text": "Hello, beach friends! I am Lifeguard Larry. I sit in the tall white chair and help everyone stay safe and happy. Please follow my beach rules.\n\nRule 1: Always swim with a grown-up nearby. Grown-ups are great at holding towels and {verb ending in ing}.\n\nRule 2: Do not feed the seagulls. They will follow you home and eat all of your {plural noun}.\n\nRule 3: Put on sunscreen every two hours. Do not forget the backs of your {plural noun}.\n\nRule 4: No digging holes bigger than a {noun}. Last week someone dug a hole so big that a family of {plural noun} moved in.\n\nRule 5: If you hear my whistle, please {verb} out of the water {adverb} and come see me. Usually it just means I found a {adjective} shell and want to show you.\n\nThank you for listening! Have a {adjective} day, and remember to always wear your {noun}."}, {"id": "beach-day-04", "theme": "Beach Day", "title": "Dad and the Runaway Umbrella", "text": "Saturday. Today our family went to the beach. Dad carried a giant striped umbrella that he bought at a yard sale. He said it was the most {adjective} umbrella in the whole world.\n\nFirst, Dad tried to stick it in the sand. It fell over. Then he tried again, and it {past tense verb} away. My little sister yelled \"{exclamation}!\" and we all chased it down the beach.\n\nThe umbrella rolled past a lady reading a book, two kids building a {noun}, and a dog named Biscuit. Biscuit started {verb ending in ing} and chased it too.\n\nFinally the umbrella stopped next to a man selling {plural noun}. He helped Dad dig a hole {number} feet deep. Now the umbrella will never move again. We sat under it and ate sandwiches filled with {food}.\n\nOn the way home, Dad said next time we should {verb} instead. Mom laughed {adverb} and said she would bring a {adjective} tent."}, {"id": "beach-day-05", "theme": "Beach Day", "title": "Postcard from Seashell Beach", "text": "Dear Grandma,\n\nWe are having the best time at Seashell Beach! The water is warm and the sand is as soft as a {noun}.\n\nThis morning I found {number} seashells and a {adjective} rock that looks just like a potato. I am bringing it home for you. Then I went swimming with my cousin Mia. We pretended we were {plural noun} and splashed {adverb} until lunch.\n\nFor lunch we had a picnic on our big blue blanket. A sneaky seagull took Mia's sandwich and flew away {verb ending in ing}. Mia was not even upset. She said the seagull looked very {adjective}.\n\nTonight we are going to watch the sunset and eat {food} by the fire. Dad says he will teach us to {verb} like a crab. I will practice so I can show you.\n\nI miss you! Please give your cat a {adjective} hug from me.\n\nLove,\nLeo"}, {"id": "beach-day-06", "theme": "Beach Day", "title": "Big News from the Sandcastle Contest", "text": "Good afternoon! This is Sandy Waves with Beach News. I am standing on Pebble Beach at the yearly sandcastle contest.\n\nThis year {number} families came to build. The judges walked up and down the beach looking for the most {adjective} castle. One family built a castle shaped like a giant {noun}. Another family made a tower out of sand and {plural noun}. It was very tall and very {adjective}.\n\nBut the winner was seven-year-old Nora Lopez. Her castle had twelve rooms, a moat, and a little bridge made of {plural noun}. When the judges said her name, Nora {past tense verb} all the way to the prize table.\n\nNora won a gold trophy and a whole year of free {food}. We asked her for her secret. She said, \"You have to {verb} {adverb} and never give up.\"\n\nThat's all from the beach. Back to you, and don't forget your {noun}!"}, {"id": "beach-day-07", "theme": "Beach Day", "title": "Grandpa's Famous Beach Sandwiches", "text": "Every time we go to the beach, Grandpa makes his famous beach sandwiches. He says they are the reason we always have the best day. Here is how he makes them.\n\nYou will need two slices of bread, one slice of cheese, a spoonful of {food}, a handful of {plural noun}, and a little bit of sand. The sand is always an accident.\n\nFirst, wash your hands. Then lay the bread on a {adjective} plate. Put the cheese on top, then add the spoonful and the handful. Grandpa says to stir everything {adverb}, even though it is a sandwich. Next, squish the top slice down with your {body part}. Wrap it in a towel and put it in the cooler next to the {plural noun}.\n\nAt lunchtime, open the cooler and shout \"{exclamation}!\" That is what Grandpa always does. Then sit on the blanket and eat it while {verb ending in ing}.\n\nGrandma says the sandwiches taste like a {adjective} {noun}. Last time, Grandpa said that meant she loved them, and he {past tense verb} with joy."}, {"id": "beach-day-08", "theme": "Beach Day", "title": "An Interview with Gary the Seagull", "text": "Our class went to the beach for a field trip, and we got to interview a seagull named Gary.\n\nQ: Hi, Gary! What do you do all day?\nA: I fly around the beach and look for snacks. My favorite snack is {food}, but I will also eat {plural noun} if nobody is looking.\n\nQ: Where do you live?\nA: I live on top of the lifeguard chair. It is very {adjective} up there, and I can see everything.\n\nQ: Do you have any hobbies?\nA: Yes! I like to {verb} with my friends and collect shiny {plural noun}. I keep them in a {noun} under the pier.\n\nQ: What is the hardest part of being a seagull?\nA: The waves. Yesterday a big one splashed me, and I {past tense verb} for an hour.\n\nQ: Do you } on it. If you see it, please shout \"{exclamation}!\" and wave your {plural noun} in the air.\n\nThank you, and have a {adjective} day at the beach!"}, {"id": "dinosaurs-01", "theme": "Dinosaurs", "title": "My Pet Dinosaur's First Week", "text": "Monday: Today a baby dinosaur hatched in our backyard. Mom says he can stay if he is {adjective} and cleans up after himself. I named him Sir {silly word}.\n\nTuesday: My dinosaur ate all of Dad's {plural noun} for breakfast. Then he tried to {verb} on the couch. The couch is now very flat.\n\nWednesday: I took him for a walk, and he {past tense verb} at every mailbox on our street. Mrs. Green next door gave him a {noun} to chew on, and he loved it. That night we had a bath. He splashed {adverb} until the whole house smelled like {food}.\n\nFriday: He is too big for my room now, so he sleeps in the garage next to the {noun}. Every night I tuck him in and sing him a song about {verb ending in ing}. He is the best pet ever."}, {"id": "dinosaurs-02", "theme": "Dinosaurs", "title": "Rules for the Dinosaur Petting Farm", "text": "Welcome to Happy Tails Dinosaur Farm! Please read these rules before you visit the dinosaurs.\n\nRule one: Do not feed the Stegosaurus any {plural noun}. Last week someone did, and she {past tense verb} for three days. Rule two: The baby Triceratops is shy. Please talk to her {adverb} and never wear a {color} hat near her pen.\n\nRule three: You may ride the Brontosaurus, but only if you hold on to her {body part} and sing a song about {plural noun}. She does not like quiet riders. Rule four: If a dinosaur starts {verb ending in ing}, please stand back. This means she is very {adjective} and wants a nap.\n\nRule five: Please do not {verb} in the gift shop. The baby Pterodactyls are trying to sleep on the {noun}. Thank you, and have a {adjective} day!"}, {"id": "dinosaurs-03", "theme": "Dinosaurs", "title": "Letter Home from Dino Camp", "text": "Dear Mom and Dad,\n\nCamp is going great! On the first day, our counselor, Ms. Bonnie, taught us how to {verb} like a Velociraptor. I was the most {adjective} one in my group.\n\nYesterday we went on a hike to look for dinosaur footprints. We found {number} footprints, plus a giant {noun} stuck in the mud. Ms. Bonnie says it is very old and very {adjective}. For lunch the camp cook made dinosaur-shaped sandwiches with {food} on top. My new friend Theo ate his {adverb} and asked for more.\n\nTonight is the campfire. We will sit in a circle, hold up our {plural noun}, and tell funny stories about a dinosaur who loved {verb ending in ing}. Please send more socks and a {noun}. I miss you!\n\nLove,\nYour kid"}, {"id": "dinosaurs-04", "theme": "Dinosaurs", "title": "Big News from Room 12", "text": "Good evening. This is Channel 7 News with a {adjective} story.\n\nThis morning at Maple Street School, a giant egg was found in the sandbox. By lunchtime it had hatched, and out came a baby dinosaur wearing a {noun} on its head. \"I was just {verb ending in ing} on the swings,\" said first grader Ava. \"Then the egg went crack! The baby looked at me and {past tense verb}.\"\n\nPrincipal Jones says the dinosaur may stay until its mom comes to pick it up. So far it has eaten {number} {plural noun} and learned to {verb} during recess. It is now the class line leader.\n\nThe baby dinosaur's favorite subject is {noun}. Its teacher says it listens {adverb} and only roars at story time. Back to you in the studio, {name}!"}, {"id": "dinosaurs-05", "theme": "Dinosaurs", "title": "Mama Stegosaurus's Leafy Pancakes", "text": "This recipe has been in our dinosaur family for a very long time. It makes enough pancakes for one hungry Stegosaurus or {number} small children.\n\nYou will need two cups of flour, a bucket of leaves, a big spoon, and a {adjective} {noun}. First, put the leaves in a bowl and stir them {adverb}. Next, add the flour and a handful of {plural noun}. Mama Stegosaurus says this is the secret part.\n\nNow it is time to {verb}. Do this for ten minutes, or until the batter turns {color}. Then pour it into a pan the size of a swimming pool. When the pancakes start {verb ending in ing}, flip them with your tail. Serve them warm with a side of {food}.\n\nMama Stegosaurus always says, \"A good pancake should be {adjective}!\""}, {"id": "dinosaurs-06", "theme": "Dinosaurs", "title": "Wanted: Dinosaur Babysitter", "text": "Wanted: A friendly babysitter for three baby dinosaurs. You must be {adjective} and good at reading bedtime stories.\n\nThe babies are named Dot, Rex, and Pebble. Dot likes to {verb} on the kitchen table. Rex collects {plural noun} and keeps them under his bed. Pebble will only eat {food}, and only with a spoon.\n\nYour jobs will include giving baths, brushing their {plural noun}, and singing {adverb} until everyone falls asleep. You may also need to find Pebble, who loves {verb ending in ing} behind the couch. You will be paid one shiny {noun} per hour, plus all the leaves you can eat.\n\nIf you would like this job, please {verb} at our front door. Do not ring the bell. The babies {past tense verb} for a whole hour the last time someone rang it."}, {"id": "dinosaurs-07", "theme": "Dinosaurs", "title": "Welcome to the Fossil Hall", "text": "Hello, everyone, and welcome to the Fossil Hall! My name is Mr. Pine, and I will be your tour guide today. Please stay with the group and keep your {plural noun} to yourselves.\n\nOn your left is the biggest dinosaur skeleton in the whole state. Scientists found it in a farmer's {noun} in 1952. They think this dinosaur was very {adjective} and liked to {verb} in the afternoon. Over here is a real dinosaur footprint. If you look closely, you can see it was made by a dinosaur wearing {color} socks.\n\nThis glass case holds a fossil of a dinosaur {body part}. It is the most {adjective} treasure in our museum. Please do not tap on the glass. The last boy who did that {past tense verb} all the way home.\n\nOur tour ends in the gift shop, where you can buy a toy dinosaur, a postcard, or a {noun}. Thank you for {verb ending in ing} with me today!"}, {"id": "dinosaurs-08", "theme": "Dinosaurs", "title": "An Interview with a Triceratops", "text": "Today our class reporter, Max, sat down with Tina the Triceratops.\n\nMax: Thank you for meeting with me. What do you do every morning?\nTina: First I brush my three horns. Then I eat a big bowl of {plural noun} with {food} on top, and I go for a {adjective} walk.\n\nMax: What is your favorite hobby?\nTina: I love {verb ending in ing}. I also play the {noun} in a band with two Stegosauruses.\nMax: What makes you laugh?\nTina: When my friend Gary tries to {verb}. He is not very good at it, but he tries {adverb}.\n\nMax: What advice do you have for kids?\nTina: Always eat your vegetables, and never {verb} with your mouth full. Also, keep a {noun} in your pocket, just in case.\nMax: Thank you, Tina!\nTina: You are welcome. Please tell everyone at school I said \"{exclamation}!\""}, {"id": "dinosaurs-09", "theme": "Dinosaurs", "title": "How to Give a Brontosaurus a Bath", "text": "Giving a Brontosaurus a bath is a big job. Follow these steps and you will do great.\n\nStep one: Fill the bathtub with warm water and {number} {plural noun}. Brontosauruses like a full tub. Step two: Ask your Brontosaurus to climb in {adverb}. This may take a while, because her neck is as long as a {noun}.\n\nStep three: Scrub her back with a {adjective} sponge. If she starts {verb ending in ing}, that means she is happy. Step four: Wash behind her ears. Brontosauruses are very ticklish there, so try not to {verb}. Step five: Rinse her off with the garden hose. Then dry her with every towel in the house and one {noun}.\n\nWhen you are done, give her a cookie and tell her she looks {adjective}. She will {verb} all the way to bed."}, {"id": "dinosaurs-10", "theme": "Dinosaurs", "title": "Postcard from Dinosaur Valley", "text": "Dear Grandma,\n\nGreetings from Dinosaur Valley! The weather here is warm and a little bit {adjective}. Our tent is next to a lake full of {plural noun}.\n\nYesterday a friendly Pterodactyl landed on our car and {past tense verb} on the roof for an hour. Dad took {number} pictures. Then a baby Ankylosaurus followed me around all day and tried to {verb} with my {noun}.\n\nToday we had lunch at the Long Neck Cafe. I had a {food} smoothie, and Mom had a salad made of {plural noun}. Our waiter was a Brontosaurus who talked {adverb} so he would not wake the babies. Tomorrow we are going {verb ending in ing} at Rainbow Hill. I wish you were here!\n\nLove,\nLily"}, {"id": "jungle-adventure-01", "theme": "Jungle Adventure", "title": "Greetings from the Rainforest", "text": "Dear Uncle Ben,\n\nHello from the rainforest! It rained {number} times today, and every drop was as big as a {noun}. Our guide, Rosa, showed us a tiny frog that was bright {color}. She says it sings {adverb} every night to call its friends.\n\nYesterday we crossed a rope bridge over a little stream. A monkey sat in the middle and would not move until I gave him my {plural noun}. Then he {past tense verb} and swung away.\n\nOur hotel is a treehouse. My bed is a {adjective} hammock, and a parrot outside my window says \"{silly word}\" every morning. Tomorrow we are going to {verb} down the river in a canoe. I hope I see a sloth {verb ending in ing}!\n\nYour nephew,\nSam"}, {"id": "jungle-adventure-02", "theme": "Jungle Adventure", "title": "What to Pack for the Jungle", "text": "Going on a jungle trip? Here is what every explorer needs to pack.\n\nFirst, bring a raincoat and a pair of {adjective} boots. The jungle is very muddy, and the mud likes to {verb}. Next, pack a flashlight, a water bottle, and {number} {plural noun}. You never know when you might need them.\n\nDo not forget bug spray! The jungle mosquitoes are small but very {adjective}. My cousin forgot his bug spray last year, and he {past tense verb} the whole week. You should also bring a snack to share with your dventure-05", "theme": "Jungle Adventure", "title": "Rules for the Treehouse Hotel", "text": "Welcome to the Treehouse Hotel, the tallest hotel in the jungle! To keep everyone happy, please follow these rules.\n\nOur elevator is a basket on a rope. Please ride it {adverb} and keep your {body part} inside at all times. Breakfast is served on the top branch at eight o'clock. Today we are having fresh mangoes and {plural noun}. Please do not share your food with the monkeys. They will {verb} on your table if you do.\n\nQuiet time starts after dinner. Please do not {verb} in the hallways. The sloth in Room 4 has been trying to fall asleep since {noun} Day. Every room has a {adjective} hammock and a clean {noun}. If you need anything, ring the bell and a parrot will help you.\n\nIf you see a snake in your room, do not worry. His name is Steve, and he is just looking for his {color} hat. Thank you for staying with us! We hope your visit is {adjective}."}, {"id": "jungle-adventure-06", "theme": "Jungle Adventure", "title": "Toucan's Famous Fruit Salad", "text": "Tilly the Toucan makes the best fruit salad in the jungle. Here is her secret recipe.\n\nYou will need two bananas, one mango, a bowl of berries, and a {adjective} coconut. You will also need {number} {plural noun}, but only the fresh ones. First, ask a monkey to help you {verb} the bananas. Monkeys are very good at this. Then cut the mango into the shape of a {noun}.\n\nNext, put all the fruit into a big bowl and stir it {adverb} with your beak. If you do not have a beak, a spoon is fine. Now add a sprinkle of {food} on top. Tilly says this makes the salad taste {adjective}.\n\nFinally, let the salad sit in the sun while you are {verb ending in ing}. Serve it to your friends and wait for them to say, \"{exclamation}!\""}, {"id": "jungle-adventure-07", "theme": "Jungle Adventure", "title": "Talking with a Sloth", "text": "Our reporter, Jada, spent the whole day with Sid the Sloth. It took a while.\n\nJada: Hello, Sid! What does a normal day look like for you?\nSid: I wake up at noon. Then I hang upside down and think about {plural noun}. After that, I take a nap.\nJada: What is your favorite food?\nSid: Leaves, mostly. But on my birthday I have a {adjective} cake made of {food}.\n\nJada: Do you ever hurry?\nSid: Once. I heard someone was giving away free {plural noun}, so I moved {adverb}. It only took me {number} hours to get there.\nJada: What do you do for fun?\nSid: I like {verb ending in ing} with my best friend, a turtle named Gus. Someday we hope to {verb} together.\n\nJada: Thank you, Sid. Anything else for our readers?\nSid: Yes. Slow down and take time to {verb}. And always keep a {noun} in your fur."}, {"id": "jungle-adventure-08", "theme": "Jungle Adventure", "title": "Help Wanted: Jungle Tour Guide", "text": "Help wanted! Jungle Fun Tours is looking for a new tour guide.\n\nYou must love animals, walking, and {plural noun}. You must be able to {verb} while carrying a big backpack. It also helps if you are {adjective} in the morning. Every day, you will lead visitors down the jungle trail. You will point out the parrots, the frogs, and the famous dancing {noun}. When visitors get tired, you will cheer them up by {verb ending in ing}.\n\nThe best part of this job is lunch by the waterfall. The hardest part is the monkeys. They like to grab your hat and your {noun}. Just say \"{silly word}\" {adverb}, and they will give them back.\n\nYou get one day off each week and a free {color} shirt. Our last guide loved this job so much that she {past tense verb} every single day. To apply, send us a drawing of yourself next to a {noun}."}, {"id": "jungle-adventure-09", "theme": "Jungle Adventure", "title": "The Jungle Talent Show", "text": "Attention, all jungle animals! The Jungle Talent Show is this Saturday at the Big Rock by the river. Everyone is invited. The show will start when the sun is high and the frogs stop {verb ending in ing}. Please bring a blanket and a {noun}
