 {past tense verb} for three days. Thank you for visiting, and please waddle {adverb} on your way out!"}, {"id": "at-the-zoo-04", "theme": "At the Zoo", "title": "Wanted: Zookeeper Helper", "text": "The Sunnyside Zoo is looking for a helper! Do you love animals? Are you {adjective} and good at sharing? Then this job is for you.\n\nEvery morning, you will help the zookeeper brush the elephants' {plural noun}. Then you will sing a song to the koalas so they can {verb}. On Tuesdays, you will read a book about {plural noun} to the owls.\n\nYou will also help clean the hippo pool. This is a messy job, so please wear a raincoat and a {noun} on your head. The hippos like to splash {adverb} when someone new is {verb ending in ing}.\n\nYou will be paid with a big smile and {number} free {plural noun} every Friday. Our last helper {past tense verb} so much that the monkeys gave her a medal. To apply, draw a picture of your favorite {animal} and bring it to the front gate."}, {"id": "at-the-zoo-05", "theme": "At the Zoo", "title": "Your Guide to the Zoo Map", "text": "Welcome to Pine Hill Zoo! Here is a quick guide to help you find your way.\n\nStart at the front gate and walk past the big fountain. The fountain was a gift from a very {adjective} hippo named Gloria. If you toss a {noun} in, Gloria will {verb} for you. Turn left at the Monkey House. You will hear the monkeys {verb ending in ing} before you see them. They are practicing for their play, which is all about {plural noun}.\n\nKeep walking until you reach the giant tortoise. He moves {adverb}, so he may still be in the same spot as this morning. Say hello! His name is {name}. Next you will find the Bird Garden and the snack stand. The snack stand sells popcorn, juice, and {food}.\n\nOur map ends at the gift shop. There you can buy a stuffed panda, a zoo hat, or {number} {plural noun}. Have a {adjective} visit!"}, {"id": "at-the-zoo-06", "theme": "At the Zoo", "title": "Zoo News: The Elephant Learns to Paint", "text": "Good morning! This is Zoo News, and we have a {adjective} story for you today.\n\nPenny the Elephant has become an artist. Every morning, she holds a paintbrush with her trunk and paints pictures of {plural noun}. Her favorite color to use is {color}. \"We first noticed when she {past tense verb} on the wall of her barn,\" said zookeeper Mr. Tran. \"So we gave her real paper. Now she paints {adverb} for hours.\"\n\nPenny's paintings are now hanging in the Zoo Cafe. Her most famous one shows a giraffe holding a {noun}. People line up to {verb} in front of it.\n\nNext week, Penny will start teaching an art class for the monkeys. So far the monkeys are mostly {verb ending in ing}. Penny says they are doing a {adjective} job. That is all for Zoo News. Stay {adjective}, zoo fans!"}, {"id": "at-the-zoo-07", "theme": "At the Zoo", "title": "A Day in the Life of a Zookeeper", "text": "6:00 in the morning: My alarm went off. I put on my zoo shirt and my lucky {adjective} boots.\n7:00: Breakfast time for the animals! The giraffes got leaves, the bears got berries, and the parrots got {plural noun}.\n\n9:00: The baby elephant would not get out of the pool. I asked her nicely to {verb}, but she {past tense verb} and splashed me instead.\n12:00: Lunch! I ate my sandwich with the penguins. One of them always tries to take my {noun}.\n\n3:00: The kangaroos had a hopping contest. The winner hopped {number} times in a row and won a {adjective} ribbon.\n5:00: I checked on everyone before I went home. The lions were {verb ending in ing}, the monkeys were telling jokes, and the sloth was still eating breakfast.\n\n8:00 at night: I fell asleep {adverb} and dreamed about {plural noun}."}, {"id": "at-the-zoo-08", "theme": "At the Zoo", "title": "Lunch for the Hungry Hippo", "text": "Hector the Hippo is always hungry. Here is how the zookeepers make his favorite lunch.\n\nYou will need one giant watermelon, a wheelbarrow full of lettuce, and {number} {plural noun}. You will also need a very {adjective} spoon. First, cut the watermelon into slices as big as a {noun}. Hector likes them big. Next, mix the lettuce with a scoop of {food}. Stir it {adverb} until it looks like a salad. Then add a handful of {plural noun}.\n\nNow it is time for the best part. Carry the lunch to the pool and call, \"Hector, it is time to {verb}!\" He will swim over {verb ending in ing} with joy.\n\nLast Tuesday, when Hector finished his lunch, he {past tense verb} and fell asleep in the sun. Hippos are very {adjective} eaters."}, {"id": "at-the-zoo-09", "theme": "At the Zoo", "title": "Meet the Zoo's Oldest Tortoise", "text": "This week, the Zoo Kids Club talked with Grandpa Shell, the oldest tortoise at our zoo. He is {number} years old.\n\nKids Club: What was the zoo like when you were young?\nGrandpa Shell: It was very {adjective}. Back then, the monkeys wore hats and the giraffes played {plural noun} every afternoon.\nKids Club: What is your secret to staying so happy?\nGrandpa Shell: Eat your greens, take lots of naps, and never {verb} after dinner. Also, I keep a {noun} under my shell for good luck.\n\nKids Club: Who is your best friend?\nGrandpa Shell: A flamingo named Rosie. Every morning, we go {verb ending in ing} together. She is much faster than me, but she waits {adverb}.\nKids Club: What do you do on your birthday?\nGrandpa Shell: The zookeepers bring me a cake made of {food}. Last year I {past tense verb} so hard that my shell wiggled.\n\nKids Club: Thank you, Grandpa Shell!\nGrandpa Shell: You are welcome. Now please let me get back to {verb ending in ing}."}, {"id": "at-the-zoo-10", "theme": "At the Zoo", "title": "A Thank-You Note from the Panda", "text": "Dear Visitors,\n\nMy name is Bao, and I am the panda who lives next to the gift shop. I am writing to say thank you for visiting me this summer.\n\nThank you to the girl who waved at me with her {body part}. It made me feel very {adjective}. Thank you also to the boy who sang me a song about {plural noun}. I liked it so much that I {past tense verb} all afternoon.\n\nI know some of you wanted to see me {verb ending in ing}, but I was usually asleep. Pandas sleep a lot. Next time, I will try to {verb} for you. My favorite snack is still bamboo, but this summer I also tried a {noun}. It was {adjective}.\n\nPlease come back soon. I will be here, sitting {adverb} on my favorite rock and dreaming about {food}.\n\nYour friend,\nBao"}, {"id": "school-days-01", "theme": "School Days", "title": "Good Morning, Maple Street School", "text": "Good morning, Maple Street School! This is Principal Ortiz with your morning announcements.\n\nFirst, lunch today is chicken noodle soup with a side of {plural noun}. Please eat it {adverb}. Second, someone left a {adjective} {noun} in the front office. If it is yours, please come get it before it starts {verb ending in ing} again.\n\nThird, the music class has been practicing very hard. Tomorrow they will {verb} for the whole school in the gym. Mr. Bell says to bring {number} {plural noun} and your best listening ears. Fourth, our class turtle, Mr. Shelly, {past tense verb} out of his tank last night. He was found in the library reading a book about {plural noun}. He is safe and very {adjective}.\n\nThat is all for today. Have a {adjective} day, and remember our school motto: Be kind, be brave, and be a {noun}!"}, {"id": "school-days-02", "theme": "School Days", "title": "This Week's Lunch Menu", "text": "Here is the lunch menu for this week at Pine Hill Elementary. All meals come with milk and a smile.\n\nMonday: Spaghetti with {adjective} meatballs and a side of steamed {plural noun}. Tuesday: Taco Tuesday! Build your own taco with cheese, lettuce, and crunchy {plural noun}. Wednesday: Chef Rosa's famous {color} soup. She says the secret is to stir it {adverb} for {number} minutes.\n\nThursday: Breakfast for lunch! Pancakes shaped like a {noun}, with warm syrup on top. Friday: Pizza day. This week's special topping is {food}. Please do not try to {verb} your pizza in the lunch line.\n\nDessert this week is a {adjective} cupcake. Every student may also pick one {noun} from the treat basket. Remember, the lunchroom is a calm place. No {verb ending in ing} on the tables, please!"}, {"id": "school-days-03", "theme": "School Days", "title": "A Note from Ms. Plum", "text": "Dear Families,\n\nWhat a busy week we had in Room 12! On Monday we learned about the letter B. Each student brought something that starts with B, and Theo brought a {adjective} {noun}. We are still not sure how it fit in his backpack. On Wednesday we planted seeds in paper cups. Our plants are growing {adverb}. One of them already has {number} tiny {plural noun} on it. We named it Gary.\n\nNext week is very important. Please send your child to school with a water bottle, a jacket, and a {noun}. We will be learning how to {verb} like real scientists. Also, our reading corner needs more pillows. If you have any old {plural noun} at home, we would love them.\n\nThank you for all you do. Your children make me laugh every day, especially when they are {verb ending in ing}.\n\nWith {adjective} wishes,\nMs. Plum"}, {"id": "school-days-04", "theme": "School Days", "title": "Report Card for Benny Brooks", "text": "Student: Benny Brooks\nGrade: Second\nTeacher: Mrs. Huckleberry\n\nReading: Benny reads {adverb} and with great feeling. His favorite book is about a {adjective} {noun} who learns to share. Math: Benny can count {number} {plural noun} in one minute flat. This term he learned to add and to {verb}. He likes math best at snack time.\n\nScience: Benny {past tense verb} during our volcano lesson and asked very good questions. He is curious about {plural noun} and where they come from. Art: Benny painted a picture of his dog. It was {color} and had wings. It is now hanging in the hallway.\n\nKindness: Benny always helps his friends. Last week he found a lost {noun} on the playground and gave it to the office.\n\nComments: It has been a {adjective} year. Keep {verb ending in ing}, Benny!"}, {"id": "school-days-05", "theme": "School Days", "title": "Rules for Show and Tell", "text": "Show and Tell is every Friday in Room 7. Please follow these rules so everyone gets a turn.\n\nRule one: You may bring one thing from home. It must fit inside a {noun}. Last year someone brought a {animal}, and that was too much. Rule two: Hold your item up high so the whole class can see. Talk {adverb} and say three facts about it. Rule three: Do not bring anything that might {verb} in the middle of class. This includes alarm clocks and {plural noun}.\n\nRule four: Listeners must sit on the rug with crossed legs and {adjective} hands. You may ask one question, like \"Where did you get your {noun}?\" Rule five: If your item starts {verb ending in ing}, please put it back in your backpack right away. Rule six: Clap {adverb} at the end of every turn. Mr. Fox says a good audience is the most {adjective} thing in the world.\n\nNext Friday, Mr. Fox will bring his {adjective} collection of {plural noun}."}, {"id": "school-days-06", "theme": "School Days", "title": "Dear Diary, Second Grade Is Here", "text": "Dear Diary,\n\nToday was my first day of second grade. I wore my new shoes and my {adjective} backpack. Mom packed me a sandwich and a little bag of {plural noun}. My teacher is Mr. Ramos. He has a mustache shaped like a {noun} and a big plant named Steve. He showed us how to {verb} quietly when the bell rings.\n\nAt recess, I played tag with my friend June. We ran around the slide {number} times. Then we sat on the grass and {past tense verb} until the whistle blew. After lunch we read a story about a {adjective} {animal} who wanted to go to school. It was my favorite part of the day.\n\nWhen I got home, I told Dad everything. He said, \"That sounds {adjective}!\" I think second grade is going to be {adverb} wonderful. Tomorrow I will bring my {noun} for good luck."}, {"id": "school-days-07", "theme": "School Days", "title": "Our Classroom Job Chart", "text": "Every Monday, Miss Kwan changes the job chart in Room 3. Here are the jobs for this week.\n\nLine Leader: Leads the class down the hall. Must walk {adverb} and please do not {verb} near the art room. Plant Helper: Waters our fern every morning. Our fern is very {adjective} and likes to hear stories about {plural noun}. Pencil Captain: Sharpens all the pencils. Last week the sharpener made a sound like a {animal}, so please be gentle.\n\nDoor Holder: Holds the door open and says \"Good morning\" to every {noun} that walks by. Fish Feeder: Gives our goldfish, Bubbles, {number} flakes of food. Bubbles gets {adjective} if he has too many. Calendar Keeper: Tells the class the date, the weather, and one fun fact about {plural noun}. Quiet Captain: Reminds everyone to stop {verb ending in ing} during reading time.\n\nMiss Kwan has the best job of all. She is the Head {noun}."}, {"id": "school-days-08", "theme": "School Days", "title": "Picture Day Instructions", "text": "Picture Day is this Thursday! Here is how to get ready.\n\nPlease wear your nicest shirt. Last year, one student wore a shirt covered in {plural noun}, and it looked great. Comb your hair the night before. If your hair is very {adjective}, you may bring a comb, a brush, or a small {noun}.\n\nWhen it is your turn, sit on the stool and look at the camera. The photographer, Mr. Snap, will say \"Say {silly word}!\" Then he will ask you to smile {adverb}. Do not {verb} while the camera is flashing. Mr. Snap says the best pictures happen when you are calm and still, like a {adjective} {animal}.\n\nAfter your picture, you will get a sticker shaped like a {noun}. Please walk back to class {adverb}. Your family will get the pictures in {number} weeks. Then they will go on the fridge, where everyone can see you {verb ending in ing}."}, {"id": "school-days-09", "theme": "School Days", "title": "Notes for the Substitute Teacher", "text": "Dear Substitute,\n\nThank you for teaching Room 9 today. Here are a few things you should know. We start every morning with a song about {plural noun}. The class knows all the words. They will sing it {adverb}, so you may want to cover your ears.\n\nAt ten o'clock, we have snack time. Lily likes to bring her own {food}. Please do not let anyone {verb} on the snack table. Our class hamster, Biscuit, is very {adjective}. If he starts {verb ending in ing}, just give him a {noun} and he will calm down. During reading time, Oliver likes to read under the {noun}. That is fine.\n\nThe class will tell you that I always let them {verb} on Fridays. This is not true.\n\nHave a {adjective} day! I will be back tomorrow with {number} new {plural noun} for the science table.\n\nKind regards,\nMrs. Delgado"}, {"id": "school-days-10", "theme": "School Days", "title": "My Science Fair Project", "text": "My name is Ava, and this is my science fair project.\n\nMy question was: What happens if you put a {noun} in a glass of water? I wanted to find out because my brother said it would {verb}. First, I gathered my supplies. I used one glass, some water, a spoon, and {number} {plural noun}. I wore goggles to look like a real scientist.\n\nNext, I dropped it in and watched {adverb}. At first nothing happened. Then it {past tense verb} and turned {color}. My dad said, \"Wow, that is {adjective}!\" I did the test three more times. Every time, it smelled a little bit like {food}.\n\nMy conclusion is that water is very {adjective}. Next year I want to test what happens to {plural noun} when you sing to them. Thank you for {verb ending in ing} at my project!"}, {"id": "field-trip-01", "theme": "Field Trip", "title": "Permission Slip for the Apple Orchard", "text": "Dear Families,\n\nOn Friday, our class will take a field trip to Happy Hills Apple Orchard. We will leave school at nine o'clock and come back before lunch. At the orchard, students will pick apples, pet a {adjective} goat, and ride on a wagon pulled by a {noun}. The farmer will also teach us how to {verb} like a real apple picker.\n\nPlease send your child with a sack lunch, a water bottle, and {number} {plural noun}. Students should wear comfy shoes. Last year someone wore {plural noun}, and they got very muddy. We need three grown-ups to come along. Grown-up helpers must be able to walk {adverb} and count to twenty.\n\nPlease sign below and return this slip by Wednesday.\n\nMy child may go on the field trip. I promise to pack something {adjective} for lunch.\n\nGrown-up signature: {name}\nFavorite kind of apple: {color} and {adjective}"}, {"id": "field-trip-02", "theme": "Field Trip", "title": "What to Pack for the Aquarium", "text": "Our class is going to the City Aquarium on Tuesday! Here is your packing list. Please check off each item.\n\nA lunch box with a sandwich, a juice box, and a small bag of {plural noun}. A raincoat, because the dolphins like to {verb} at the front row. A notebook and a pencil for drawing your favorite {noun}. A {adjective} hat so your teacher can find you in the crowd. One stuffed {animal} for the bus ride. Please only bring one. The bus is very full.\n\nThings NOT to pack: fishing poles, buckets, or {plural noun}. The sea turtles get {adjective} when they see those.\n\nRemember, we will be walking {adverb} through the glass tunnel where the fish swim over your head. Please hold hands with your buddy and keep {verb ending in ing}. Our bus leaves at eight o'clock. Please do not be {adjective}!"}, {"id": "field-trip-03", "theme": "Field Trip", "title": "Bus Rules for Field Trip Day", "text": "Welcome aboard Bus Number 4! My name is Miss Dot, and I will be your bus driver today. Please listen to these rules.\n\nRule number one: Stay in your seat. The seats are soft and {adjective}, so this should be easy. Rule number two: Use your inside voice. If you must sing, please sing {adverb}. Songs about {plural noun} are allowed. Rule number three: Keep your hands and your {body part} inside the bus at all times.\n\nRule number four: Do not {verb} in the aisle. The aisle is only for walking and for my lunch {noun}. Rule number five: If you see a {animal} out the window, you may wave. Last week we saw one, and it {past tense verb} back. Rule number six: No {verb ending in ing} until we get to the museum.\n\nIf everyone follows the rules, we will play my favorite game: Spot the {adjective} {noun}. Everyone who plays gets a sticker!"}, {"id": "field-trip-04", "theme": "Field Trip", "title": "Dear Diary, We Went to the Farm", "text": "Dear Diary,\n\nToday our class went to Sunny Acres Farm. The bus ride took {number} minutes, and I sat next to my friend Priya. The first thing we saw was a big red barn. Inside, there was a cow named Daisy who was eating {plural noun}. The farmer said Daisy is the most {adjective} cow in the whole state.\n\nThen we got to milk a goat. I was nervous, but I did it {adverb}. The goat looked at me and {past tense verb}. I think that means she liked me. After lunch we went on a hayride. The tractor bumped along the field while we sang songs and tried to {verb}. Priya found a feather that looked just like a {noun}.\n\nAt the gift shop, I bought a {adjective} pencil for my little brother. On the way home, everyone fell asleep except our teacher. She was still {verb ending in ing}. Tomorrow I am going to ask Mom if we can get a {animal}."}, {"id": "field-trip-05", "theme": "Field Trip", "title": "Postcard from the Science Museum", "text": "Dear Grandpa,\n\nGreetings from the Science Museum! I am writing this postcard on the bus. The first room had a giant model of a {noun}. It was as tall as a house! A man in a white coat showed us how to make it {verb}. Next we saw the dinosaur room. The sign said this dinosaur liked to eat {plural noun} and nap in the sun. It must have been very {adjective}.\n\nMy favorite part was the bubble room. I made a bubble so big that my whole {body part} fit inside. My teacher {past tense verb} when she saw it. In the space room, you can turn a knob and hear what {plural noun} sound like on Mars.\n\nI wish you were here. I got you a {adjective} magnet at the gift shop. It is shaped like a {noun} and says \"{silly word}\" on it. I will tell you everything very {adverb}.\n\nLove,\nRosie"}, {"id": "field-trip-06", "theme": "Field Trip", "title": "Welcome to the Town History Museum", "text": "Hello, students, and welcome to the Town History Museum! My name is Mr. Pickett, and I will be your tour guide today. Please stay with your group. We will walk {adverb} through each room.\n\nIn this first room, you can see an old wagon. Long ago, people used wagons to carry flour, wood, and {plural noun} into town. This one was pulled by a {adjective} horse named Clover. Over here is a schoolroom from long ago. Children wrote on little chalkboards and learned how to {verb}. If they were very good, the teacher gave them a {noun} to take home.\n\nThis glass case holds the town's first mail bag. Inside, we found a letter that said, \"Dear Mabel, please send more {plural noun}.\" And here is the giant clock. Every hour, a little wooden {animal} pops out and starts {verb ending in ing}.\n\nToday everything in the gift shop costs {number} pennies. Thank you for being such {adjective} visitors!"}, {"id": "field-trip-07", "theme": "Field Trip", "title": "Thank You, Zookeeper Jo", "text": "Dear Zookeeper Jo,\n\nThank you for showing our class around the zoo last week. We had a {adjective} time. Our favorite part was watching the giraffes eat breakfast. We did not know that giraffes like {plural noun} so much. When you fed them, they {past tense verb} with joy. Thank you for letting us touch the turtle's shell. It felt bumpy and {adjective}, like a {noun}.\n\nWe also loved the penguins. They walk {adverb} and look like they are wearing tiny {plural noun}. Some of us tried to {verb} like penguins all the way back to the bus.\n\nOur teacher says we can visit again in the spring. When we come back, we will bring you a {food} as a thank-you gift. We hope the lion is still {verb ending in ing} when we get there.\n\nFrom,\nRoom 14\n\nP.S. Benji wants to know if the zoo has a {silly word}."}, {"id": "field-trip-08", "theme": "Field Trip", "title": "Our Day at the Fire Station", "text": "Here is our schedule for the field trip to Fire Station 5.\n\n8:30: Get on the bus. Find your buddy and sit {adverb}. 9:00: Arrive at the fire station. Firefighter Lopez will meet us at the door with her dog, Sparky. Sparky is very {adjective} and loves to be patted. 9:15: Tour the fire truck. The truck has ladders, hoses, and a special box full of {plural noun}. We will all get to ring the bell {number} times.\n\n10:00: Firefighter Lopez will teach us how to {verb} like a firefighter. 10:30: Try on a real firefighter helmet. It is heavy and smells a little bit like {food}. 11:00: Snack time in the kitchen. Firefighters cook big meals together. Today they are making {adjective} pancakes with {plural noun} on top.\n\n11:30: Say goodbye. Each student will get a {color} sticker and a picture of a {noun}. 12:00: Ride back to school. Please keep {verb ending in ing} quietly in your seat."}, {"id": "field-trip-09", "theme": "Field Trip", "title": "Instructions for Field Trip Helpers", "text": "Thank you for helping on our trip to the Children's Garden! Here are a few things every grown-up helper should know.\n\nYou will be in charge of {number} students. Please count them every time you walk through a gate. They will try to {verb}, but stay calm. Each group has a name. Your group is the {adjective} {plural noun}. Please cheer your group name loudly at lunch.\n\nThe garden has many flowers. Please remind students to smell them {adverb} and not to pick them. The roses are very {adjective} this time of year. There is a pond with ducks. The ducks are friendly, but they really like {plural noun}. If a duck follows you, just keep walking and smile.\n\nAt noon, we will meet under the big {noun} for lunch. You may sit on a blanket or on a {noun}. If a child asks a question you cannot answer, just say, \"Let's ask the {adjective} gardener!\"\n\nThank you for {verb ending in ing} with us today!"}, {"id": "field-trip-10", "theme": "Field Trip", "title": "Kid News Visits the Bakery", "text": "This is Channel 2 Kid News with a special report.\n\nToday, Mrs. Hart's second grade class took a field trip to Sugar Moon Bakery on Main Street. The bakery opens very early, so the baker, Mr. Flores, was already {verb ending in ing} when the class arrived. First, the students washed their hands and put on paper hats. Then they learned how to {verb} bread dough. Mr. Flores says the trick is to push it {adverb} and sing to it.\n\nNext, the class made cupcakes. Each student added sprinkles and one {adjective} {noun} on top. Mr. Flores said it was the most {adjective} batch he had ever seen. The best moment came when the big oven beeped. Out came {number} loaves of bread shaped like {plural noun}. The whole class {past tense verb} and clapped.\n\nEvery student went home with a cookie and a recipe for {food} muffins. Next year, the class hopes to visit a {noun} factory. Back to you in the studio!"}, {"id": "sports-day-01", "theme": "Sports Day", "title": "Coach Lou's Big Pep Talk", "text": "All right, team, gather around! Bring it in close.\n\nToday is Sports Day, and I am so proud of you already. You practiced every day. You ran laps, you stretched your {plural noun}, and you learned how to {verb} like champions. Now remember what we talked about. Keep your eyes on the ball and your feet on the {noun}. If you feel nervous, take a deep breath and think about {plural noun}.\n\nThe other team is very good too. Their coach told me they eat {food} for breakfast every morning. That is fine. We have something even better. We have heart, and we have {adjective} socks. When you get out there, play {adverb}. Pass the ball, cheer for your friends, and if you hear me yell \"{exclamation}!\" that means run.\n\nWin or lose, we are going out for {adjective} pizza after the game. Now put your hands in. On three, everybody shout \"Go {adjective} {plural noun}!\""}, {"id": "sports-day-02", "theme": "Sports Day", "title": "Live from the Sack Race", "text": "Hello, sports fans, and welcome to the big sack race at Oak Park Elementary! I am Ted, and here with me is my partner, Jill.\n\nThanks, Ted. What a {adjective} day for a race. The sun is out, and the racers are climbing into their {plural noun}. The whistle blows! And they are off! Look at Mia in lane two. She is hopping {adverb}, Jill!\n\nYes, Ted, and look at Sam in lane three. He is not hopping at all. He is {verb ending in ing}. I have never seen that in a sack race before. The crowd is cheering. Someone in the stands is waving a giant {noun}.\n\nHere comes the finish line! Mia {past tense verb} across first, and Sam is right behind her, still not hopping. Everyone made it! All the racers will get a {color} ribbon and a cup of {food}.\n\nThat is all from the sack race. Next up is the {adjective} relay. Do not {verb} away, folks!"}, {"id": "sports-day-03", "theme": "Sports Day", "title": "Sports Day Schedule at Willow Creek", "text": "Welcome to Sports Day at Willow Creek School! Here is the plan for today.\n\n9:00: Opening parade. Each class will march around the field holding a sign shaped like a {noun}. The kindergarten class will lead the way, walking very {adverb}. 9:30: Warm-ups with Coach Bea. We will touch our toes, shake our {plural noun}, and do {number} jumping jacks. 10:00: The three-legged race. Partners will tie their legs together and try to {verb} to the finish line.\n\n10:45: Water break. Please drink lots of water. Lemonade and {adjective} orange slices will be on the snack table. 11:00: The water balloon toss. Last year, Mr. Grant's balloon {past tense verb} right on his hat, and he laughed for ten minutes. 11:30: Parents and teachers tug-of-war. The teachers have been practicing by pulling {plural noun} across the gym.\n\n12:00: Picnic lunch on the grass. Bring a blanket and a {adjective} hat. 12:30: Everyone gets a medal for {verb ending in ing}!"}, {"id": "sports-day-04", "theme": "Sports Day", "title": "Official Rules of the Egg and Spoon Race", "text": "Welcome to the egg and spoon race! Please read these rules before you begin.\n\nRule one: Each racer gets one spoon and one egg. The eggs have been boiled, so they will not make a mess. You may give your egg a name, like Eggbert or {silly word}. Rule two: Hold the spoon in your hand, not in your mouth. You may hold it {adverb}, but you may not use glue, tape, or {plural noun}. Rule three: When Ms. Park blows the whistle, walk to the big {adjective} cone and back. You may not run. You may not {verb}. You may only walk.\n\nRule four: If your egg falls, that is okay! Pick it up, put it back on your spoon, and keep {verb ending in ing}. Rule five: Cheer for every egg. A good cheer sounds like this: \"Go, egg, go! You are a {adjective} {noun}!\"\n\nRule six: Every racer gets a sticker and a {noun}. The eggs will go home and become {food} sandwiches. Have fun, and remember, the most important thing is to be {adjective}."}, {"id": "sports-day-05", "theme": "Sports Day", "title": "Dear Diary, Field Day Was Great", "text": "Dear Diary,\n\nToday was Field Day, and it was the best day of the whole year. I wore my team shirt, which is bright {color} and has a {noun} on the front. The first event was the hula hoop contest. I kept my hoop spinning for {number} seconds. My friend Leo kept his hoop going while he {past tense verb} at the same time. Everybody clapped.\n\nNext was the obstacle course. We had to crawl under a net, hop through tires, and {verb} over a pile of {plural noun}. I went {adverb} and made it to the end. At lunch, my mom brought a cooler full of {adjective} snacks. We ate on the grass and watched the teachers race. Mr. Kim ran so fast his whistle started {verb ending in ing}.\n\nAt the end of the day, everyone got a ribbon. Mine says \"Most {adjective} Hopper.\" I am going to hang it above my bed next to my {noun}."}, {"id": "sports-day-06", "theme": "Sports Day", "title": "How to Do the Blue Team Cheer", "text": "Welcome to the Blue Team! Every team needs a great cheer, and ours is the best. Here is how to do it.\n\nStep one: Stand in a line with your teammates. Put your hands on your hips and look very {adjective}. Step two: Stomp your feet {number} times. Stomp loudly, like a herd of {plural noun}. Step three: Clap your hands over your head and shout, \"We are Blue, we are true, we can {verb} and so can you!\"\n\nStep four: Spin around once. If you get dizzy, that is okay. Just hold on to your {noun} and wait. Step five: Wiggle your {body part} and say \"{silly word}\" as {adverb} as you can. Step six: Jump up high and pretend you are a {adjective} rocket. Step seven: Give a high five to the person next to you and say, \"Nice {verb ending in ing}!\"\n\nCoach Mae says if we do our cheer every morning, we will feel {adjective} all day long."}, {"id": "sports-day-07", "theme": "Sports Day", "title": "The Sports Day Awards", "text": "Good afternoon, families! Thank you for coming to the Sports Day Awards. Every student worked hard today, so every student gets an award.\n\nThe Super Sprinter Award goes to Jada, who ran so {adverb} that her shoelaces came untied. The Best Teammate Award goes to Marco, who cheered for everyone and shared his {plural noun} with the whole class. The Golden Spoon Award goes to Ellie. She carried her egg all the way to the finish line on a {noun}.\n\nThe Big Jump Award goes to Omar. He jumped {number} feet and landed like a {adjective} {animal}. The Sunshine Award goes to Ms. Wu, who stood at the finish line all day {verb ending in ing}. The Silly Hat Award goes to Principal Green. His hat had {plural noun} glued all over it, and it {past tense verb} every time he moved.\n\nThank you all for a {adjective} day. Next year, we will add a new event: the {adjective} {noun} relay. Please practice at home!"}, {"id": "sports-day-08", "theme": "Sports Day", "title": "Snack Table Sign-Up Sheet", "text": "Hello, Sports Day families! We need your help with the snack table. Please write your name next to one item and bring it on Friday morning.\n\nWater bottles: Please bring {number} bottles. Athletes get very thirsty after {verb ending in ing} all morning. Orange slices: Cut into small pieces. Coach Dan likes them {adjective} and cold. Granola bars: Any kind is fine, as long as there are no {plural noun} inside. Sunscreen: Please bring a big bottle. Mr. Tate puts it on his nose, his ears, and his {body part}.\n\nNapkins: We need lots of napkins. The kindergarten class likes to {verb} with them. Fruit cups: Last year someone brought a fruit cup shaped like a {noun}, and it was a big hit. Extra treat: One lucky family can bring a {adjective} surprise. Last year it was a giant bowl of {food}, and the students {past tense verb} with joy.\n\nThank you so much! The snack table is the most {adjective} part of the day."}, {"id": "sports-day-09", "theme": "Sports Day", "title": "Please Pick Me for Team Mascot", "text": "Dear Coach Rivera,\n\nMy name is Nora, and I would like to be the mascot for the Green Team on Sports Day. I would be a great mascot because I am very {adjective}. I can cheer loudly, dance {adverb}, and do a cartwheel almost every time.\n\nI already have a costume. It is a giant {animal} suit that my grandma made. It has a long tail and {number} fuzzy {plural noun} on the back. It is a little bit smelly, but only on hot days.\n\nAs the mascot, I will run up and down the field and help the team {verb}. When our team scores, I will do my special dance, called the {silly word}. When the other team scores, I will clap for them too, because that is good manners. I have also been practicing my mascot noises. My best one sounds like a {noun} {verb ending in ing}.\n\nI promise to be {adjective} and to never take off my {noun} during the game.\n\nYour friend,\nNora"}, {"id": "sports-day-10", "theme": "Sports Day", "title": "Tug-of-War Ends in a Tie", "text": "Good evening. This is Ruby Wells with the Sports Day news.\n\nToday at Elm Street School, the big tug-of-war between the Red Team and the Yellow Team ended in a tie for the first time in {number} years. The match began at two o'clock. Both teams grabbed the rope and pulled {adverb}. The crowd cheered so loudly that a {noun} fell off the bleachers.\n\nFor ten whole minutes, nobody moved. The Red Team pulled. The Yellow Team pulled. A {adjective} squirrel sat in the middle of the field and watched. Then something surprising happened. Both teams started {verb ending in ing} at the same time. They laughed so hard that they all sat down on the grass.\n\nThe referee, Mr. Ito, {past tense verb} and blew his whistle. He said it was the most {adjective} match he had ever seen. After the game, both teams shared a big bowl of {plural noun} and promised to {verb} again next year.\n\nReporting live from the field, this is Ruby Wells. Back to you, {name}."}, {"id": "birthday-party-01", "theme": "Birthday Party", "title": "You Are Invited to Max's Party", "text": "Dear Friends,\nYou are invited to Max's seventh birthday party! It will be on Saturday at {number} o'clock in our backyard. Please wear something {adjective}, like a party hat or a pair of {plural noun}.\n\nThere will be lots of fun games. First we will play Pin the Tail on the {animal}. Then everyone will get a turn to {verb} in the bounce house. My dad says he will be {verb ending in ing} by the grill all afternoon, so come hungry!\n\nFor lunch we will have pizza, apple slices, and a giant bowl of {plural noun}. The cake is shaped like a {noun} and has {color} frosting on top.\n\nPlease do not bring a present that is too {adjective}. Max already has a lot of {plural noun}. Just bring yourself and a {adjective} smile!\nLove,\nMax's Mom"}, {"id": "birthday-party-02", "theme": "Birthday Party", "title": "Thank You, Aunt Rosa", "text": "Dear Aunt Rosa,\nThank you so much for the birthday present you sent me. When I opened the box, I found a {adjective} {noun} inside! I have always wanted one. Mom says it is the most {adjective} gift I have ever gotten.\n\nI have used it every single day. On Monday, I took it to school and showed my teacher, Mrs. Green. She {past tense verb} so hard that she had to sit down. On Tuesday, my little brother tried to {verb} with it, and now he wants one too.\n\nAlso, thank you for the card with {number} dollars in it. I am saving it to buy a pet {animal} and a bag of {plural noun}.\n\nI hope you can come to my next party. We will eat cake and dance {adverb} in the kitchen until {number} o'clock.\nLove,\nSofia"}, {"id": "birthday-party-03", "theme": "Birthday Party", "title": "Grandma's Famous Birthday Cake", "text": "This is how my grandma makes my birthday cake every year. You will need a big bowl, a wooden spoon, and a grown-up helper.\n\nFirst, mix two cups of flour with three {plural noun}. Stir it {adverb} until it looks {adjective}. Next, crack two eggs and add a spoonful of {food}. Grandma says this is the secret part, so do not tell anyone.\n\nPour everything into a pan and bake it for {number} minutes. While you wait, you can {verb} around the kitchen and sing to the oven. Grandma says the cake likes that.\n\nWhen the cake is cool, cover it with {adjective} frosting and put a tiny {noun} on top. Add the candles and turn off the lights. Everyone will start {verb ending in ing} when they see it. Then they will say it is the most {adjective} cake in the whole world!"}, {"id": "birthday-party-04", "theme": "Birthday Party", "title": "Rules for the Bounce House", "text": "Welcome to the bounce house! Before you go in, please read these rules. My uncle Ted wrote them on a big piece of {color} paper and taped it to the door.\n\nRule one: Take off your shoes and your {plural noun}. Put them in the basket by the steps. Rule two: Only {number} kids can be inside at one time. If there are too many, the bounce house gets {adjective} and starts to wobble.\n\nRule three: No food inside. Last year my cousin brought a {noun} in with him, and we are still finding little pieces. Rule four: Please do not {verb} on the walls. Bouncing is fine. Jumping is fine. But {verb ending in ing} is not allowed, ever.\n\nRule five: If you feel {adjective}, come out and sit with Grandpa. He will give you a cup of water and a {adjective} {noun}. Have fun, bounce {adverb}, and remember to say thank you to the {plural noun}!"}, {"id": "birthday-party-05", "theme": "Birthday Party", "title": "The Day I Turned Seven", "text": "Dear Diary,\nToday I turned seven! I woke up very early because my dog, Biscuit, was {verb ending in ing} on my bed. Mom made pancakes shaped like {plural noun} for breakfast. They were a little bit {adjective}, but I ate them all.\n\nAt school, my class sang the birthday song to me. My best friend Leo sang so {adverb} that the fish in our classroom tank hid behind a {noun}. Then I got to wear the special birthday crown. It is made of paper and {plural noun}.\n\nAfter school, Grandpa came over with a present. It was a {adjective} {noun} with a big bow on top! I {past tense verb} around the living room three times.\n\nNow I am in bed, and I am very tired. Being seven is {adjective}. Tomorrow I am going to {verb} all day long."}, {"id": "birthday-party-06", "theme": "Birthday Party", "title": "The Party Game Awards", "text": "Here are the winners of today's party games. Every player did a great job, and nobody cried, not even once.\n\nThe Musical Chairs prize goes to Ava. She sat down so {adverb} that the chair made a squeaky sound. She wins a shiny {noun}. The Egg and Spoon Race was won by Jamal. He walked across the whole yard without dropping his egg, even when a {animal} ran in front of him. He wins {number} stickers and a bag of {plural noun}.\n\nThe Hula Hoop Contest ended in a tie. Mia and Ben kept {verb ending in ing} for ten whole minutes. Each of them gets a {adjective} medal.\n\nFinally, the prize for Best Dancer goes to Grandpa Joe. He {past tense verb} across the patio and shook his {body part} like a {adjective} noodle. Next year, he says he will {verb} even better."}, {"id": "birthday-party-07", "theme": "Birthday Party", "title": "How to Blow Out Your Candles", "text": "Blowing out birthday candles is a very important job. Here is how to do it the right way. First, wait until everyone has finished singing. Do not start early, or Aunt May will make everyone sing again, and she sings very {adverb}.\n\nNext, close your eyes and make a wish. You can wish for anything you want, like a pet {animal} or a house made of {plural noun}. Keep your wish a secret!\n\nThen take a deep breath. Fill your cheeks with air until they look like two {adjective} {plural noun}. Lean over the cake, but be careful not to put your {body part} in the frosting or bump the {noun} on top.\n\nNow blow! If all the candles go out, everyone will clap and shout \"{exclamation}!\" If one candle stays lit, that is okay. Just try to {verb} a little harder. Last of all, the birthday kid gets the first piece. Eat it {adverb}!"}, {"id": "birthday-party-08", "theme": "Birthday Party", "title": "Breaking News from the Backyard", "text": "Good afternoon. This is Lily Park with breaking news from Oak Street, where a birthday party is happening right now. At one o'clock, the guests arrived carrying presents and {plural noun}. People say the birthday girl, Rosie, {past tense verb} at the front door and gave everyone a {adjective} hug.\n\nAt two o'clock, there was trouble. A big gust of wind blew the balloons into a tree. A tall neighbor got them down using only a ladder and a {noun}. The crowd cheered {adverb}.\n\nAt three o'clock, the piñata was finally opened. Out came candy, toys, and {number} tiny {plural noun}. Kids were seen {verb ending in ing} all over the grass.\n\nRight now, the party is still going. Rosie's dad has asked everyone to {verb} before the ice cream melts. Experts say it is the most {adjective} party of the year. Back to you in the studio!"}, {"id": "birthday-party-09", "theme": "Birthday Party", "title": "What Is in Your Party Bag", "text": "Thank you for coming to Nora's birthday party! Here is a list of what is inside your party bag. One bouncy ball. Please do not bounce it inside, or your grown-up might get {adjective}. Two stickers shaped like {plural noun}. You can put them on your notebook or your {noun}.\n\nThree pieces of candy. Nora picked these out herself. She says the {color} ones taste like {food}. One tiny jar of bubbles. To use it, dip the wand and blow {adverb}. If you blow too hard, you will just {verb} instead.\n\nOne paper crown. Wear it at dinner tonight and tell everyone you are the king or queen of {place}. One small surprise at the very bottom. Nora will not tell anyone what it is, but she says it might be {verb ending in ing} when you open the bag.\n\nThank you for being such a {adjective} guest. See you next year!"}, {"id": "birthday-party-10", "theme": "Birthday Party", "title": "Dad's Party Checklist", "text": "Dad made a checklist so that my birthday party goes perfectly. He wrote it with a {color} marker and hung it on the fridge with a magnet shaped like a {noun}.\n\nFirst, he will blow up {number} balloons and tie them to the mailbox. Then he will hang a big sign that says Happy Birthday in {adjective} letters. Mom said the sign from last year was a little too {adjective}, so this year it will be smaller.\n\nNext, he will set up the snack table. It will have juice boxes, cheese crackers, and a tall stack of {plural noun}. He will also practice {verb ending in ing} so he can be the party clown. He says he is getting very good at it.\n\nFinally, at four o'clock, he will carry out the cake and sing {adverb}. Then he will sit on the couch, take off his {plural noun}, and {verb} for the rest of the day. That part is not on the list, but Mom says it always happens."}, {"id": "snow-day-01", "theme": "Snow Day", "title": "The Morning Snow Report", "text": "Good morning, everyone! This is Weather Wendy with your snow report. Last night, our town got {number} inches of fresh snow. The snow is very {adjective} today, which is perfect for snowmen and sled rides.\n\nRight now it is cold outside, so please wear your coat, your hat, and two pairs of {plural noun}. The wind is blowing {adverb} from the north, and it smells a little bit like {food}.\n\nLater this afternoon, we expect clouds shaped like {plural noun} and a small chance of snowflakes the size of a {noun}. Kids may want to {verb} in the front yard before lunch.\n\nTonight, the moon will be big and {adjective}. Make sure to drink something warm and say goodnight to your snowman. This has been Weather Wendy. Stay warm and keep {verb ending in ing}!"}, {"id": "snow-day-02", "theme": "Snow Day", "title": "A Message from Principal Plum", "text": "Good morning, families. This is Principal Plum. Because of all the snow, school is closed today. The parking lot is covered in snow up to my {body part}, and the buses are stuck behind a giant pile of {plural noun}.\n\nI know many of you are sad to miss school. Do not worry about our class gerbil, Peanut. Mr. Diaz went in early to feed him and give him a tiny {adjective} blanket. Peanut {past tense verb} to say thank you.\n\nPlease use this day to read a book, drink warm cocoa, and {verb} with your family. If you build a snowman, you may bring a picture to class. The most {adjective} snowman will win a {noun} for the whole class.\n\nStay safe, stay warm, and please wear your {color} mittens. Tomorrow, please walk into school {adverb} and stomp the snow off your {plural noun}."}, {"id": "snow-day-03", "theme": "Snow Day", "title": "How to Build the Best Snowman", "text": "Building a snowman is easy if you follow these steps. Ask a grown-up to help you with the heavy parts.\n\nFirst, roll a big ball of snow for the bottom. Keep rolling until it is as big as a {noun}. Then make a medium ball for the middle and a small one for the head. Stack them up {adverb} so they do not fall over.\n\nNext, give your snowman a face. Use two {plural noun} for the eyes and a carrot for the nose. For the mouth, make a smile out of little {plural noun}. If you do not have any, you can use {food} instead.\n\nLast, dress him up. Wrap a {color} scarf around his neck and put an old {noun} on his head. Give him two sticks for arms so he can {verb} at the cars going by. Now step back and look at him. He is so {adjective}! If you listen closely, you might even hear him {verb ending in ing}."}, {"id": "snow-day-04", "theme": "Snow Day", "title": "Grandpa's Snow Day Cocoa", "text": "On every snow day, Grandpa makes his famous hot cocoa. Here is his recipe, written down by me.\n\nFirst, Grandpa pours two cups of milk into a pot. He says you must stir it {adverb} or the milk gets {adjective}. Then he adds three big spoonfuls of cocoa powder and one tiny pinch of {plural noun}. That is his secret.\n\nWhile it warms up, Grandpa likes to {verb} around the kitchen and hum a song about {plural noun}. He says it makes the cocoa taste better. I think he just likes {verb ending in ing}.\n\nWhen the cocoa is warm, pour it into your favorite mug. Put marshmallows on top, plus a {noun} if you are feeling fancy. Drink it slowly while you look out the window at the {adjective} snow. Grandpa always closes his eyes after his first sip and says, \"{exclamation}! That is {adjective}!\""}, {"id": "snow-day-05", "theme": "Snow Day", "title": "My Snow Day Diary", "text": "Dear Diary,\nWhen I woke up this morning, everything outside was white! Mom looked out the window and said school was closed. I was so happy that I {past tense verb} all the way down the stairs.\n\nAfter breakfast, my brother and I put on our snow pants, boots, and {plural noun}. It took us {number} minutes. By the time we got outside, I was already a little bit {adjective}.\n\nFirst we made snow angels in the front yard. Mine looked like a {adjective} {animal}. Then we had a contest with our neighbor, Mrs. Kim, to see who could throw a snowball the highest. She is very {adjective} at throwing. Our dog, Muffin, jumped into a snow pile and came out looking like a {noun}.\n\nNow I am inside, drinking cocoa and watching the snow fall {adverb}. My cheeks are pink, and my toes feel like {plural noun}. I hope tomorrow is a snow day too, so I can {verb} all over again."}, {"id": "snow-day-06", "theme": "Snow Day", "title": "The Great Sled Race Results", "text": "Here are the official results of the Great Sled Race on Maple Hill. The judges were Mr. Lopez and his cat, who watched from the window.\n\nIn third place is Sam. Sam rode a red plastic sled and shouted \"{exclamation}!\" the whole way down. He wins a cup of cocoa and a {adjective} sticker.\n\nIn second place is Priya. She rode down the hill on a {noun} and finished in {number} seconds. The judges say she was very {adjective}. She wins a pair of fuzzy {plural noun}.\n\nIn first place is Grandma Bea! She rode the wooden sled she had when she was little and went down {adverb}. At the bottom, she {past tense verb} and waved to the crowd. She wins the golden trophy and a big bag of {plural noun}. Next year, everyone wants to {verb} like Grandma Bea."}, {"id": "snow-day-07", "theme": "Snow Day", "title": "Rules for Our Snow Fort", "text": "My friends and I built a snow fort in my backyard. It has two rooms, a window, and a flag made from a {color} sock. To keep it safe and fun, we made some rules.\n\nRule one: Everyone must say the secret word before coming in. This week, the secret word is \"{silly word}.\" Rule two: No more than {number} kids inside at once, or the walls start to wiggle.\n\nRule three: Please do not {verb} inside the fort. Last time, Theo did that and the roof dripped on his {noun}. Rule four: Snacks are allowed, but only crackers and {plural noun}. Crumbs make the floor {adjective}.\n\nRule five: When it is time to go inside, we all say goodbye to the fort {adverb}. Then we drink cocoa and dream about {verb ending in ing} in the snow tomorrow. Our fort is the most {adjective} place in the whole neighborhood!"}, {"id": "snow-day-08", "theme": "Snow Day", "title": "Dear Snow, Please Come Back", "text": "Dear Snow,\nThank you for coming to our town last week. You were very {adjective}, and you covered everything, even our mailbox and Dad's {noun}. We had the best time.\n\nMy sister and I made a snowman named Mr. Pebble. He had two {plural noun} for eyes and a big {adjective} smile. We also made {number} snow angels in a row. Mom took a picture and hung it on the fridge.\n\nNow you have melted, and the yard is just mud and {plural noun}. Mr. Pebble's scarf is still lying in the grass. I {past tense verb} a little when I saw it.\n\nPlease come back soon. If you do, I promise to {verb} with you all day and wear my mittens the whole time. I will even leave a bowl of {food} on the porch for you. Please write back {adverb}.\nLove,\nOwen"}, {"id": "snow-day-09", "theme": "Snow Day", "title": "How to Get Ready for the Snow", "text": "Going out in the snow takes a lot of work. My mom made this list so I do not forget anything.\n\nFirst, put on your warmest shirt and your thick socks. Then pull on your snow pants. You may need to {verb} to get them all the way up. They are puffy and make a {adjective} sound when you walk. Next, put on your coat and zip it all the way up to your {body part}.\n\nNow it is time for boots. Push your feet in {adverb}. If they will not go in, check for {plural noun} hiding inside. Last time, I found one of my brother's {plural noun} in there. After that, put on your hat, your scarf, and your mittens. By now you will look like a big {adjective} {noun}.\n\nLast of all, open the door and step outside. Take two steps in the snow and start {verb ending in ing}. Then Mom will knock on the window and say it is time to come in for {food}."}, {"id": "snow-day-10", "theme": "Snow Day", "title": "A Snowman Tells All", "text": "Today our school newspaper talked to Frosty Fred, the snowman who stands in front of the library. Here is what he said.\n\nWe asked Fred how he feels about snow days. \"I love them,\" he said. \"Kids come out and give me {plural noun} and a new {noun} to wear. Yesterday, a girl named Kaya gave me a hug so {adjective} that I almost lost my nose.\"\n\nWe asked Fred what he does at night. \"Mostly I stand here,\" he said. \"Sometimes I watch the {plural noun} go by. When nobody is looking, I like to {verb} a little. Last night, I {past tense verb} until the sun came up.\"\n\nFinally, we asked Fred if he has any advice for kids. \"Always wear your mittens,\" he said {adverb}. \"Eat a warm bowl of {food} after playing outside. And please, never let the {animal} near my carrot nose.\" Thank you, Fred. Stay {adjective}!"}, {"id": "halloween-fun-01", "theme": "Halloween Fun", "title": "Come to Our Pumpkin Party", "text": "Dear Neighbors,\nYou are invited to our Halloween pumpkin party! It will be on Saturday afternoon in our garage, which my dad has decorated with orange lights and {plural noun}.\n\nPlease come wearing your most {adjective} costume. Last year my uncle came dressed as a {noun}, and nobody knew who he was until he started {verb ending in ing}. There will be a prize for the best costume and a smaller prize for the most {adjective} one.\n\nWe will paint pumpkins, play pumpkin bowling, and bob for apples. My mom is making cupcakes with {color} frosting and little {plural noun} on top. Our dog, Noodle, will be dressed as a {animal}, so please say hello to him {adverb}.\n\nThe party ends at six o'clock, when everyone will go trick-or-treating together. Please bring a bag, a flashlight, and {number} friends. We can't wait to {verb} with you!\nLove,\nThe Garcia Family"}, {"id": "halloween-fun-02", "theme": "Halloween Fun", "title": "How to Decorate a Pumpkin", "text": "Decorating a pumpkin is one of the best parts of fall. You do not need anything sharp. All you need is paint, glue, and a grown-up.\n\nFirst, pick the right pumpkin. Find one that is round, orange, and about the size of a {noun}. Wash it {adverb} and dry it with a towel.\n\nNext, paint a face. You can give it two {adjective} eyes, a triangle nose, and a big smile full of {plural noun}. If you want it to look extra silly, add eyebrows and glue a {food} on top for a hat.\n\nLast, put your pumpkin on the front porch where everyone can see it. When kids walk by, they will {verb} and point. My pumpkin last year looked so {adjective} that my neighbor {past tense verb} every time he walked past. This year, I am naming my pumpkin {name}. I hope it does not start {verb ending in ing} on the porch again."}, {"id": "halloween-fun-03", "theme": "Halloween Fun", "title": "The Costume Parade Winners", "text": "Thank you to everyone who marched in the Oak Street School Costume Parade! The judges had a very hard job. Here are this year's winners.\n\nThe prize for Funniest Costume goes to Eli, who came dressed as a giant {noun}. He waddled down the hall {adverb} and waved at every class. He wins a pumpkin pencil and a bag of {plural noun}.\n\nThe prize for Most Creative goes to the Lee twins. They dressed up together as one {adjective} {animal} with four legs and two heads. Their mom says the costume took {number} hours to make.\n\nThe prize for Best Teacher Costume goes to Mrs. Hart. She wore a cape made of {plural noun} and a hat shaped like a {noun}. When she won, she {past tense verb} right there in the gym. Next year, the judges hope everyone will {verb} in the parade. Congratulations, and have a {adjective} Halloween!"}, {"id": "halloween-fun-04", "theme": "Halloween Fun", "title": "Friendly Ghost Cookies", "text": "These cookies look like little ghosts, but they are not scary at all. They are very friendly and a little bit {adjective}. Ask a grown-up to help you with the oven.\n\nFirst, mix one cup of sugar, two cups of flour, and a spoonful of {food} in a big bowl. Stir it {adverb} until there are no lumps. Then roll the dough flat and make ghost shapes with a cookie cutter.\n\nBake the cookies for {number} minutes. While you wait, you can {verb} around the kitchen like a ghost. Say \"boo\" very quietly so the cookies do not get scared.\n\nWhen the cookies are cool, cover them with white frosting. Use two chocolate chips for eyes and a tiny {noun} for the mouth. Some people like to add {plural noun} on top, too. If you are very quiet, you might hear your ghosts {verb ending in ing}. My little sister says they taste like {plural noun} and {adjective} dreams."}, {"id": "halloween-fun-05", "theme": "Halloween Fun", "title": "My Trick-or-Treat Night", "text": "Dear Diary,\nTonight was Halloween! I dressed up as a {adjective} {noun}. My costume took Mom three days to make, and it has {plural noun} glued all over it. It is a little hard to walk in, but I love it.\n\nAt six o'clock, Dad and I went trick-or-treating. The first house had a big blow-up pumpkin in the yard. The lady who opened the door said my costume was very {adjective}. She gave me two candies and a {noun}.\n\nAt the next house, a man was dressed as a friendly ghost. He {past tense verb} when he saw me, and then we both laughed. On the way home, I saw my friend Zoe. She was dressed as a {animal} and was {verb ending in ing} down the sidewalk.\n\nWhen we got home, I counted {number} pieces of candy. Mom let me pick two to eat {adverb}. Now I am in bed, still wearing my costume. Tomorrow I am going to wear it to breakfast and {verb} until Mom says stop."}, {"id": "halloween-fun-06", "theme": "Halloween Fun", "title": "Rules for Trick-or-Treating", "text": "Trick-or-treating is a lot of fun, but there are rules. My big sister Mae wrote these for me, and she says they are very important.\n\nRule one: Always walk with a grown-up and carry a flashlight. Rule two: Only go to houses with the porch light on. If a house has a pumpkin that looks like a {noun}, that means they have the good candy.\n\nRule three: When someone opens the door, say \"Trick or treat!\" in a {adjective} voice. Then say thank you {adverb}. Never take more than {number} pieces. Rule four: If a house is giving out {plural noun} instead of candy, smile and say thank you anyway.\n\nRule five: Do not eat anything until you get home. Mom has to check it first, and you are allowed to {verb} while you wait. Then you can trade. Mae will trade one chocolate bar for three {plural noun}. Rule six: Hide your candy bag somewhere {adjective}. Last year, Dad found my bag while he was {verb ending in ing} in the closet. Next year, I am going to hide it inside a {noun}."}, {"id": "halloween-fun-07", "theme": "Halloween Fun", "title": "A Letter from Boo the Friendly Ghost", "text": "Dear Kids of Pine Street,\nHello! My name is Boo, and I am the friendly ghost who lives in the attic of the yellow house. I am very {adjective}, and I love to play. Please do not be scared of me. I sleep in an old box of {plural noun} during the day.\n\nEvery Halloween, I like to float around the neighborhood and look at all the costumes. Last year, I saw a boy dressed as a {noun} and a girl dressed as a giant {food}. I {past tense verb} so hard that I floated right into a tree.\n\nMy favorite things are pumpkins, warm socks, and {plural noun}. I do not eat candy because it falls right through me, but I like to smell it. I also like to {verb} at night when the moon is out.\n\nThis year, I will be sitting on the porch of the yellow house. If you see me, please wave {adverb} and say \"{silly word}.\" That means hello in ghost. I will wave back with my {adjective} little hands.\nYour friend,\nBoo"}, {"id": "halloween-fun-08", "theme": "Halloween Fun", "title": "Big News on Maple Lane", "text": "Good evening. This is Kip Moore with Halloween news from Maple Lane, where every house has been decorated for the big night.\n\nAt the blue house, the Wilson family has put up a giant blow-up {animal} that is taller than their roof. It has {number} glowing eyes and wears a hat made of {plural noun}. Neighbors say it is very {adjective}.\n\nNext door, Mr. Patel has covered his whole porch in orange lights and {plural noun}. When kids ring his doorbell, a {adjective} song plays and a toy pumpkin starts {verb ending in ing}. Children have been lining up to {verb} on his steps all afternoon.\n\nOur last stop is the corner house, where Mrs. Ruiz has lined her sidewalk with pumpkins painted to look like {plural noun}. She waved {adverb} at our camera and said this is her best year yet. Tonight, the whole street will turn on its lights at seven o'clock. Experts say it will be {adjective}. Back to you!"}, {"id": "halloween-fun-09", "theme": "Halloween Fun", "title": "The Official Candy Trading Guide", "text": "After trick-or-treating, my friends and I always trade candy on my living room rug. Here is our official trading guide, written by me and checked by my cousin Ava.\n\nOne lollipop is worth two little chocolate bars. One big chocolate bar is worth {number} lollipops. A box of raisins is worth one sticker and a {noun}. Raisins are Ava's favorite, so this is a very {adjective} deal.\n\nIf you get something unusual, like a toothbrush or a bag of {plural noun}, you can trade it to my dad. He will give you one penny and a high five. He says he is {verb ending in ing} for a good cause.\n\nWhen trading, you must sit up straight and talk {adverb}. No grabbing. If two people want the same candy, they have to {verb} for it in a contest. The winner gets the candy, and the other person gets a {adjective} hug. At the end, everyone puts their candy in a {color} bowl, and Mom says it is time to brush our {plural noun}."}, {"id": "halloween-fun-10", "theme": "Halloween Fun", "title": "Welcome to the Not-Scary House", "text": "Welcome to the Not-Scary House! My name is Ruby, and I will be your tour guide today. Please stay with the group and keep your hands inside your {plural noun}.\n\nOur first stop is the front hall. Here you will see a friendly ghost made out of an old bedsheet. His name is Gus, and he loves to {verb}. If you shake his hand, he might say something {adjective}.\n\nNext, we will walk into the kitchen. The bowl on the table is full of green slime made of {food} and jelly. Please do not touch it. My brother touched it last year, and his {body part} was sticky for {number} days.\n\nOur last stop is the living room, where the jack-o'-lanterns are {verb ending in ing} on the windowsill. Each one has a {adjective} face. Before you leave, take a {noun} from the basket by the door and say goodbye {adverb}. Thank you for visiting. Come back next year, when we will have even more {plural noun}!"}, {"id": "camping-trip-01", "theme": "Camping Trip", "title": "Mom's Camping Packing List", "text": "Mom made a packing list for our camping trip. She taped it to the fridge with a {adjective} magnet so nobody would forget anything.\n\n1. One tent. Last year we forgot the poles, so we slept under a {noun} instead.\n2. Three sleeping bags and a pillow shaped like a {animal}.\n3. Twelve {plural noun} for roasting over the campfire.\n4. Bug spray. Dad says mosquitoes love to {verb} {adverb} near his ears.\n5. A flashlight, in case the moon is too {adjective}.\n6. Grandpa's lucky {noun}. He has brought it on every trip since he was {number} years old.\n\nAt the bottom, Dad added one more thing in big letters: DO NOT PACK THE {plural noun}. Mom says that is a long story, and it has a canoe and a very {adjective} raccoon in it."}, {"id": "camping-trip-02", "theme": "Camping Trip", "title": "Ranger Bob's Campfire Rules", "text": "Welcome to Pine Cone Campground! Ranger Bob wrote these campfire rules. Please read them before you sit down to {verb}.\n\nRule 1: Only grown-ups may light the aited {adverb} for two hours and caught a {noun} instead. He said it still counts. Mom took a picture.\n\nTomorrow we will {verb} in canoes. I will wear my life jacket and paddle like a {adjective} {animal}.\n\nLove, your favorite grandchild\n\nP.S. Please save me some {food}."}, {"id": "camping-trip-05", "theme": "Camping Trip", "title": "How to Set Up a Tent", "text": "Setting up a tent is easy if you follow these steps. My dad wrote them after our last trip.\n\nStep 1: Find a flat spot. Make sure there are no rocks, sticks, or {plural noun} on the ground.\nStep 2: Unroll the tent. If a {animal} is already napping inside, choose a different spot.\nStep 3: Push the poles through the loops. This part goes better if you hum a {adjective} song.\nStep 4: Lift the tent up {adverb}. Ask a grown-up to hold the other side so it does not {verb}.\nStep 5: Push in the stakes. You should have {number} stakes, but you will always find one in your {noun} later.\nStep 6: Put your sleeping bag, pillow, and favorite {noun} inside.\n\nNow step back and admire your tent. It should look {adjective} and strong. If it looks like a {noun} instead, go back to Step 1."}, {"id": "camping-trip-06", "theme": "Camping Trip", "title": "Pine Lake Camp News", "text": "Good evening, campers! This is the Pine Lake Camp News.\n\nTonight was the big Marshmallow Roasting Contest. Twenty families gathered around the fire pit with their sticks and their {adjective} hats.\n\nThe first roaster, Mr. Hill, toasted his marshmallow until it was the size of a {noun}. The crowd {past tense verb}. Next, a girl named Rosie roasted {number} marshmallows at once while {verb ending in ing} on one foot. The judges were very impressed.\n\nThe winner was seven-year-old Sam, who toasted his marshmallow {adverb} and served it on a bed of {plural noun}. His prize was a golden {noun} and a blue ribbon.\n\nIn other news, someone left a {adjective} {noun} on the picnic table. If it is yours, please pick it up at the front office. That is all for tonight. Remember to brush your teeth and {verb} before bed!"}, {"id": "camping-trip-07", "theme": "Camping Trip", "title": "Junior Ranger Fun Facts", "text": "Hi! My name is Ava, and I am a Junior Forest Ranger. I earned my badge yesterday. Here are some fun facts I learned on our camping trip.\n\nFact 1: Squirrels hide nuts in the ground. They also hide {plural noun} when nobody is looking.\nFact 2: Pine cones open up when it is warm and close up when they feel {adjective}.\nFact 3: Owls can turn their heads almost all the way around. They do this so they can {verb} better.\nFact 4: If you listen {adverb} at night, you can hear the trees {verb ending in ing}.\nFact 5: Raccoons wash their food in the creek. Last night one washed my {noun}.\nFact 6: The tallest tree in our campground is taller than {number} school buses stacked on a {noun}.\n\nThat is all the facts I know so far. Next summer I want to earn my {adjective} badge. To get it, you have to catch a {noun} in a bug net."}, {"id": "camping-trip-08", "theme": "Camping Trip", "title": "Breakfast Menu at Campsite 12", "text": "Good morning, campers! Chef Dad is cooking breakfast on the camp stove today. Here is the menu.\n\nPancakes: Fluffy, golden, and shaped like a {noun}. Served with syrup and a side of {plural noun}.\nScrambled Eggs: Stirred {adverb} with Grandpa's lucky spoon. Chef Dad says this makes them taste {adjective}.\nHot Cocoa: Topped with three marshmallows and a sprinkle of {food}.\nThe Mystery Special: Chef Dad will not tell us what is in it. It is {color}, and it {past tense verb} a little when Mom poked it.\n\nPlease wait in line and do not {verb} near the stove. Chef Dad gets very {adjective} when people touch his spatula.\n\nAfter breakfast, everyone must wash their plate in the bucket and shout \"{exclamation}!\" to thank the chef."}, {"id": "camping-trip-09", "theme": "Camping Trip", "title": "Campground Talent Show Tonight", "text": "Attention, all campers! The Shad r} eggs and one {noun}.\n10:00 - Help Grandpa fix the fence. Bring the hammer, the nails, and the {adjective} {noun}.\n11:00 - Give the pigs a bath. They love to {verb} in the mud right after.\n\nWhen the chores are done, everyone gets lemonade on the porch. Grandma says we worked {adverb}. Grandpa says we worked like a team of {plural noun}."}, {"id": "on-the-farm-02", "theme": "On the Farm", "title": "A Letter to Mrs. Lopez", "text": "Dear Mrs. Lopez,\n\nI am spending the summer on my uncle's farm. I wanted to tell you all about it.\n\nThe farm has six cows, ten sheep, and a goat named Pepper. Pepper eats everything. Yesterday she ate a sock, a sunflower, and my uncle's {adjective} {noun}. He was not happy.\n\nEvery morning I help gather eggs. You have to reach under the hens {adverb} so they do not {verb}. My favorite hen is named Lulu. She lays eggs that are a little bit {color}.\n\nOn Saturday we took the tractor to town to buy seeds, flour, and a bag of {plural noun}. The tractor is very old and makes a sound like a {animal} {verb ending in ing}. Everyone waved at us.\n\nI miss school a little. Please tell the class I said hello and that I can now {verb} like a real farmer.\n\nYour student,\nNoah"}, {"id": "on-the-farm-03", "theme": "On the Farm", "title": "Meet the Animals at Maple Hill", "text": "Welcome to Maple Hill Farm! Please follow the path and meet our animals.\n\nStop 1: The Cows. Our cows are named Bessie, Moo-Moo, and Gerald. They give us milk, cheese, and sometimes {plural noun}.\nStop 2: The Pigs. Pigs are very smart. Our pig, Waffles, can {verb} and count to {number}.\nStop 3: The Sheep. We give the sheep a haircut once a year. Their wool is used to make sweaters, blankets, and {adjective} socks.\nStop 4: The Duck Pond. Please do not feed the ducks any {food}. They like peas and lettuce.\nStop 5: The Barn Cat. Her name is Pumpkin. She sleeps {adverb} on a {noun} all day.\n\nBefore you leave, stop by the gift shop. We sell honey, jam, and {adjective} {plural noun}. You can also take a photo with Farmer Joe, who will be {verb ending in ing} by the gate."}, {"id": "on-the-farm-04", "theme": "On the Farm", "title": "Grandma's Famous Farm Pie", "text": "This is Grandma's famous Farm Pie. She makes it every summer for the county fair. She has won a ribbon {number} times.\n\nYou will need:\n2 cups of flour\n1 cup of sugar\n3 fresh eggs from the henhouse\nA big handful of {plural noun}\nA pinch of {food}\n\nFirst, mix the flour and sugar in a {adjective} bowl. Stir it {adverb} with a wooden spoon. Then crack the eggs and add a few {plural noun}. Grandma says the secret is to {verb} while you stir.\n\nAsk a grown-up to bake the pie for one hour. When the kitchen smells like a {noun}, it is ready.\n\nLet the pie cool on the windowsill. Last year a {animal} tried to sniff it, so Grandpa {past tense verb} on the porch all afternoon to guard it."}, {"id": "on-the-farm-05", "theme": "On the Farm", "title": "The Barnyard News", "text": "Good morning! This is Ellie, reporting live from Clover Farm for the Barnyard News.\n\nOur top story today: Henrietta the hen laid an egg as big as a {noun}. Farmer Pat says it is the biggest egg she has ever seen. It is now resting on a pillow in the kitchen.\n\nIn other news, the goats have learned how to {verb}. Nobody knows who taught them. They practice every day behind the {adjective} barn. The weather on the farm will be sunny, with a chance of {plural noun} after lunch.\n\nSports news: Yesterday the pigs had a race. Mud Pie won by {number} inches. He ran {adverb} and only stopped once to {verb}.\n\nThat is all for today. Next week we will visit the {adjective} sheep and ask them about their {plural noun}. Back to you!"}, {"id": "on-the-farm-06", "theme": "On the Farm", "title": "Farmer Rosa's Garden Steps", "text": "Planting a garden on the farm is easy. Just follow these steps from Farmer Rosa.\n\nStep 1: Pick a sunny spot. Make sure the cows are not {verb ending in ing} on it.\nStep 2: Dig a row of little holes. Each hole should be as deep as a {noun}.\nStep 3: Drop two seeds into each hole. Some farmers also drop in a tiny {noun} for luck.\nStep 4: Cover the seeds with dirt and pat them {adverb}.\nStep 5: Water the garden every morning. Seeds also like it when you sing to them about {plural noun}.\nStep 6: Wait. This is the hardest part. Farmer Rosa says to wait {number} days.\n\nIf you do everything right, you will grow carrots, beans, tomatoes, and a giant {adjective} {noun}. If a rabbit tries to {verb} in your garden, just say \"{exclamation}!\" and it will hop away."}, {"id": "on-the-farm-07", "theme": "On the Farm", "title": "The Barn Dance Is Saturday", "text": "Attention, neighbors! The Hollow Creek Farm Barn Dance is this Saturday night. Everyone is invited, even the {plural noun}.\n\nThe dance will start at {number} o'clock in the big red barn. Farmer Gus has swept the floor and hung lights from every {noun}.\n\nThe band will play fiddles, banjos, and a {adjective} washboard. Our caller, Miss June, will teach everyone the Chicken Shuffle. First you flap your arms, then you {verb}, then you spin around {adverb}.\n\nThere will be cornbread, apple cider, and a giant bowl of {food}. Please do not let the goats near the snack table. Last year they {past tense verb} right into the cupcakes.\n\nWear your boots and your most {adjective} hat. The best dancer will win a {noun} and get to ride on the hay wagon first."}, {"id": "on-the-farm-08", "theme": "On the Farm", "title": "A Week on Aunt Molly's Farm", "text": "Monday: Aunt Molly woke me up at five o'clock. The rooster was already {verb ending in ing} on the fence. I fed the chickens and named the smallest one {name}.\nTuesday: I learned to ride a pony. Her name is Peaches. She walks very {adverb} and likes to stop and sniff every {noun}.\nWednesday: We picked strawberries in the morning. I ate {number} strawberries before they got to the basket.\n\nThursday: The pigs got out of their pen! We found them in the garden, sitting next to a {adjective} {noun}.\nFriday: Aunt Molly let me drive the tractor with her. It goes slower than a {animal}, but it felt {adjective}.\nSaturday: We sold eggs and jam at the farmers market. A man bought six jars because he said they smelled like {plural noun}.\n\nSunday: I go home tomorrow. I will miss the animals so much. I told the cows I would {verb} for them every day until I come back."}, {"id": "on-the-farm-09", "theme": "On the Farm", "title": "Help Wanted at Willow Farm", "text": "HELP WANTED at Willow Farm! Farmer Dan needs a helper for the summer. The job is hard work, but it is also very {adjective}.\n\nYour jobs will include:\n- Feeding the goats every morning. They like hay, carrots, and {plural noun}.\n- Counting the sheep. There should be {number} sheep. If there are more, one of them is probably a {noun}.\n- Waking up the rooster. He sleeps late and gets {adjective} if you are too loud.\n- Teaching the ducks how to {verb} across the yard.\n\nThe best helper will be someone who can {verb} {adverb} and is not afraid of a little mud.\n\nYou will be paid in fresh eggs, warm cookies, and one {adjective} {noun} at the end of the summer. To sign up, knock on the barn door and say \"{silly word}!\" three times."}, {"id": "on-the-farm-10", "theme": "On the Farm", "title": "A Letter from Daisy the Cow", "text": "Dear Farmer Ben,\n\nHello. It is me, Daisy, the cow in the third stall. I have a few requests.\n\nFirst, the grass in the north field tastes a little bit like {plural noun}. Could we please eat in the south field instead?\n\nSecond, the barn radio is too loud. The chickens like to {verb} to it all night, and I cannot sleep. Please turn it down or play something {adjective}.\n\nThird, your new hat is very nice. It looks like a {noun}. When I showed the pigs, they {past tense verb} {adverb} for an hour.\n\nLast, I would like a bigger bell. My cousin on the next farm has one shaped like a {food}, and it goes \"{sound}!\" every time she takes a step.\n\nThank you for the {adjective} hay and for scratching my ears. You are the best farmer in {place}.\n\nMoo,\nDaisy"}, {"id": "wild-weather-01", "theme": "Wild Weather", "title": "Weather Wendy's Forecast", "text": "Good morning! This is Weather Wendy with your forecast for Maple Town.\n\nToday will start out sunny and {adjective}. Around lunchtime, a light breeze will blow in from the lake. It will smell a little bit like {food}.\n\nThis afternoon, look out for a gentle shower of {plural noun}. They will fall softly, so you may want to carry a {noun} instead of an umbrella. Tonight the clouds will turn {color} and start {verb ending in ing}. Experts say this is perfectly normal for a Tuesday.\n\nTomorrow, the temperature will reach {number} degrees. Please wear sunscreen, a hat, and your most {adjective} sneakers. The wind will blow {adverb} all day. This has been Weather Wendy. Remember, if the sky starts to {verb}, just go inside and have a snack!"}, {"id": "wild-weather-02", "theme": "Wild Weather", "title": "Breaking News from Puddle Lane", "text": "This is Max Miller with breaking news from Puddle Lane.\n\nAt nine o'clock this morning, a small {adjective} cloud floated over Lincoln School and began raining {plural noun}. Students watched {adverb} from the classroom windows.\n\n\"I have never seen anything like it,\" said Principal Gray. \"It was very {adjective}. We had to skip recess and {verb} instead.\"\n\nThe cloud then moved to the park, where it rained on a man {verb ending in ing} with his dog. The man said it felt like being tickled by a {noun}.\n\nWeather experts say the cloud is shaped like a {animal} and is now heading toward the library. Neighbors are asked to keep their windows closed and their {plural noun} indoors.\n\nWe will keep you updated. Back to you, {name}!"}, {"id": "wild-weather-03", "theme": "Wild Weather", "title": "My Weather Journal for Science", "text": "Our teacher, Mr. Reed, asked us to
