<style>
/* Layout: a single workbook column — theme shelf, then one prompt card at a time, then the story read-aloud page on ruled paper. */
:root {
  --paper: #fbf9f1;
  --rule: #d6e2f3;
  --margin: #f2a7a0;
  --ink: #1f2c55;
  --ink-soft: #55607f;
  --card: #ffffff;
  --line: #e4e2d6;
  --sun: #ffcb3d;
  --sun-ink: #3a2a00;
  --blue: #2b59c3;
  --blue-ink: #ffffff;
  --fill: #fff1b8;
  --fill-line: #e0a800;
  --display: "Sniglet", "Comic Neue", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --shadow: 0 2px 0 rgba(31,44,85,.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1c2622; --rule: #2a3833; --margin: #6b3f3b;
    --ink: #eef2e6; --ink-soft: #a9b6ac; --card: #24302b; --line: #34433d;
    --sun: #ffcb3d; --sun-ink: #2b1f00; --blue: #7fa6ff; --blue-ink: #10204a;
    --fill: #4a3d12; --fill-line: #ffcb3d; --shadow: 0 2px 0 rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1c2622; --rule: #2a3833; --margin: #6b3f3b;
  --ink: #eef2e6; --ink-soft: #a9b6ac; --card: #24302b; --line: #34433d;
  --sun: #ffcb3d; --sun-ink: #2b1f00; --blue: #7fa6ff; --blue-ink: #10204a;
  --fill: #4a3d12; --fill-line: #ffcb3d; --shadow: 0 2px 0 rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; text-wrap: balance; line-height: 1.1; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 7vw, 44px); letter-spacing: .5px; }
.logo .blank {
  display: inline-block; min-width: 2.6em; border-bottom: 5px solid var(--sun);
  color: var(--blue); text-align: center; margin: 0 .08em;
}
.tag { color: var(--ink-soft); margin: 4px 0 0; }
.linkbtn { background: none; border: 0; color: var(--blue); font-weight: 700; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }

.btn {
  border: 2px solid var(--ink); border-radius: 14px; padding: 12px 20px;
  background: var(--card); color: var(--ink); font-family: var(--display); font-size: 19px;
  box-shadow: 0 3px 0 var(--ink); transition: transform .08s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.go { background: var(--sun); color: var(--sun-ink); }
.btn.blue { background: var(--blue); color: var(--blue-ink); }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Theme shelf */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.theme {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 16px;
  padding: 14px; color: var(--ink); box-shadow: var(--shadow); min-height: 112px;
}
.theme:hover { border-color: var(--blue); }
.theme .pic { font-size: 32px; line-height: 1; }
.theme .name { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.15; }
.theme .count { font-size: 13px; color: var(--ink-soft); }
.theme.surprise { background: var(--sun); color: var(--sun-ink); border-color: var(--sun); }
.theme.surprise .count { color: var(--sun-ink); }
.stats { color: var(--ink-soft); font-size: 15px; }

/* Prompt card */
.story-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.story-head .theme-label { font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-soft); font-weight: 700; }
.story-head h2 { font-size: clamp(24px, 5vw, 32px); }
.progress { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink-soft); }
.dot.done { background: var(--sun); border-color: var(--fill-line); }
.dot.now { background: var(--blue); border-color: var(--blue); }

.card {
  background: var(--card); border: 2px solid var(--ink); border-radius: 22px;
  padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 5px 0 var(--ink);
}
.ask { font-size: 18px; color: var(--ink-soft); margin: 0; }
.kind { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 9vw, 52px); color: var(--blue); line-height: 1; }
.meaning { font-size: 19px; margin: 0; }
.examples { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--ink-soft); font-size: 15px; }
.chip { background: var(--fill); border-bottom: 2px solid var(--fill-line); color: var(--ink); padding: 2px 10px; border-radius: 8px; font-style: italic; }
.answer {
  width: 100%; font: 700 26px var(--body); color: var(--ink); background: transparent;
  border: 0; border-bottom: 4px solid var(--ink); padding: 8px 2px; border-radius: 0;
}
.answer:focus { outline: none; border-bottom-color: var(--blue); }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.err { color: #b3261e; font-weight: 700; margin: 0; min-height: 1.5em; }
:root[data-theme="dark"] .err { color: #ff9c92; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .err { color: #ff9c92; } }

/* Word-asking screen: fills the visible area above the on-screen keyboard */
body.asking { overflow: hidden; }
.askscreen {
  position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 5;
  background: var(--paper); display: flex; justify-content: center;
  padding-top: max(10px, env(safe-area-inset-top, 0px));
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.askinner { width: 100%; max-width: 760px; height: 100%; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.asktop { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex: none; }
.asktop .theme-label, .askhead .theme-label { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-soft); font-weight: 700; }
.askscroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
.asktitle { font-size: clamp(22px, 5vw, 30px); }
.askscroll .card { flex: none; }
.askbottom { flex: none; display: flex; flex-direction: column; gap: 6px; padding-bottom: 2px; }
.askbottom .nav { flex-wrap: nowrap; }
.askbottom .nav .go { flex: 1; }
.askbottom .err { min-height: 1.2em; font-size: 15px; }
.sr { position: absolute; left: -9999px; }
.askscreen.tight .askinner { gap: 6px; }
.askscreen.tight .asktitle { font-size: 18px; }
.askscreen.tight .askhead .theme-label { display: none; }
.askscreen.tight .dot { width: 10px; height: 10px; }
.askscreen.tight .card { padding: 12px 14px; gap: 6px; border-radius: 16px; box-shadow: 0 3px 0 var(--ink); }
.askscreen.tight .ask { font-size: 15px; }
.askscreen.tight .kind { font-size: 32px; }
.askscreen.tight .meaning { font-size: 16px; }
.askscreen.tight .examples { font-size: 14px; flex-wrap: nowrap; overflow: hidden; }
.askscreen.tight .footnote { display: none; }
.askscreen.tight .answer { font-size: 22px; padding: 4px 2px; }
.askscreen.tight .btn { padding: 8px 14px; font-size: 17px; }

/* Story reveal on ruled paper */
.page {
  position: relative; border-radius: 6px; padding: 28px 22px 28px 46px;
  background-color: var(--card);
  background-image:
    linear-gradient(to right, transparent 32px, var(--margin) 32px, var(--margin) 34px, transparent 34px);
  box-shadow: var(--shadow); border: 1px solid var(--line);
}
.page h2 { font-size: clamp(26px, 6vw, 36px); margin-bottom: 14px; }
.page .text {
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 36px, var(--rule) 36px, var(--rule) 38px, transparent 38px, transparent 40px);
}
.page .text p { font-size: clamp(19px, 4.4vw, 23px); line-height: 40px; margin: 0 0 40px; }
.page .text p:last-child { margin-bottom: 0; }
.w {
  background: var(--fill); border-bottom: 3px solid var(--fill-line); padding: 0 4px;
  font-weight: 700; border-radius: 4px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.w:hover { background: var(--sun); color: var(--sun-ink); }
.w.reading { background: var(--sun); color: var(--sun-ink); }
.legend { color: var(--ink-soft); font-size: 15px; margin: 0; }
.tip {
  position: fixed; z-index: 20; background: var(--ink); color: var(--paper); font-size: 14px;
  padding: 6px 10px; border-radius: 8px; pointer-events: none; max-width: 240px;
}
.footnote { color: var(--ink-soft); font-size: 14px; text-align: center; }
@media (max-width: 480px) {
  .card { padding: 18px; }
  .page { padding: 22px 14px 22px 42px; }
  .btn { padding: 11px 16px; font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }
.pop { animation: pop .18s ease-out; }
</style>

<script>
const STORIES = [{"id": "space-01", "theme": "Space", "title": "Postcard from the Moon", "text": "Dear Grandpa,\nGreetings from the moon! The flight took {number} hours, and the pilot let me hold a {adjective} {noun} the whole time. The moon is very dusty and smells a little bit like {food}. My hotel room has a tiny bed, a window, and a big pile of {plural noun} in the corner.\n\nYesterday I went for a moon walk. Everything floats up here, so I {past tense verb} right over a crater. A moon guide named Doris showed me how to {verb} without bouncing away. She walks very {adverb} and wears a helmet shaped like a {noun}.\n\nThe moon rules are easy. Always wear your boots, never let go of your {plural noun}, and do not {verb} near the edge of a crater. Dinner is soup in a tube, with a side of {plural noun}.\n\nTomorrow I will bring you back a jar of {adjective} moon rocks from the gift shop. Please tell Mom I am still {verb ending in ing} every night before bed.\nLove,\nSam"}, {"id": "space-02", "theme": "Space", "title": "Rules for the Space Station Kitchen", "text": "Welcome to the kitchen on Space Station Ten! There is no gravity up here, so please follow these rules.\n\nRule one: Always buckle your sandwich to the table. Last week a sandwich floated loose and stuck to Commander Lopez's {body part}. She was very {adjective} about it. Rule two: Do not open the jar of {plural noun} without asking. Everything inside will drift {adverb} around the room for a week.\n\nRule three: Drinks come in {adjective} pouches. Please do not {verb} while you drink, or the juice will turn into {number} floating {plural noun}. Rule four: Pizza night is on Fridays. The cook makes it with tomato sauce, cheese, and a sprinkle of {plural noun}. Everyone eats it upside down while {verb ending in ing}.\n\nIf you see a {adjective} {noun} floating near the oven, do not touch it. Just shout \"{exclamation}!\" and the cleaning robot will come get it."}, {"id": "space-03", "theme": "Space", "title": "Help Wanted: Astronaut", "text": "Help wanted! The Starlight Space Company is looking for a {adjective} astronaut to fly our newest rocket. The rocket is very shiny and is about the size of a {noun}.\n\nAstronauts must be able to {verb} for three hours without stopping. You should also know how to steer with your {body part} and carry {number} {plural noun} at the same time.\n\nOn a normal day, you will check the engines, water the space {plural noun}, and say hello to the {plural noun} who live on the moon. Lunch is a tube of {food} and a {adjective} cookie.\n\nTo apply, please send us a letter and a drawing of yourself {verb ending in ing} in space. Our last astronaut {past tense verb} all the way to Mars and decided to stay, so we need someone new by Tuesday. Please write your letter {adverb} and in crayon."}, {"id": "space-04", "theme": "Space", "title": "Breaking News from Mars", "text": "Good evening. This is Channel Seven News with a big story from Mars. This morning, a friendly alien named Zib opened the first bakery on the red planet.\n\nThe bakery is small and {adjective}, with a sign shaped like a {noun}. The most popular treat is a muffin filled with {plural noun}. Zib also sells bread, cookies, and {adjective} cupcakes with {color} frosting. \"I bake everything {adverb},\" Zib told our reporter. \"That is the secret.\"\n\nThe line was very long. Some customers waited {number} hours and passed the time {verb ending in ing} in the red dust. One astronaut was so happy that he {past tense verb} all the way back to his rocket. The only rule is: please do not {verb} on the muffins.\n\nZib hopes to open a second bakery on the moon next year. For now, the bakery is closed on Tuesdays, when Zib likes to {verb} with friends. Now back to you, {name}, with the {adjective} weather report."}, {"id": "space-05", "theme": "Space", "title": "How to Make Moon Pancakes", "text": "Moon pancakes are the favorite breakfast of every astronaut on the space station. Here is how to make them.\n\nFirst, put two cups of flour and a handful of {plural noun} into a {adjective} bowl. Add one egg, a splash of milk, and a {noun}. Stir it {adverb} with a {noun} until it looks like moon dust.\n\nNext, pour the batter into a pan. There is no gravity, so the pancakes will float away, and you must {verb} to catch them. Flip each pancake {number} times. When it turns {color}, it is ready. If it starts to {verb}, turn the heat down.\n\nFinally, stack your pancakes on a plate and top them with syrup and {plural noun}. Commander Kim likes to eat hers while {verb ending in ing} past the window. Serve with a glass of {adjective} juice, and always say \"{exclamation}!\" before the first bite."}, {"id": "space-06", "theme": "Space", "title": "An Interview with the Moon", "text": "Today our class newspaper got to interview the moon! The moon was very polite and only a little bit {adjective}.\n\nFirst, we asked what it does all day. \"Mostly I float around Earth and look {adjective},\" the moon said. \"On weekends I like to {verb} with the stars.\" Then we asked about its favorite food. \"Cheese, of course,\" it said. \"But I also love a big bowl of {plural noun}.\"\n\nNext, we asked who comes to visit. \"Astronauts, sometimes,\" said the moon. \"The last one brought me a {noun} as a present and {past tense verb} across my craters for an hour. Comets zoom by {adverb}, but they never stay for {food}.\"\n\nLast, we asked for advice for kids. \"Always brush your {plural noun},\" the moon said. \"Wear a {color} hat when it is chilly. Never {verb} with your mouth full. And never stop {verb ending in ing} before bedtime.\" Then it gave us a {adjective} wave and went back to work."}, {"id": "space-07", "theme": "Space", "title": "Captain's Log, Day Three", "text": "Captain's log, day three. Our rocket is flying past Jupiter, and everything is going {adverb}. The crew had {plural noun} for breakfast again. Nobody complained.\n\nAt ten o'clock, a {adjective} comet zoomed past the window. It was shaped exactly like a {noun}. My copilot, a dog named Biscuit, {past tense verb} at it until it was gone. Biscuit is the best copilot in the galaxy, but he still does not know how to {verb}.\n\nAt lunch, the engine started making a funny noise, like \"{sound}.\" I fixed it with tape and two {plural noun}. Then Biscuit and I took a {adjective} nap.\n\nTomorrow we will land on a small planet covered in {plural noun}. I plan to spend the whole day {verb ending in ing}. I will pack my {adjective} flag, a {noun}, and a snack for Biscuit."}, {"id": "space-08", "theme": "Space", "title": "How to Pack for Saturn", "text": "Going to Saturn? Saturn is very far away, so you need to pack carefully. Here is what to bring.\n\nFirst, pack a warm coat and {number} pairs of socks. Saturn is chilly, and the wind blows {adverb}. Next, bring a {adjective} helmet. The best helmets are round, clear, and about the size of a {noun}.\n\nDo not forget your snacks. Most travelers bring crackers, apples, and a bag of {plural noun}. If you want to {verb} on Saturn's rings, you will also need roller skates and a {color} map. Leave your {plural noun} at home. They get very {adjective} in space.\n\nFinally, pack something to do on the long ride. Many kids bring a book about {plural noun} or spend the trip {verb ending in ing} with their family. When you land, the Saturn welcome team will shake your {body part} and hand you a {adjective} snow cone."}, {"id": "space-09", "theme": "Space", "title": "Welcome Aboard Rocket Flight Nine", "text": "Hello, passengers, and welcome aboard Rocket Flight Nine to the moon! This is your captain speaking. My copilot today is a very {adjective} {animal}. Our trip will take about {number} hours. Please keep your seat belts on and your {plural noun} under your seat.\n\nIn a few minutes, a robot will come by with peanuts, orange slices, and warm {plural noun}. If you feel {adjective}, press the blue button above your seat, and a helper will bring you a {noun}. Please keep your {body part} inside the rocket at all times.\n\nOn the left side of the rocket, you can see Earth. It looks about the size of a {noun} from up here. On the right side, a family of space ducks is {verb ending in ing} past the window. Please do not {verb} at them. They are shy.\n\nWe will land {adverb} on the moon at lunchtime. Thank you for flying with us, and have a {adjective} day."}, {"id": "space-10", "theme": "Space", "title": "Letter Home from Space Camp", "text": "Dear Mom and Dad,\nSpace camp is going great! My bunk bed is shaped like a rocket, and my counselor, Ms. Rivera, is very {adjective}. Every morning we wake up at six and eat a bowl of {plural noun}.\n\nOn Monday we practiced floating in the big pool. I {past tense verb} so well that Ms. Rivera gave me a gold star. On Tuesday we built model rockets out of cardboard and {plural noun}. Mine flew {adverb} over the {noun} and landed in the camp director's {plural noun}.\n\nTonight we are having a star party. We will look through a giant telescope and learn to {verb} like real astronauts. My friend Max says he once saw a planet that looked exactly like a {food}. The camp rule is no {verb ending in ing} after bedtime.\n\nPlease send more socks and a {adjective} flashlight. I miss you and the {animal} very much.\nLove,\nJordan"}, {"id": "robots-01", "theme": "Robots", "title": "Meet Your New Helper Robot", "text": "Congratulations on your new Helper Robot 3000! Please read these instructions before you turn it on.\n\nTo start your robot, pull the {adjective} lever on its back and say its name {adverb}. It will open its eyes, beep twice, and ask for a {noun}. This is normal. Your robot can sweep the floor, fold the laundry, and {verb} while you sleep.\n\nEvery night, plug your robot into the wall and give it a snack of {number} {plural noun}. Do not let it near water or {plural noun}. If your robot starts {verb ending in ing} in the kitchen, it is just happy.\n\nIf you have a problem, check the little screen on its chest. A {color} light means it needs a nap. A blinking light means it {past tense verb} into the closet again. A funny smell means it ate your {plural noun}. For help, please call our {adjective} helper line and ask for {name}."}, {"id": "robots-02", "theme": "Robots", "title": "Diary of a Robot Who Loves to Dance", "text": "Dear Diary,\nMy name is Unit Six. I work at the cookie factory, where I put {plural noun} on cookies all day. It is a {adjective} job, but secretly I want to be a dancer.\n\nToday after work, I practiced in the parking lot. First I spun around {number} times. Then I tried to {verb} like the people on TV. My arms went one way, my wheels went the other way, and I {past tense verb} right into a {noun}.\n\nA little girl named Rosa saw me. She did not laugh. She showed me a dance called the {silly word}. You wiggle your {body part}, clap your hands {adverb}, and spin like a {adjective} washing machine.\n\nTomorrow I will teach the dance to the other robots. We will practice every day at lunch, right next to the {plural noun}. My boss will be so {adjective} that she will start {verb ending in ing}."}, {"id": "robots-03", "theme": "Robots", "title": "Rules for the Robot Science Fair", "text": "Welcome to the Maple Street Robot Science Fair! Every robot must follow these rules.\n\nAll robots must be shorter than the gym door and lighter than a {noun}. Each robot must do one helpful job, like sweeping, sorting socks, or carrying {number} {plural noun} at once. Robots may not {verb} during the judging. Last year a robot did that, and the judges {past tense verb} for a week.\n\nPlease keep your robot's battery charged. If your robot runs out of power, it might start {verb ending in ing} in the corner. Please do not feed your robot {plural noun}. It is bad for the wires. Robots must also keep their {body part} off the snack table.\n\nFirst prize is a shiny trophy and a {adjective} ribbon. Second prize is a {noun}. Mr. Ortiz, our {adjective} judge, will walk {adverb} past each table and take notes. Good luck, and may the best robot {verb}!"}, {"id": "robots-04", "theme": "Robots", "title": "Wanted: A Robot to Walk the Dog", "text": "Wanted: one friendly robot to walk our dog, Noodle. Noodle is small, fluffy, and very {adjective}. He weighs about as much as a {noun}.\n\nNoodle needs a walk every morning at seven. He likes to stop and sniff every tree, mailbox, and {noun} on our street. The robot must hold the leash {adverb} and never let Noodle {verb} in the mud. Noodle does not like {plural noun}, so please walk around them.\n\nAfter the walk, the robot will give Noodle a {adjective} bath and a treat shaped like a {food}. Noodle also likes to hear songs about {plural noun}. Our last robot sang to him every day, but it {past tense verb} so loudly that the neighbors closed their windows.\n\nThe pay is {number} shiny bolts a week and all the oil you want. If you are good at {verb ending in ing}, please knock on the {color} door at our house."}, {"id": "robots-05", "theme": "Robots", "title": "Robot Wins the Town Pie Contest", "text": "This just in from the Pine Hill Fair! For the first time ever, a robot has won the town pie contest. The robot, named Gizmo, baked a {adjective} pie filled with apples and {plural noun}.\n\nThe judges took one bite and {past tense verb} right out of their chairs. \"It tastes like {food} and sunshine,\" said Judge Patel. \"I have never had anything so {adjective}.\" Gizmo says the secret is to stir the filling {adverb} and to {verb} while the pie bakes. Gizmo also adds a pinch of {plural noun}.\n\nLast year's winner, Mrs. Green, was a good sport. She shook Gizmo's metal {body part} and asked for the recipe. Gizmo printed it out on a long strip of paper.\n\nGizmo won a blue ribbon, a brand-new {noun}, and a year of free {plural noun}. Next year, Gizmo plans to bake {number} pies and spend the summer {verb ending in ing} at the beach."}, {"id": "robots-06", "theme": "Robots", "title": "Robo-Chef's Famous Tuesday Soup", "text": "Hello, I am Robo-Chef, and this is my famous Tuesday soup. It is the favorite soup of everyone at the robot repair shop.\n\nFirst, fill a big pot with water and three {plural noun}. Turn on the stove and wait until the water is {adjective}. Next, chop one carrot, two potatoes, and a {noun}. Drop them in {adverb}, one at a time.\n\nNow it is time for my secret ingredient: a pinch of {plural noun}. Stir the soup with your longest {body part} for {number} minutes. If the soup starts to {verb}, that means it is almost ready. If it smells {adjective}, add more salt.\n\nPour the soup into a {adjective} bowl and top it with a little {food}. My helpers like to eat it while {verb ending in ing} by the window. Enjoy, and do not forget to {verb} your bowl when you are done!"}, {"id": "robots-07", "theme": "Robots", "title": "A Thank-You Note to My Robot Vacuum", "text": "Dear Beep-Bop,\nThank you for cleaning our house every single day. You are the most {adjective} vacuum in the whole neighborhood. You zoom {adverb} under the couch and come out covered in {plural noun}.\n\nI am sorry about last Tuesday. I did not mean to leave a {noun} in the hallway. It got stuck in your wheels, and you {past tense verb} in a circle for an hour. Grandma says you sounded like \"{sound}\" the whole time.\n\nAlso, thank you for not eating my {plural noun} this week. I know you wanted to. Mom says I must pick up my toys and never {verb} near your brushes. Dad says you can {verb} in the garage on Saturdays.\n\nTo say thank you, I made you a {adjective} sticker shaped like a {food}. I hope you like it. Please keep {verb ending in ing} and being our {adjective} friend.\nLove,\nPenny"}, {"id": "robots-08", "theme": "Robots", "title": "A Chat with the Robot Crossing Guard", "text": "Our school paper talked to Bolt, the robot crossing guard on Elm Street. Bolt is tall, shiny, and a little bit {adjective}. Bolt has worked ade class.\n\nMath: Zip can count to one hundred in two seconds, but sometimes says \"{silly word}\" instead of seven. Reading: Zip reads {adverb} and loves books about {plural noun}. Last week, Zip read a whole book while {verb ending in ing} on one wheel.\n\nArt: Zip painted a picture of a {adjective} {noun}. It is now hanging in the front office. Music: Zip can sing, but whenever Zip tries to {verb}, {plural noun} come out of its ears. Recess: Zip is very good at tag, but once Zip {past tense verb} into the sandbox and had to be shaken off. Lunch: Zip eats {number} bolts and a {adjective} sandwich.\n\nTeacher's note: Zip is a kind and {adjective} friend. Zip shares snacks and always holds the door. Next year, please send Zip to school with more oil, a {color} lunchbox, and a spare {noun}."}, {"id": "superheroes-01", "theme": "Superheroes", "title": "Now Hiring: Sidekick", "text": "Now hiring! Captain Kindness is looking for a {adjective} sidekick to help around town. You will work every Saturday from nine until lunchtime.\n\nYour jobs will include helping kittens down from trees, carrying groceries for neighbors, and finding lost {plural noun}. You must be able to run {adverb}, hop over a {noun}, and {verb} without getting dizzy. You must not be afraid of {plural noun}.\n\nEvery sidekick gets a cape, a mask, and a bright {color} belt with {number} pockets. Captain Kindness will also teach you the secret hero handshake. It uses your {body part} and a little bit of {verb ending in ing}. Sidekicks may not {verb} in the hero car.\n\nOur last sidekick {past tense verb} so much that he needed a long vacation. To apply, please bring a smile, a pencil, and a {adjective} sandwich to the library on Tuesday."}, {"id": "superheroes-02", "theme": "Superheroes", "title": "My First Week with Super Powers", "text": "Dear Diary,\nOn Monday I woke up and found out I have super powers! I can fly, but only about as high as a {noun}. I can also see through walls, but only if I wiggle e to {verb} really fast.\"\n\nNext, we asked about his best rescue ever. He said a little boy once lost his {noun} at the park. Captain Helpful searched {adverb} for three hours and finally found it under a {adjective} slide.\n\nLast, we asked how kids can be heroes. \"Be kind, share your {plural noun}, and help your family,\" he said. \"Eat your carrots and your {plural noun}. And never stop {verb ending in ing}.\" Then he gave us each a {noun}, waved, and {past tense verb} out the door."}, {"id": "superheroes-07", "theme": "Superheroes", "title": "Letter Home from Hero Camp", "text": "Dear Grandma,\nHero camp is the best place ever! My cabin is called Blue Lightning. It has {number} bunk beds and a {adjective} flag. My camp leader, Captain Sunny, is very {adjective} and can fly backwards.\n\nEvery morning we practice our powers. Yesterday I lifted a {noun} over my head. My friend Leo practiced being invisible, but we could still see his {body part}. In the afternoon we learned how to {verb} on the soft grass.\n\nAt dinner we eat hero stew, which is mostly carrots and {plural noun}. Then we sit by the campfire and sing songs about {plural noun}. Captain Sunny sings {adverb}. Last night I {past tense verb} so hard that I fell asleep before the song ended.\n\nI will be home on Sunday. Please save me a slice of {food} and tell the dog I have been {verb ending in ing} every day.\nLove,\nAva"}, {"id": "superheroes-08", "theme": "Superheroes", "title": "How to Design Your Own Cape", "text": "Every hero needs a good cape. Here is how to make your very own.\n\nFirst, find an old towel or blanket. Ask a grown-up first! Lay it flat on the floor and decorate it with markers, stickers, and {plural noun}. Many heroes draw a big {noun} in the middle. That is your hero symbol.\n\nNext, choose your hero colors. Most heroes pick red or blue, but you can pick {color}. Then give yourself a hero name, like Captain {silly word} or The {adjective} Wonder. Ask your grown-up to clip the cape to your shirt with a {noun}.\n\nNow practice your hero moves. Stand tall, put your hands on your {plural noun}, and get ready to {verb}. A real hero walks {adverb} and helps anyone who is {verb ending in ing}. Last week, a hero named Kim {past tense verb} so fast that her cape flew off. Your cape may feel {adjective} at first. When you are done, hang it next to your {plural noun} so it is ready for tomorrow."}, {"id": "superheroes-09", "theme": "Superheroes", "title": "Superhero Talent Show Tonight", "text": "Attention, everyone! The yearly Superhero Talent Show starts tonight at six o'clock in the town park. Bring a blanket, a snack, and your {adjective} family.\n\nTwelve heroes will show off their powers. Rocket Ron will fly in circles while holding a {noun}. Ice Lady will make a snowman shaped like a {animal}. Mighty Max will lift {number} {plural noun} at the same time, and then he will {verb} for the crowd.\n\nThe judges are Mayor Bell, a librarian, and a very {adjective} dog named Scout. Scout will bark {adverb} when he likes an act. The winner gets a golden cape and a whole year of free {plural noun}.\n\nThe snack table will have popcorn, apples, and {food}. Please clap {adverb}, cheer kindly, and do not try {verb ending in ing} on the stage. Last year a hero did that, and the stage {past tense verb} for an hour."}, {"id": "superheroes-10", "theme": "Superheroes", "title": "Postcard from a Hero on Vacation", "text": "Dear Sidekick,\nGreetings from Sunny Beach! Even heroes need a vacation. I am staying in a little hotel shaped like a {noun}, and every morning I eat pancakes with {plural noun} on top.\n\nI am trying very hard to relax, but it is not easy. Yesterday a beach ball floated away, so I {past tense verb} into the waves and brought it back. Then a little boy dropped his ice cream, so I flew {adverb} to the shop and got him a {adjective} new one. Today I helped a {adjective} crab carry {number} {plural noun} home.\n\nTomorrow I plan to {verb} in the and scrub until the deck is {color}.\n\nIf you follow every rule, you get to steer the ship and wear the captain's {adjective} coat."}, {"id": "pirates-03", "theme": "Pirates", "title": "Help Wanted: Parrot Sitter", "text": "HELP WANTED! Captain Fizz is going on a treasure hunt and needs someone to take care of his parrot, Professor Feathers.\n\nProfessor Feathers is {number} years old and very {adjective}. He eats crackers and a small bowl of {plural noun} every morning. After breakfast, he likes to sit on a {noun} and sing sea songs {adverb}. He knows all the words except one, so he just yells \"{silly word}!\" instead.\n\nThe right person must be able to {verb} and whistle at the same time. You must also be good at {verb ending in ing}, because Professor Feathers gets bored very fast. Please do not let him near the captain's {plural noun}. He hides them in his nest.\n\nPay is one gold coin a day and all the {food} you can eat. If you want the job, please {verb} three times next to the ship and wave a {adjective} flag."}, {"id": "pirates-04", "theme": "Pirates", "title": "Letter Home from Pirate Camp", "text": "Dear Mom and Dad,\n\nPirate Camp is going great! On the first day, Captain Jo gave everyone a striped shirt and a {adjective} eye patch. My bunk is next to the camp parrot, who squawks like a {animal} all night.\n\nEvery morning we practice tying knots. Yesterday I looked through the telescope and saw a whole island made of {plural noun}! Then we learned how to {verb} like a real pirate. Captain Jo said I was very {adjective} at it.\n\nToday we went on a treasure hunt. We followed the map {adverb} and dug under a {adjective} palm tree. Inside the chest we found {number} {plural noun} and a note that said \"Good job, mateys!\" Then everyone {past tense verb} back to the cabins.\n\nPlease send more socks, a new {noun}, and a jar of {food}. I miss you, and I miss {verb ending in ing} in my own bed.\n\nLove,\nSam\n\nP.S. The camp parrot learned a new word. It is \"{silly word}!\""}, {"id": "pirates-05", "theme": "Pirates", "title": "How to Read a Treasure Map", "text": "So you found a treasure map! Here is how to use it.\n\nStep one: Unroll the map {adverb}. Old maps are very {adjective} and can rip if you pull too hard. Some also smell a little bit like {food}.\n\nStep two: Find the big red X. That is where the treasure is. If the X is next to a drawing of a {noun}, you are going the right way.\n\nStep three: Count your steps. Most maps say something like \"Walk ten steps past the {adjective} tree, then hop like a {animal}.\" Always do what the map says, even the hopping part.\n\nStep four: Start {verb ending in ing}. Real pirates dig with a shovel, but my uncle Pete uses a {noun}.\n\nStep five: Open the chest {adverb}. Inside you might find gold coins, shiny jewels, or {number} {plural noun}. Last summer my sister found a whole box of {plural noun}. She {past tense verb} all the way home."}, {"id": "pirates-06", "theme": "Pirates", "title": "Pirate News at Six", "text": "Good evening, and welcome to Pirate News at Six. I'm Polly Anchor.\n\nOur top story tonight: Captain Bea and her crew have found the lost treasure of Pickle Island! The treasure was buried under a giant {noun} for {number} years. Inside the chest were gold coins, silver cups, and a pile of {adjective} {plural noun}. Captain Bea {past tense verb} right there on the sand. \"This is the most {adjective} day of my life!\" she said.\n\nIn other news, the town parrot contest was held today. The winner was a parrot named Kiwi, who can say \"{exclamation}\" and {verb} at the same time. The judges said Kiwi was the most {adjective} bird they had ever seen.\n\nNow for the weather. Tomorrow will be sunny with a chance of {plural noun} in the afternoon. Sailors should bring a {noun} and sail {adverb}. Good night, mateys, and sweet dreams about {plural noun}!"}, {"id": "pirates-07", "theme": "Pirates", "title": "Cook Marigold's Famous Ship Stew", "text": "Every Frid ell, it brought a {noun} and two {plural noun}. Back to you in the studio, {name}!"}, {"id": "dinosaurs-05", "theme": "Dinosaurs", "title": "Mama Stegosaurus's Leafy Pancakes", "text": "This recipe has been in our dinosaur family for a very long time. It makes enough pancakes for one hungry Stegosaurus or {number} small children.\n\nYou will need two cups of flour, a bucket of leaves, and a {adjective} {noun}. First, put the leaves in a bowl and stir them {adverb}. Next, add the flour and a handful of {plural noun}. This is the secret part.\n\nNow it is time to {verb}. Do this for ten minutes, or until the batter turns {color}. Pour it into a pan the size of a {noun}. When the pancakes start {verb ending in ing}, flip them with your tail.\n\nServe them warm with {food} and a glass of {adjective} milk. Mama Stegosaurus says that if your pancakes {past tense verb}, you did it right. A good pancake should always taste like {plural noun}!"}, {"id": "dinosaurs-06", "theme": "Dinosaurs", "title": "Wanted: Dinosaur Babysitter", "text": "Wanted: A friendly babysitter for three baby dinosaurs. You must be {adjective} and good at bedtime stories.\n\nThe babies are named Dot, Rex, and Pebble. Dot likes to {verb} on the kitchen table. Rex collects {plural noun} and hides them under his bed. Pebble will only eat {food} with a {adjective} spoon.\n\nYour jobs include giving baths, brushing their {plural noun}, and singing {adverb} until everyone falls asleep. You may also need to find Pebble, who loves {verb ending in ing} behind the couch.\n\nYou will be paid one shiny {noun} per hour, plus all the {plural noun} you can eat.\n\nTo apply, please {verb} at our front door. Do not ring the bell. The last time someone rang it, the babies {past tense verb} for a whole hour and Dad lost his {noun}."}, {"id": "dinosaurs-07", "theme": "Dinosaurs", "title": "Welcome to the Fossil Hall", "text": "Hello, and welcome to the Fossil Hall! My name is Mr. Pine, and I will be your tour guide. Please stay with the group, walk {adverb}, and keep your {plural noun} to yourselves.\n\nOn your left is the biggest dinosaur skeleton in the state. Scientists found it in a farmer's {noun} in 1952. They think it was very {adjective} and liked to {verb} in the afternoon.\n\nOver here is a real dinosaur footprint. If you look closely, you can see it was made by a dinosaur wearing {color} socks.\n\nThis glass case holds a fossil of a dinosaur {body part}. It is our most {adjective} treasure. Please do not tap on the glass. The last boy who did that {past tense verb} all the way home.\n\nOur tour ends in the gift shop, where you can buy a postcard, a toy {noun}, or {number} {plural noun}. Thank you for {verb ending in ing} with me today!"}, {"id": "dinosaurs-08", "theme": "Dinosaurs", "title": "An Interview with a Triceratops", "text": "Today our class reporter, Max, talked with Tina the Triceratops.\n\nMax: What do you do every morning?\nTina: First I brush my three horns with a {adjective} toothbrush. Then I eat a bowl of {plural noun} with {food} on top, and I go for a {adjective} walk.\n\nMax: What is your favorite hobby?\nTina: I love {verb ending in ing}. I also play the {noun} in a band with two {plural noun}.\n\nMax: What makes you laugh?\nTina: When my friend Gary tries to {verb}. He is not very good at it, but he tries {adverb}.\n\nMax: What advice do you have for kids?\nTina: Always eat your vegetables, and never {verb} with your mouth full. Also, keep a {noun} in your pocket, just in case.\n\nMax: Thank you, Tina! Anything else?\nTina: Yes. Please tell everyone at school that I {past tense verb} today and that I said \"{exclamation}!\""}, {"id": "dinosaurs-09", "theme": "Dinosaurs", "title": "How to Give a Brontosaurus a Bath", "text": "Giving a Brontosaurus a bath is a big job. Follow these steps.\n\nStep one: Fill the tub with warm water and {number} {plural noun}. Brontosauruses like a full tub.\nStep two: Ask her to climb in {adverb}. This may take a while, ry morning. Breakfast is bananas and {plural noun}.\n\nTomorrow we will {verb} down the river in a canoe. I hope I see a sloth {verb ending in ing}!\n\nYour nephew,\nSam\nP.S. Please water my {adjective} plant and say hi to the {noun}."}, {"id": "jungle-adventure-02", "theme": "Jungle Adventure", "title": "What to Pack for the Jungle", "text": "Going on a jungle trip? Here is what every explorer needs to pack.\n\nFirst, bring a raincoat and a pair of {adjective} boots. The jungle is very muddy, and the mud likes to {verb}. Next, pack a flashlight, a water bottle, and {number} {plural noun}. You never know when you might need them.\n\nDo not forget bug spray! Jungle mosquitoes are small but very {adjective}. My cousin forgot his bug spray last year, and he {past tense verb} the whole week.\n\nYou should also pack a hat, a map, and a {noun}. The monkeys are not allowed to have {food}, but they will ask {adverb} anyway. Bring extra {plural noun} for the toucans. Wear your hat on your {body part}.\n\nLast of all, pack a notebook so you can draw every {noun} you see. Happy {verb ending in ing}!"}, {"id": "jungle-adventure-03", "theme": "Jungle Adventure", "title": "Explorer's Journal, Day Three", "text": "Day three in the jungle. I woke up at sunrise because a toucan was {verb ending in ing} on my tent. I gave him a {noun}, and he flew away happy.\n\nAfter breakfast, Professor Plum and I hiked to the Great Waterfall. We found a giant flower that smelled exactly like {food}. Professor Plum wrote it down in her {adjective} notebook.\n\nAt the waterfall, a family of monkeys was taking a bath. The baby monkey {past tense verb} so {adverb} that we all laughed. Then he tossed {number} {plural noun} into the water.\n\nTonight we are camping by the river. Professor Plum says the frogs here can {verb} better than any frog in the world. For dinner we had rice and {plural noun}, cooked {adverb} over the fire. I am trying to stay awake, but I am very {adjective}.\n\nTomorrow we will "id": "jungle-adventure-06", "theme": "Jungle Adventure", "title": "Toucan's Famous Fruit Salad", "text": "Tilly the Toucan makes the best fruit salad in the jungle. Here is her secret recipe.\n\nYou will need two bananas, one mango, a bowl of berries, and a {adjective} coconut. You will also need {number} {plural noun}, but only fresh ones.\n\nFirst, ask a monkey to help you {verb} the bananas. Monkeys are very good at this. Then cut the mango into the shape of a {noun}.\n\nNext, put the fruit in a big bowl and stir it {adverb} with your beak. If you do not have a beak, use a {noun}. Add a sprinkle of {food} on top. Tilly says this makes it taste {adjective}.\n\nLet the salad sit in the sun while you are {verb ending in ing}. If it {past tense verb} while you were gone, that is normal.\n\nServe it in a bowl shaped like a {body part} and wait for your friends to say, \"{exclamation}!\""}, {"id": "jungle-adventure-07", "theme": "Jungle Adventure", "title": "Talking with a Sloth", "text": "Our reporter, Jada, spent the whole day with Sid the Sloth. It took a while.\n\nJada: What does a normal day look like for you?\nSid: I wake up at noon. Then I hang upside down and think about {plural noun}. After that, I take a {adjective} nap.\n\nJada: What is your favorite food?\nSid: Leaves, mostly. But on my birthday I have a {adjective} cake made of {food}.\n\nJada: Do you ever hurry?\nSid: Once. I heard someone was giving away free {plural noun}, so I moved {adverb}. It only took me {number} hours to get there.\n\nJada: What do you do for fun?\nSid: I like {verb ending in ing} with my best friend, a turtle named Gus. Last week we {past tense verb} together.\n\nJada: Any advice for our readers?\nSid: Yes. Slow down, take time to {verb}, and always keep a {noun} in your fur. Also, never {verb} in a {adjective} tree."}, {"id": "jungle-adventure-08", "theme": "Jungle Adventure", "title": "Help Wanted: Jungle Tour Guide", "text": "Help wanted! Jungle Fun Tours needs a new tour guide.\n\nYou must love animals, walking, and {plural noun}. You must be able to {verb} while carrying a big backpack. It also helps if you are {adjective} in the morning.\n\nEvery day, you will lead visitors down the jungle trail. You will point out the parrots, the frogs, and the famous dancing {noun}. When visitors get tired, you will cheer them up by {verb ending in ing}.\n\nThe best part of this job is lunch by the waterfall: rice, beans, and {plural noun}. The hardest part is the monkeys. They like to grab your hat and your {noun}. Just say \"{silly word}\" {adverb}, and they will give them back.\n\nYou get one day off each week and a free {color} shirt. Our last guide loved this job so much that she {past tense verb} every day. To apply, send us a drawing of yourself next to a {adjective} {noun}."}, {"id": "jungle-adventure-09", "theme": "Jungle Adventure", "title": "The Jungle Talent Show", "text": "Attention, all jungle animals! The Jungle Talent Show is this Saturday at the Big Rock by the river. The show starts when the frogs stop {verb ending in ing}. Please bring a blanket and a {noun} to sit on.\n\nHere are some of the acts. The Monkey Brothers will {verb} on one hand while eating bananas. Lola the Leopard will sing a {adjective} song about {plural noun}. Then the elephant will play the trumpet with her {body part}.\n\nThe judges are an owl, a tortoise, and a very {adjective} anteater. The winner gets a golden coconut and {number} {plural noun}.\n\nSnacks will be sold by the parrots. Please pay {adverb}, and do not let the parrots count the money. Last year they {past tense verb} and nobody knew what anything cost.\n\nThe show ends with everyone dancing to a song about a {noun}. See you there, and please wear something {adjective}!"}, {"id": "jungle-adventure-10", "theme": "Jungle Adventure", "title": "A Letter from the River Boat", "text": "Dear Grandpa,\n\nI am writing from a boat on the jungle river. Captain Diaz lets me steer for {number} minutes every afternoon. Yesterday I steered us right into a {noun}, but nobody minded.\n\nThe river is wide and brown and very {adjective}. Pink dolphins swim next to our boat. When I wave, they {past tense verb} and splash me.\n\nEvery night we eat dinner on the deck. The cook makes rice, beans, and a soup made of {plural noun}. Tonight a monkey climbed aboard and tried to {verb} with our spoons. Captain Diaz shooed him away {adverb}.\n\nMy bed is a hammock that smells like {food}. At bedtime the frogs sing. They sound like {plural noun} {verb ending in ing} in the rain. I will bring you back a {adjective} surprise.\n\nLove,\nMaya\nP.S. Please tell the cat I said \"{exclamation}!\" and give her a {noun}."}, {"id": "at-the-zoo-01", "theme": "At the Zoo", "title": "Attention, Zoo Visitors", "text": "Ding, dong! Attention, all zoo visitors. This is an important announcement.\n\nThe lion show starts in {number} minutes. Today Leo the Lion will jump through a hoop and {verb} on a big {adjective} ball. Please clap {adverb} so he knows you are watching.\n\nWe have found a lost item near the penguin pool. It is a small {noun} with {plural noun} on it. If it is yours, please come to the front gate.\n\nThe gorillas are having their nap. Please do not {verb} near their window. The last time someone did, the baby gorilla {past tense verb} for an hour.\n\nThe flamingos are {verb ending in ing} on one leg today. Please do not ask them to stop. They are very {adjective} about it.\n\nToday's special at the snack stand is a {food} sandwich with a side of {plural noun}. Thank you, and have a {adjective} day!"}, {"id": "at-the-zoo-02", "theme": "At the Zoo", "title": "My Zoo Field Trip Report", "text": "Last Friday, my class went to the zoo. Our teacher, Mr. Ruiz, made us hold hands and walk {adverb}.\n\nFirst we saw the giraffes. They are very tall and have long {plural noun}. One giraffe tried to nibble my friend Leo's {noun}, but Mr. Ruiz said it was just being friendly.\n\nNext we visited the reptile house. A turtle was {verb ending in ing} in a tiny pool. I learned that turtles can live to be {number} years old and like to eat {plural noun}.\n\nMy favorite animal was the zebra. Its stripes are black and white and a little bit {color}. It {past tense verb} at me, so I waved back.\n\nWe ate lunch by the duck pond. A {adjective} duck took my {food} and ran away.\n\nIn conclusion, the zoo is {adjective}, and I would like to {verb} there every day. Next time I will bring a {noun}."}, {"id": "at-the-zoo-03", "theme": "At the Zoo", "title": "Penguin House Rules", "text": "Welcome to the Penguin House! It is very cold in here, so please zip up your coat.\n\nRule one: Do not tap on the glass. The penguins do not like it, and they will {verb} at you.\nRule two: Lunch is at noon. Today the penguins will get ice cubes and {number} {plural noun}.\nRule three: Please walk {adverb}. The floor is very slippery, and so are the penguins.\nRule four: Our oldest penguin, Mr. Waddles, wears a tiny {adjective} bow tie. Please tell him he looks {adjective}.\nRule five: If a penguin starts {verb ending in ing}, it means she wants to play. You may wave your {body part} at her.\nRule six: No {plural noun} are allowed in here. Last week a boy brought some, and the penguins {past tense verb} for three days.\nRule seven: Please do not feed the penguins {food} or {plural noun}.\n\nThank you, and please waddle {adverb} on your way out!"}, {"id": "at-the-zoo-04", "theme": "At the Zoo", "title": "Wanted: Zookeeper Helper", "text": "The Sunnyside Zoo is looking for a helper! Do you love animals? Are you {adjective} and good at sharing? Then this job is for you.\n\nEvery morning, you will help brush the elephants' {plural noun}. Then you will sing to the koalas so they can {verb}. On Tuesdays, you will read a book about {plural noun} to the owls.\n\nYou will also help clean the hippo pool. Please wear a raincoat and a {noun} on your head. The hippos splash {adverb} when someone new is {verb ending in ing}.\n\nThe giraffes like their necks scratched with a {adjective} {noun}. Please do not let them {verb} near your lunch.\n\nYou will be paid with a big smile and {number} free {plural noun} every Friday. Our last helper {past tense verb} so much that the monkeys gave her a medal. To apply, draw a picture of a {animal} wearing a {noun}."}, {"id": "at-the-zoo-05", "theme": "At the Zoo", "title": "Your Guide to the Zoo Map", "text": "Welcome to Pine Hill Zoo! Here is a quick guide to help you find your way.\n\nStart at the front gate and walk past the big fountain. The fountain was a gift from a very {adjective} hippo named Gloria. If you toss a {noun} in, Gloria will {verb} for you.\n\nTurn left at the Monkey House. You will hear the monkeys {verb ending in ing} before you see them. They are practicing a play about {plural noun}.\n\nKeep walking until you reach the giant tortoise. He moves {adverb}, so he may still be where he was this morning. His name is {name}. Please wave your {body part} at him.\n\nNext you will find the Bird Garden. The parrots there can say {number} words, but they only like to say \"{silly word}.\"\n\nThe snack stand sells popcorn, juice, and {plural noun}. Our map ends at the gift shop, where you can buy a zoo hat or a {adjective} {noun}. Have a {adjective} visit!"}, {"id": "at-the-zoo-06", "theme": "At the Zoo", "title": "Zoo News: The Elephant Learns to Paint", "text": "Good morning! This is Zoo News, and we have a {adjective} story for you today.\n\nPenny the Elephant has become an artist. Every morning, she holds a paintbrush with her trunk and paints pictures of {plural noun}. Her favorite color is {color}.\n\n\"We first noticed when she {past tense verb} on the wall of her barn,\" said zookeeper Mr. Tran. \"So we gave her real paper. Now she paints {adverb} for hours and only stops for {food}.\"\n\nPenny's paintings hang in the Zoo Cafe, right next to the {noun} machine. Her most famous one shows a giraffe holding a {noun}. People line up to {verb} in front of it.\n\nNext week, Penny will teach an art class for the monkeys. So far the monkeys are mostly {verb ending in ing} and eating the {plural noun}. Penny says they are doing a {adjective} job.\n\nThat is all for Zoo News. Stay {adjective}, zoo fans!"}, {"id": "at-the-zoo-07", "theme": "At the Zoo", "title": "A Day in the Life of a Zookeeper", "text": "6:00 in the morning: My alarm went off. I put on my zoo shirt and my lucky {adjective} boots.\n7:00: Breakfast for the animals! The giraffes got leaves, the bears got berries, and the parrots got {plural noun}.\n\n9:00: The baby elephant would not get out of the pool. I asked her nicely to {verb}, but she {past tense verb} and splashed me instead.\n12:00: Lunch! I ate with the penguins. One of them always tries to take my {noun}.\n\n3:00: The kangaroos had a hopping contest. The winner hopped {number} times and won a {adjective} ribbon.\n4:00: I gave the hippo a bath with soap and a {noun}. She said thank you {adverb}.\n5:00: The lions were {verb ending in ing}, the monkeys were telling jokes, and the sloth was still eating breakfast.\n\n8:00 at night: I fell asleep {adverb} and dreamed about {plural noun}."}, {"id": "at-the-zoo-08", "theme": "At the Zoo", "title": "Lunch for the Hungry Hippo", "text": "Hector the Hippo is always hungry. Here is how the zookeepers make his favorite lunch.\n\nYou will need one giant watermelon, a wheelbarrow of lettuce, and {number} {plural noun}. You will also need a very {adjective} spoon.\n\nFirst, cut the watermelon into slices as big as a {noun}. Next, mix the lettuce with a scoop of {food}. Stir it {adverb} until it looks like a salad. Then add a handful of {plural noun} and one {adjective} pickle.\n\nNow for the best part. Carry the lunch to the pool and call, \"Hector, it is time to {verb}!\" He will swim over {verb ending in ing} with joy.\n\nLast Tuesday, when Hector finished his lunch, he {past tense verb} and fell asleep in the sun. Next week the zookeepers will try adding a {noun}. Hippos are very {adjective} eaters."}, {"id": "at-the-zoo-09", "theme": "At the Zoo", "title": "Meet the Zoo's Oldest Tortoise", "text": "This week, the Zoo Kids Club talked with Grandpa Shell, the oldest tortoise at our zoo. He is {number} years old.\n\nKids Club: What was the zoo like when you were young?\nGrandpa Shell: Very {adjective}. The monkeys wore hats, and the giraffes played {plural noun} every afternoon.\n\nKids Club: What is your secret to staying happy?\nGrandpa Shell: Eat your greens, take naps, and never {verb} after dinner. I also keep a {noun} under my shell for luck.\n\nKids Club: Who is your best friend?\nGrandpa Shell: A {adjective} flamingo named Rosie. Every morning we go {verb ending in ing} together. She is much faster than me, but she waits {adverb}.\n\nKids Club: What do you do on your birthday?\nGrandpa Shell: The zookeepers bring me a cake made of {plural noun} and {food}. Last year I {past tense verb} so hard that my shell wiggled.\n\nKids Club: Thank you, Grandpa Shell!\nGrandpa Shell: You are welcome. Now please let me get back to {verb ending in ing} with my {noun}."}, {"id": "at-the-zoo-10", "theme": "At the Zoo", "title": "A Thank-You Note from the Panda", "text": "Dear Visitors,\n\nMy name is Bao, and I am the panda who lives next to the gift shop. Thank you for visiting me this summer.\n\nThank you to the girl who waved at me with her {body part}. It made me feel very {adjective}. Thank you to the boy who sang me a song about {plural noun}. I liked it so much that I {past tense verb} all afternoon.\n\nI know some of you wanted to see me {verb ending in ing}, but I was usually asleep. Next time, I will try to {verb} for you.\n\nMy favorite snack is still bamboo, but this summer I also tried a {noun}. It was {adjective}. The zookeeper says I chew {adverb}.\n\nPlease come back soon and bring {number} {plural noun}.\n\nYour friend,\nBao\nP.S. I will be sitting on my {adjective} rock
