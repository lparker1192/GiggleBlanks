hing that starts with the letter B. Theo brought a {adjective} {noun}. We are still not sure how it fit in his backpack. On Wednesday we planted seeds in paper cups. Our plants are growing {adverb}. One already has {number} tiny {plural noun} on it. We named it Gary.\n\nNext week, please send your child with a water bottle, a {color} jacket, and a {noun}. We will learn how to {verb} like real scientists. Our reading corner also needs pillows. If you have any old {plural noun} at home, we would love them.\n\nThank you for all you do. Your children make me laugh every day, especially when they are {verb ending in ing} at snack time.\n\nWith {adjective} wishes,\nMs. Plum\n\nP.S. This morning, Gary the plant {past tense verb} all by himself!"}, {"id": "school-days-04", "theme": "School Days", "title": "Report Card for Benny Brooks", "text": "Student: Benny Brooks\nGrade: Second\nTeacher: Mrs. Huckleberry\n\nReading: Benny reads {adverb} and with great feeling. His favorite book is about a {adjective} {noun} who learns to share. Math: Benny can count {number} {plural noun} in one minute flat. This term he learned to add and to {verb}. He likes math best at snack time.\n\nScience: Benny {past tense verb} during our volcano lesson and asked very good questions. He is curious about {plural noun} and where they come from. Art: Benny painted a picture of his dog. It was {color} and had wings. It is now hanging in the hallway.\n\nKindness: Benny always helps his friends. Last week he found a lost {noun} on the playground and gave it to the office.\n\nComments: It has been a {adjective} year. Keep {verb ending in ing}, Benny!"}, {"id": "school-days-05", "theme": "School Days", "title": "Rules for Show and Tell", "text": "Show and Tell is every Friday in Room 7. Please follow these rules so everyone gets a turn.\n\nRule one: You may bring one thing from home. It must fit inside a {noun}. Last year someone brought a {animal}, and that was too much. Rule two: Hold your item up high and talk {adverb}. Tell three facts about it. Rule three: Do not bring anything that might {verb} during class. This includes alarm clocks and {plural noun}.\n\nRule four: Listeners must sit on the rug with crossed legs and {adjective} hands. You may ask one question, like \"Does it have a {noun}?\" Rule five: If your item starts {verb ending in ing}, please put it back in your backpack. Rule six: Clap {adverb} at the end of every turn.\n\nNext Friday, Mr. Fox will bring his {adjective} collection of {plural noun}. Please do not touch them. They are very {adjective}."}, {"id": "school-days-06", "theme": "School Days", "title": "Dear Diary, Second Grade Is Here", "text": "Dear Diary,\n\nToday was my first day of second grade. I wore my new shoes and my {adjective} backpack. Mom packed me a sandwich, an apple, and a little bag of {plural noun}. My teacher is Mr. Ramos. He has a mustache shaped like a {noun} and a big plant named Steve. He taught us how to {verb} quietly when the bell rings.\n\nAt recess, my friend June and I ran around the slide {number} times. Then we sat on the grass and {past tense verb} until the whistle blew. After lunch we read a story about a {adjective} {animal} who wanted to go to school. Steve the plant listened {adverb}.\n\nWhen I got home, I told Dad everything. He said, \"That sounds {adjective}!\" Tomorrow I will bring my lucky {noun} and a snack for Steve. I think he likes {plural noun}."}, {"id": "school-days-07", "theme": "School Days", "title": "Our Classroom Job Chart", "text": "Every Monday, Miss Kwan changes the job chart in Room 3. Here are the jobs for this week.\n\nLine Leader: Leads the class down the hall. Must walk {adverb} and must not {verb} near the art room. Plant Helper: Waters our fern every morning. Our fern is very {adjective} and likes to hear stories about {plural noun}. Pencil Captain: Sharpens the pencils. Last week the sharpener made a sound like a {animal}, so please be gentle.\n\nDoor Holder: Says \"Good morning\" to every {noun} that walks by. Fish Feeder: Gives our goldfish, Bubbles, {number} flakes of food. Bubbles gets {adjective} if he has too many. Calendar Keeper: Tells the class the date, the weather, and one fun fact about {plural noun}. Quiet Captain: Reminds everyone to stop {verb ending in ing} during reading time. Snack Helper: Passes out crackers and {plural noun}. Please wash your {body part} first.\n\nMiss Kwan has the best job of all. She is the Head {noun}."}, {"id": "school-days-08", "theme": "School Days", "title": "Picture Day Instructions", "text": "Picture Day is this Thursday! Here is how to get ready.\n\nPlease wear your nicest shirt. Last year, one student wore a shirt covered in {plural noun}, and it looked great. Comb your hair the night before. If your hair is very {adjective}, you may bring a comb, a brush, or a small {noun}.\n\nWhen it is your turn, sit on the {adjective} stool and look at the camera. The photographer, Mr. Snap, will say \"Say {silly word}!\" Then he will ask you to smile {adverb}. Do not {verb} while the camera is flashing. Mr. Snap says the best pictures happen when you are calm and still, like a {adjective} {animal}.\n\nAfter your picture, you will get a sticker shaped like a {noun}. Please walk back to class {adverb}. Your family will get the pictures in {number} weeks. Then they will go on the fridge, where everyone can see you {verb ending in ing}."}, {"id": "school-days-09", "theme": "School Days", "title": "Notes for the Substitute Teacher", "text": "Dear Substitute,\n\nThank you for teaching Room 9 today. Here are a few things you should know. We start every morning with a song about {plural noun}. The class knows all the words. They will sing it {adverb}, so you may want to cover your ears.\n\nAt ten o'clock, we have snack time. Lily likes to bring her own {food}. Please do not let anyone {verb} on the snack table. Our class hamster, Biscuit, is very {adjective}. If he starts {verb ending in ing}, just give him a {noun} and he will calm down. During reading time, Oliver likes to read under the {noun}. That is fine.\n\nThe class will tell you that I always let them {verb} on Fridays. This is not true.\n\nHave a {adjective} day! I will be back tomorrow with {number} new {plural noun} for the science table.\n\nKind regards,\nMrs. Delgado\n\nP.S. Biscuit goes to bed at {number} o'clock."}, {"id": "school-days-10", "theme": "School Days", "title": "My Science Fair Project", "text": "My name is Ava, and this is my science fair project.\n\nMy question was: What happens if you put a {noun} in a glass of water? I wanted to find out because my brother said it would {verb}. First, I gathered my supplies. I used one glass, some water, a spoon, and {number} {plural noun}. I wore goggles to look like a real scientist.\n\nNext, I dropped it in and watched {adverb}. At first nothing happened. Then it {past tense verb} and turned {color}. My dad said, \"Wow, that is {adjective}!\" I did the test three more times. Every time, it smelled a little bit like {food}.\n\nMy conclusion is that water is very {adjective}. Next year I want to test what happens to {plural noun} when you sing to them. Thank you for {verb ending in ing} at my project!"}, {"id": "field-trip-01", "theme": "Field Trip", "title": "Permission Slip for the Apple Orchard", "text": "Dear Families,\n\nOn Friday, our class will visit Happy Hills Apple Orchard. We will leave at nine o'clock and come back before lunch. Students will pick apples, pet a {adjective} goat, and ride on a wagon pulled by a {noun}. The farmer will teach us how to {verb} like a real apple picker.\n\nPlease send your child with a sack lunch, a water bottle, and {number} {plural noun}. Students should wear comfy shoes. Last year someone wore {plural noun}, and they got very muddy. We need three grown-up helpers. Helpers must be able to walk {adverb}, count to twenty, and carry a {adjective} basket.\n\nPlease sign below and return this slip by Wednesday.\n\nMy child may go on the field trip. I promise to pack something {adjective} for lunch. I will remind my child not to {verb} on the bus.\n\nGrown-up signature: {name}\nFavorite kind of apple: {color} and {adjective}"}, {"id": "field-trip-02", "theme": "Field Trip", "title": "What to Pack for the Aquarium", "text": "Our class is going to the City Aquarium on Tuesday! Here is your packing list.\n\nA lunch box with a sandwich, a juice box, and a small bag of {plural noun}. A raincoat, because the dolphins like to {verb} at the front row. A notebook for drawing your favorite {noun}. A {adjective} hat so your teacher can find you. One stuffed {animal} for the bus ride. Only one, please. The bus is very full.\n\nThings NOT to pack: fishing poles, buckets, or {plural noun}. The sea turtles get {adjective} when they see those. Also, please leave your {noun} at home. The octopus always tries to borrow one.\n\nWe will walk {adverb} through the glass tunnel where fish swim over your head. Hold your buddy's {body part} and keep {verb ending in ing}. Our bus leaves at {number} o'clock sharp. Please do not be {adjective}!"}, {"id": "field-trip-03", "theme": "Field Trip", "title": "Bus Rules for Field Trip Day", "text": "Welcome aboard Bus Number 4! My name is Miss Dot, and I will be your driver today. Please listen to these rules.\n\nRule one: Stay in your seat. The seats are soft and {adjective}, so this should be easy. Rule two: Use your inside voice. If you must sing, please sing {adverb}. Songs about {plural noun} are allowed. Rule three: Keep your hands and your {body part} inside the bus at all times.\n\nRule four: Do not {verb} in the aisle. The aisle is only for walking and for my lunch {noun}. Rule five: If you see a {animal} out the window, you may wave. Last week we saw one, and it {past tense verb} back. Rule six: No {verb ending in ing} until we get to the museum. Rule seven: Snacks stay in your bag. That means crackers, apples, and especially {plural noun}.\n\nIf everyone follows the rules, we will play my favorite game: Spot the {adjective} {noun}. Everyone who plays gets a {color} sticker!"}, {"id": "field-trip-04", "theme": "Field Trip", "title": "Dear Diary, We Went to the Farm", "text": "Dear Diary,\n\nToday our class went to Sunny Acres Farm. The bus ride took {number} minutes. First we saw a big red barn. Inside, a cow named Daisy was eating {plural noun}. The farmer said Daisy is the most {adjective} cow in the whole state.\n\nThen we got to milk a goat. I was nervous, but I did it {adverb}. The goat looked at me and {past tense verb}. I think that means she liked me. After lunch we went on a hayride and sang songs about {plural noun}. My friend Priya found a feather that looked just like a {noun}. The farmer said, \"Please do not {verb} near the pigs.\"\n\nAt the gift shop, I bought a {adjective} pencil for my little brother. The farmer gave everyone a jar of {adjective} honey. On the way home, everyone fell asleep except our teacher. She was still {verb ending in ing}. Tomorrow I will ask Mom if we can keep a {animal} in the {noun}."}, {"id": "field-trip-05", "theme": "Field Trip", "title": "Postcard from the Science Museum", "text": "Dear Grandpa,\n\nGreetings from the Science Museum! I am writing this postcard on the bus. The first room had a giant model of a {noun}. It was as tall as a {animal}! A man in a white coat showed us how to make it {verb}. Next was the dinosaur room. The sign said this dinosaur liked to eat {plural noun} and nap in the sun. It must have been very {adjective}.\n\nMy favorite part was the bubble room. I made a bubble so big that my whole {body part} fit inside. My teacher {past tense verb} when she saw it. In the space room, you can push a button and hear what {plural noun} sound like on Mars.\n\nI got you a {adjective} magnet at the gift shop. It is shaped like a {noun} and says \"{silly word}\" on it. I will tell you everything very {adverb}.\n\nLove,\nRosie\n\nP.S. Please tell Grandma I learned how to {verb}!"}, {"id": "field-trip-06", "theme": "Field Trip", "title": "Welcome to the Town History Museum", "text": "Hello, students, and welcome to the Town History Museum! My name is Mr. Pickett, and I will be your tour guide. Please stay with your group and walk {adverb}.\n\nIn this first room, you can see an old wagon. People used wagons to carry flour, wood, and {plural noun} into town. This one was pulled by a {adjective} horse named Clover. Over here is a schoolroom from long ago. Children wrote on tiny chalkboards and learned how to {verb}. Good students got a {noun} to take home. Please do not {verb} on the old desks.\n\nThis glass case holds the town's first mail bag. Inside, we found a letter that said, \"Dear Mabel, please send more {plural noun}.\" And here is the giant clock. Every hour, a little wooden {animal} pops out and starts {verb ending in ing}. Last week, it {past tense verb} for a whole hour.\n\nToday everything in the gift shop costs {number} pennies. Please wipe your {plural noun} on the way out. Thank you for being such {adjective} visitors!"}, {"id": "field-trip-07", "theme": "Field Trip", "title": "Thank You, Zookeeper Jo", "text": "Dear Zookeeper Jo,\n\nThank you for showing our class around the zoo last week. We had a {adjective} time. Our favorite part was watching the giraffes eat breakfast. We did not know that giraffes like {plural noun} so much. When you fed them, they {past tense verb} with joy. Thank you for letting us touch the turtle's shell. It felt bumpy and {adjective}, like a {noun}.\n\nWe also loved the penguins. They walk {adverb} and look like they are wearing tiny {plural noun}. Some of us tried to {verb} like penguins all the way back to the bus. Our teacher said that was very {adjective}.\n\nWhen we visit in the spring, we will bring you some {food} as a thank-you gift. We hope the lion is still {verb ending in ing} when we get there.\n\nFrom,\nRoom 14\n\nP.S. Benji wants to know if the zoo has a {silly word} and a {animal}."}, {"id": "field-trip-08", "theme": "Field Trip", "title": "Our Day at the Fire Station", "text": "Here is our schedule for the field trip to Fire Station 5.\n\n8:30: Get on the bus. Find your buddy and sit {adverb}. 9:00: Arrive at the fire station. Firefighter Lopez will meet us with her dog, Sparky. Sparky is very {adjective} and loves to be patted. Last year, Sparky {past tense verb} on the fire truck all day. 9:15: Tour the fire truck. The truck has ladders, hoses, and a special box full of {plural noun}. We will all get to ring the bell {number} times.\n\n10:00: Firefighter Lopez will teach us how to {verb} like a firefighter. 10:30: Try on a real helmet. It is heavy and smells a little bit like {food}. 11:00: Snack time in the kitchen. Today the firefighters are making {adjective} pancakes with {plural noun} on top.\n\n11:30: Say goodbye. Each student will get a {color} sticker and a picture of a {noun}. Sparky will wave goodbye with his {body part}. 12:00: Ride back to school. Please keep {verb ending in ing} quietly in your seat."}, {"id": "field-trip-09", "theme": "Field Trip", "title": "Instructions for Field Trip Helpers", "text": "Thank you for helping on our trip to the Children's Garden! Here is what every grown-up helper should know.\n\nYou will be in charge of {number} students. Please count them every time you walk through a gate. They will try to {verb}, but stay calm. Your group is called the {adjective} {plural noun}. Please cheer your group name loudly at lunch.\n\nRemind students to smell the flowers {adverb} and not to pick them. The roses are very {adjective} this time of year. The ducks in the pond are friendly, but they really like {plural noun}. If a duck follows you, just keep walking and smile. Never feed the ducks after {number} o'clock.\n\nAt noon, we will meet under the big {noun} for lunch. You may sit on a blanket or on a {noun}. If a child asks a question you cannot answer, just say, \"Let's ask the {adjective} gardener!\" Everyone must wash their {body part} before snack time.\n\nThank you for {verb ending in ing} with us today!"}, {"id": "field-trip-10", "theme": "Field Trip", "title": "Kid News Visits the Bakery", "text": "This is Channel 2 Kid News with a special report.\n\nToday, Mrs. Hart's second grade class took a field trip to Sugar Moon Bakery. The baker, Mr. Flores, was already {verb ending in ing} when the class arrived. First, the students washed their {plural noun} and put on paper hats. Then they learned how to {verb} like real bakers. Mr. Flores says the trick is to push the dough {adverb} and sing to it.\n\nNext, the class made cupcakes. Each student added sprinkles and one {adjective} {noun} on top. Mr. Flores said it was the most {adjective} batch he had ever seen. Then the big oven beeped. Out came {number} loaves of bread shaped like {plural noun}. The whole class {past tense verb} and clapped.\n\nEvery student went home with a cookie and a recipe for {food} muffins. Next year, the class hopes to visit a {noun} factory. Back to you in the studio, {name}!"}, {"id": "sports-day-01", "theme": "Sports Day", "title": "Coach Lou's Big Pep Talk", "text": "All right, team, gather around! Bring it in close.\n\nToday is Sports Day, and I am so proud of you already. You ran laps, you stretched your {plural noun}, and you learned how to {verb} like champions. Keep your eyes on the ball and your feet on the {noun}. If you feel nervous, take a deep breath and think about {plural noun}.\n\nThe other team is very good too. Their coach says they eat {food} for breakfast every morning. That is fine. We have something even better. We have heart, and we have {adjective} socks. When you get out there, play {adverb}. Pass the ball, cheer for your friends, and if you hear me yell \"{exclamation}!\" that means run. Do not stop to {verb}.\n\nWin or lose, we are going out for {adjective} pizza after the game. I will bring {number} juice boxes. Now put your hands in. On three, everybody shout \"Go, {adjective} {plural noun}!\""}, {"id": "sports-day-02", "theme": "Sports Day", "title": "Live from the Sack Race", "text": "Hello, sports fans, and welcome to the big sack race at Oak Park Elementary! I am Ted, and here with me is my partner, Jill.\n\nThanks, Ted. What a {adjective} day for a race. The racers are climbing into their {plural noun}. The whistle blows! And they are off! Look at Mia in lane {number}. She is hopping {adverb}, Ted!\n\nYes, Jill, and look at Sam in lane three. He is not hopping at all. He is {verb ending in ing}. I have never seen that in a sack race before. The crowd is cheering {adverb}. Someone in the stands is waving a giant {noun}. And here comes the school {animal} onto the track!\n\nMia {past tense verb} across the finish line first, and Sam is right behind her. Everyone made it! All the racers will get a {color} ribbon and a cup of {food}. Coach Pat says it was the most {adjective} race in school history.\n\nThat is all from the sack race. Next up is the {adjective} relay. Do not {verb} away, folks!"}, {"id": "sports-day-03", "theme": "Sports Day", "title": "Sports Day Schedule at Willow Creek", "text": "Welcome to Sports Day at Willow Creek School! Here is the plan for today.\n\n9:00: Opening parade. Each class will march around the field holding a sign shaped like a {noun}. The kindergarten class will lead the way, walking very {adverb}. 9:30: Warm-ups with Coach Bea. We will touch our toes, shake our {plural noun}, and do {number} jumping jacks. 10:00: The three-legged race. Partners will tie their legs together and try to {verb} to the finish line.\n\n10:45: Water break. Lemonade and {adjective} orange slices will be on the snack table. 11:00: The water balloon toss. Last year, Mr. Grant's balloon {past tense verb} right on his hat. He said it felt {adjective}. 11:30: Parents and teachers tug-of-war. The teachers have been practicing by pulling {plural noun} across the gym.\n\n12:00: Picnic lunch on the grass. Bring a blanket, a {adjective} hat, and some {food}. Please do not feed your lunch to the {animal}. 12:30: Everyone gets a medal for {verb ending in ing}!"}, {"id": "sports-day-04", "theme": "Sports Day", "title": "Official Rules of the Egg and Spoon Race", "text": "Welcome to the egg and spoon race! Please read these rules.\n\nRule one: Each racer gets one spoon and one egg. The eggs are boiled, so they will not break. You may name your egg Eggbert or {silly word}. Rule two: Hold the spoon in your hand, not in your {body part}. You may hold it {adverb}, but you may not use glue, tape, or {plural noun}. Rule three: When the whistle blows, walk to the big {adjective} cone and back. You may not run. You may not {verb}. You may only walk, like a {animal}.\n\nRule four: If your egg falls, that is okay! Put it back on your spoon and keep {verb ending in ing}. Rule five: Cheer for every egg. A good cheer goes like this: \"Go, egg, go! You are a {adjective} {noun}!\"\n\nRule six: Every racer gets a sticker and a {noun}. The winner gets to {verb} first in the lunch line. Afterward, the eggs will become {food} sandwiches. Remember, the most important thing is to be {adjective}."}, {"id": "sports-day-05", "theme": "Sports Day", "title": "Dear Diary, Field Day Was Great", "text": "Dear Diary,\n\nToday was Field Day, the best day of the whole year. I wore my team shirt, which is bright {color} and has a {noun} on the front. First was the hula hoop contest. I kept my hoop spinning for {number} seconds. My friend Leo kept his hoop going while he {past tense verb} at the same time. Everybody clapped {adverb}.\n\nNext was the obstacle course. We had to crawl under a net, hop through tires, and {verb} over a pile of {plural noun}. I went as fast as a {animal} and made it to the end. At lunch, Mom brought a cooler full of {adjective} snacks, like grapes and {plural noun}. Then we watched the teachers race. Mr. Kim ran so fast his whistle started {verb ending in ing}.\n\nAt the end of the day, everyone got a ribbon. Mine says \"Most {adjective} Hopper.\" I am going to hang it above my bed next to my {noun}."}, {"id": "sports-day-06", "theme": "Sports Day", "title": "How to Do the Blue Team Cheer", "text": "Welcome to the Blue Team! Our cheer is the best. Here is how to do it.\n\nStep one: Stand in a line with your teammates. Put your hands on your hips and look very {adjective}. Step two: Stomp your feet {number} times, like a herd of {plural noun}. Step three: Clap your hands over your head and shout, \"We are Blue, we are true, we can {verb} and so can you!\"\n\nStep four: Spin around once, then hold on to your {noun}. Step five: Wiggle your {body part} and say \"{silly word}\" as {adverb} as you can. Step six: Jump up high and pretend you are a {adjective} rocket. Step seven: Give a high five to the person next to you and say, \"Nice {verb ending in ing}!\" Step eight: Take a bow and toss a few {plural noun} into the air.\n\nCoach Mae says if we do our cheer every morning, we will feel {adjective} all day long. Last year, the Red Team {past tense verb} when they heard it."}, {"id": "sports-day-07", "theme": "Sports Day", "title": "The Sports Day Awards", "text": "Good afternoon, families! Thank you for coming to the Sports Day Awards. Every student worked hard today, so every student gets an award and a {adjective} ribbon.\n\nThe Super Sprinter Award goes to Jada, who ran so {adverb} that her shoelaces came untied. The Best Teammate Award goes to Marco, who cheered for everyone and shared his {plural noun} with the whole class. The Golden Spoon Award goes to Ellie. She carried her egg all the way to the finish line on a {noun}.\n\nThe Big Jump Award goes to Omar. He jumped {number} feet and landed like a {adjective} {animal}. The Sunshine Award goes to Ms. Wu, who stood at the finish line all day {verb ending in ing}. The Silly Hat Award goes to Principal Green. His hat had {plural noun} glued all over it, and it {past tense verb} every time he moved.\n\nThank you all for a {adjective} day. Next year, we will add a new event: the {adjective} {noun} relay. Please practice at home!"}, {"id": "sports-day-08", "theme": "Sports Day", "title": "Snack Table Sign-Up Sheet", "text": "Hello, Sports Day families! We need your help with the snack table. Please write your name next to one item.\n\nWater bottles: Please bring {number} bottles. Athletes get very thirsty after {verb ending in ing} all morning. Orange slices: Coach Dan likes them {adjective} and cold. Granola bars: Any kind is fine, as long as there are no {plural noun} inside. Sunscreen: Mr. Tate puts it on his nose, his ears, and his {body part}.\n\nNapkins: We need lots of napkins. The kindergarten class likes to {verb} with them. Fruit cups: Last year someone brought a fruit cup shaped like a {noun}, and it was a big hit. Paper plates: Please bring the {adjective} kind. Extra treat: One lucky family can bring a surprise. Last year it was a giant bowl of {food}, and the students {past tense verb} {adverb}.\n\nThank you so much! Please drop off your snacks next to the {noun}. The snack table is the most {adjective} part of the day."}, {"id": "sports-day-09", "theme": "Sports Day", "title": "Please Pick Me for Team Mascot", "text": "Dear Coach Rivera,\n\nMy name is Nora. I want to be the Green Team mascot on Sports Day. I would be a great mascot because I am {adjective}. I can cheer loudly, dance {adverb}, and do a cartwheel almost every time.\n\nMy costume is a giant {animal} suit that my grandma made. It has a long tail and {number} fuzzy {plural noun} on the back. It is a little bit smelly, but only on hot days.\n\nAs the mascot, I will run up and down the field and help the team {verb}. When our team scores, I will do my special dance, called the {silly word}. When the other team scores, I will clap for them too. I have been practicing my mascot noises. My best one sounds like a {adjective} {noun} {verb ending in ing}.\n\nI promise to be {adjective} and to never take off my {noun} during the game.\n\nYour friend,\nNora\n\nP.S. I {past tense verb} all the way to school today, just for practice."}, {"id": "sports-day-10", "theme": "Sports Day", "title": "Tug-of-War Ends in a Tie", "text": "This is Ruby Wells with the Sports Day news.\n\nToday at Elm Street School, the tug-of-war between the Red Team and the Yellow Team ended in a tie for the first time in {number} years. Both teams grabbed the rope and pulled {adverb}. The crowd cheered so loudly that a {noun} fell off the bleachers.\n\nFor ten whole minutes, nobody moved. The Red Team pulled. The Yellow Team pulled. A {adjective} squirrel sat in the middle of the field and ate {plural noun}. Then both teams started {verb ending in ing} at the same time. They laughed so hard they all sat down on the {adjective} grass.\n\nThe referee, Mr. Ito, {past tense verb} and blew his whistle. He said it was the most {adjective} match he had ever seen. After the game, both teams shared a big bowl of {plural noun} and promised to {verb} again next year. Mr. Ito says he will bring a longer rope and a {noun}.\n\nReporting live, this is Ruby Wells. Back to you, {name}."}, {"id": "birthday-party-01", "theme": "Birthday Party", "title": "You Are Invited to Max's Party", "text": "Dear Friends,\nYou are invited to Max's seventh birthday party! It will be on Saturday at {number} o'clock in our backyard. Please wear something {adjective}, like a party hat or a pair of {plural noun}.\n\nFirst we will play Pin the Tail on the {animal}. Then everyone will get a turn to {verb} in the bounce house. Max's dad will be {verb ending in ing} by the grill all afternoon, so come hungry!\n\nFor lunch we will have pizza, apple slices, and a giant bowl of {plural noun}. The cake is shaped like a {noun} and has {color} frosting. After cake, Grandpa will play music, and we will all dance {adverb}.\n\nPlease do not bring a present that is too {adjective}. Max already has lots of toys. Just bring a big smile and a {adjective} {noun}!\nLove,\nMax's Mom"}, {"id": "birthday-party-02", "theme": "Birthday Party", "title": "Thank You, Aunt Rosa", "text": "Dear Aunt Rosa,\nThank you for the birthday present! When I opened the box, I found a {adjective} {noun} inside. I have always wanted one. Mom says it is the most {adjective} gift I have ever gotten.\n\nI use it every day, and I keep it under my {noun} at night. On Monday, I showed it to my teacher, Mrs. Green. She {past tense verb} so hard that she had to sit down. On Tuesday, my little brother tried to {verb} with it. Now it smells a little bit like {food}.\n\nThank you also for the card with {number} dollars in it. I am saving it to buy a pet {animal}, a box of crayons, and two {plural noun}.\n\nPlease come to my next party. We will eat cake, wear {adjective} hats, and dance {adverb} in the kitchen. Please bring your {plural noun}!\nLove,\nSofia"}, {"id": "birthday-party-03", "theme": "Birthday Party", "title": "Grandma's Famous Birthday Cake", "text": "This is how my grandma makes my birthday cake every year. You will need a big bowl, a wooden spoon, and a {adjective} grown-up.\n\nFirst, mix two cups of flour with three {plural noun}. Stir it {adverb} until it looks {adjective}. Next, crack two eggs and add a spoonful of {food}. That is the secret part, so do not tell anyone.\n\nPour everything into a pan shaped like a {noun}. Bake it for {number} minutes. While you wait, you can {verb} around the kitchen and sing to the oven. Grandma says the cake likes songs about {plural noun}.\n\nWhen the cake is cool, cover it with {adjective} frosting and put a tiny {noun} on top. Add the candles and turn off the lights. Everyone will start {verb ending in ing}. Grandpa always takes the first bite and says, \"This tastes like {plural noun}!\""}, {"id": "birthday-party-04", "theme": "Birthday Party", "title": "Rules for the Bounce House", "text": "Welcome to the bounce house! Please read these rules before you go in. Unc were seen {verb ending in ing} all over the grass. One {animal} was seen wearing a party hat.\n\nRight now, Rosie's dad is asking everyone to {verb} before the ice cream melts. Today's flavor is {food}. Experts say it is the most {adjective} party of the year. Back to you in the studio, {name}!"}, {"id": "birthday-party-09", "theme": "Birthday Party", "title": "What Is in Your Party Bag", "text": "Thank you for coming to Nora's birthday party! Here is what is inside your party bag.\n\nOne bouncy ball. Please do not bounce it inside, or your grown-up might get {adjective}. Two stickers shaped like {plural noun}. Put them on your notebook or your {noun}. Three pieces of candy. Nora says the {color} ones taste like {food}.\n\nOne tiny jar of bubbles. Dip the wand and blow {adverb}. If you blow too hard, you will just {verb} instead. One {adjective} pencil with a {noun} on the end.\n\nOne paper crown. Wear it at dinner and tell everyone you are the king or queen of {place}. One small surprise at the very bottom. Nora says it might be {verb ending in ing} when you open the bag.\n\nThank you for being such a {adjective} guest. See you next year, and please bring your {plural noun}!"}, {"id": "birthday-party-10", "theme": "Birthday Party", "title": "Dad's Party Checklist", "text": "Dad made a checklist for my birthday party. He wrote it with a {color} marker and hung it on the fridge with a magnet shaped like a {noun}.\n\nFirst, he will blow up {number} balloons and tie them to the mailbox. Then he will hang a sign that says Happy Birthday in {adjective} letters. Mom says last year's sign was a little too {adjective}.\n\nNext, he will set up the snack table. It will have juice boxes, cheese crackers, and a tall stack of {plural noun}. He will also practice {verb ending in ing} so he can be the party clown. His clown nose is made of {food}.\n\nAt four o'clock, he will carry out the cake and sing {adverb}. Then he will {verb} with the kids in the yard and hand out {adjective y-03", "theme": "Snow Day", "title": "How to Build the Best Snowman", "text": "Building a snowman is easy if you follow these steps. Ask a {adjective} grown-up to help with the heavy parts.\n\nFirst, roll a big ball of snow for the bottom. Keep rolling until it is as big as a {noun}. Then make a middle ball and a small {adjective} head. Stack them up {adverb} so they do not fall over. Pat the snow smooth with your {body part}.\n\nNext, give your snowman a face. Use two {plural noun} for the eyes and a carrot for the nose. For the mouth, make a smile out of little {plural noun}. If you do not have any, you can use {food} instead.\n\nLast, dress him up. Wrap a {color} scarf around his neck and put an old {noun} on his head. Give him two sticks for arms so he can {verb} at the cars going by. Now step back and look. He is so {adjective}! If you listen closely, you might hear him {verb ending in ing}."}, {"id": "snow-day-04", "theme": "Snow Day", "title": "Grandpa's Snow Day Cocoa", "text": "On every snow day, Grandpa makes his famous hot cocoa. Here is his recipe.\n\nFirst, pour two cups of milk into a pot. Grandpa says to stir it {adverb}, or the milk gets {adjective}. Then add three spoonfuls of cocoa powder and one tiny pinch of {plural noun}. That is his secret.\n\nWhile it warms up, Grandpa likes to {verb} around the kitchen and hum a song about {plural noun}. He says it makes the cocoa taste {adjective}. Our cat, Pepper, sits on a {noun} and watches him {verb ending in ing}.\n\nWhen the cocoa is warm, pour it into your favorite mug. Add {number} marshmallows, plus a {noun} if you are feeling fancy. Drink it slowly while you look out at the {adjective} snow. After the first sip, Grandpa always closes his eyes and says, \"{exclamation}! That tastes like {food}!\""}, {"id": "snow-day-05", "theme": "Snow Day", "title": "My Snow Day Diary", "text": "Dear Diary,\nWhen I woke up today, everything outside was white! School was closed. I was so happy that I {past tense verb} all the way down the stairs.\n\nAfter breakfast, my brother and I put on our snow pants, boots, and {plural noun}. It took us {number} minutes. By the time we got outside, I was already a little bit {adjective}.\n\nFirst we made snow angels. Mine looked like a {adjective} {animal}. Then we had a snowball contest with our {adjective} neighbor, Mrs. Kim. She throws very {adverb}. Our dog, Muffin, was {verb ending in ing} in the yard. Then he jumped into a snow pile and came out looking like a {noun}.\n\nNow I am inside, drinking cocoa and watching the snow fall {adverb}. My cheeks are pink, and my toes feel like {plural noun}. I hope tomorrow is a snow day too, so I can {verb} all over again."}, {"id": "snow-day-06", "theme": "Snow Day", "title": "The Great Sled Race Results", "text": "Here are the official results of the Great Sled Race on Maple Hill. The judges were Mr. Lopez and his {adjective} cat. Mr. Lopez kept time with a {noun}.\n\nIn third place is Sam. Sam rode a red sled and shouted, \"{exclamation}!\" the whole way down. He wins a cup of cocoa and a {adjective} sticker.\n\nIn second place is Priya. She rode down the hill on a {noun} and finished in {number} seconds. The judges say she was very {adjective}. She wins a pair of fuzzy {plural noun}.\n\nIn first place is Grandma Bea! She rode her old wooden sled and went down {adverb}. At the bottom, she {past tense verb} and waved her {plural noun} at the crowd. She wins the golden trophy and a bag of {plural noun}. Next year, everyone wants to {verb} like Grandma Bea."}, {"id": "snow-day-07", "theme": "Snow Day", "title": "Rules for Our Snow Fort", "text": "My friends and I built a snow fort in my backyard. It has two rooms, a window, and a flag made from a {color} sock. Here are our rules.\n\nRule one: Say the secret word before coming in. This week, the secret word is \"{silly word}.\" Rule two: No more than {number} kids inside at once, or the walls start to wiggle.\n\nRule three: Please do not {verb} inside the fort. Last time, Theo did that, and the roof dripped on his {noun}. He {past tense verb} for an hour. Rule four: Snacks are allowed, but only crackers and {plural noun}. Crumbs make the floor {adjective}.\n\nRule five: Wipe your {plural noun} on the mat. Rule six: Be nice to our guard, a {adjective} snowman who is always {verb ending in ing}. Rule seven: When it is time to go inside, say goodbye to the fort {adverb}. Our fort is the most {adjective} place in the whole neighborhood!"}, {"id": "snow-day-08", "theme": "Snow Day", "title": "Dear Snow, Please Come Back", "text": "Dear Snow,\nThank you for coming to our town last week. You were very {adjective}, and you covered everything, even our mailbox and Dad's {noun}. We had the best time. Even the squirrels were {verb ending in ing}.\n\nMy sister and I made a snowman named Mr. Pebble. He had two {plural noun} for eyes and a big {adjective} smile. We also made {number} snow angels in a row. Mom hung a picture of them on the {noun}.\n\nNow you have melted, and the yard is just mud and {plural noun}. Mr. Pebble's scarf is still lying in the grass. I {past tense verb} a little when I saw it.\n\nPlease come back soon. If you do, I promise to {verb} with you all day and wear my {adjective} mittens. I will even leave a bowl of {food} on the porch for you. Please write back {adverb}.\nLove,\nOwen"}, {"id": "snow-day-09", "theme": "Snow Day", "title": "How to Get Ready for the Snow", "text": "Going out in the snow takes a lot of work. Mom wrote this list on the back of a {noun} so I do not forget anything.\n\nFirst, put on your warmest shirt and your {adjective} socks. Then pull on your snow pants. You may need to {verb} to get them all the way up. They make a {adjective} sound when you walk. Next, zip your coat all the way up to your {body part}.\n\nNow it is time for boots. Push your feet in {adverb}. If they will not go in, check for {plural noun} hiding inside. Last time, I found my brother's {noun} in there. Then put on your hat, your scarf, and your {plural noun}. By now you will look like a big {adjective} {noun}.\n\nLast of all, open the door and step outside. Take two steps in the snow and start {verb ending in ing}. Then Mom will knock on the window and say it is time to come in for {food}."}, {"id": "snow-day-10", "theme": "Snow Day", "title": "A Snowman Tells All", "text": "Today our school newspaper talked to Frosty Fred, the snowman who stands {adverb} in front of the library.\n\nWe asked Fred how he feels about snow days. \"I love them,\" he said. \"Kids give me {plural noun} and a new {noun} to wear. Yesterday, a girl named Kaya gave me a hug so {adjective} that I almost lost my nose. My arms are just sticks, but I am very good at {verb ending in ing}.\"\n\nWe asked Fred what he does at night. \"Mostly I stand here,\" he said {adverb}. \"Sometimes I watch the {plural noun} go by. When nobody is looking, I like to {verb} a little. Last night, I {past tense verb} until the sun came up.\"\n\nWe asked Fred for advice. \"Always wear {adjective} mittens,\" he said. \"Eat a warm bowl of {food} after playing outside. And please, never let the {animal} near my carrot nose.\" Thank you, Fred. Stay {adjective}!"}, {"id": "halloween-fun-01", "theme": "Halloween Fun", "title": "Come to Our Pumpkin Party", "text": "Dear Neighbors,\nYou are invited to our Halloween pumpkin party! It will be on Saturday afternoon in our garage, which Dad has decorated with orange lights and {plural noun}.\n\nPlease come wearing your most {adjective} costume. Last year Uncle Sal came dressed as a {noun}, and nobody knew who he was until he started {verb ending in ing}. There will be a prize for the best costume and a smaller prize for the most {adjective} one.\n\nWe will paint pumpkins, play pumpkin bowling, and bob for {plural noun}. Grandpa will play {adjective} music on his old radio. Mom is making cupcakes with {color} frosting and little {plural noun} on top. Our dog, Noodle, will be dressed as a {animal}, so please pet him {adverb}.\n\nAt six o'clock, everyone will go trick-or-treating together. Please bring a bag, a flashlight, and {number} friends. We can't wait to {verb} with you!\nLove,\nThe Garcia Family"}, {"id": "halloween-fun-02", "theme": "Halloween Fun", "title": "How to Decorate a Pumpkin", "text": "Decorating a pumpkin is one of the best parts of fall. All you need is paint, glue, and a {adjective} grown-up.\n\nFirst, pick the right pumpkin. Find one that is round, orange, and about the size of a {noun}. Wash it {adverb} and dry it with a towel.\n\nNext, paint a face. Give it two {adjective} eyes, a triangle nose, and a big smile full of {plural noun}. For eyebrows, use two {plural noun}. For a hat, glue a {food} on top.\n\nLast, put your pumpkin on the front porch next to the {noun}. When kids walk by, they will {verb} and point. My pumpkin last year looked so {adjective} that my neighbor {past tense verb} every time he walked past. This year, I am naming my pumpkin {name}. I hope it does not start {verb ending in ing} again."}, {"id": "halloween-fun-03", "theme": "Halloween Fun", "title": "The Costume Parade Winners", "text": "Thank you to everyone who marched in the Oak Street School Costume Parade! The judges had a very {adjective} job. Here are this year's winners.\n\nThe prize for Funniest Costume goes to Eli, who came dressed as a giant {noun}. He waddled down the hall {adverb} and waved at every class. He wins a pumpkin pencil and a bag of {plural noun}.\n\nThe prize for Most Creative goes to the Lee twins. They dressed up together as one {adjective} {animal} with four legs and two heads. The costume took {number} hours to make and smells a little bit like {plural noun}.\n\nThe prize for Best Teacher Costume goes to Mrs. Hart. She wore a cape made of {plural noun} and a hat shaped like a {noun}. When she won, she {past tense verb} right there in the gym. Next year, the judges hope everyone will {verb} in the parade. Have a {adjective} Halloween!"}, {"id": "halloween-fun-04", "theme": "Halloween Fun", "title": "Friendly Ghost Cookies", "text": "These cookies look like little ghosts, but they are very friendly and a little bit {adjective}. Ask a grown-up to help with the oven and the {plural noun}.\n\nFirst, mix one cup of sugar, two cups of flour, and a spoonful of {food} in a big bowl. Stir it {adverb} until there are no lumps. Roll the dough flat with a {noun} and cut out ghost shapes.\n\nBake the cookies for {number} minutes. While you wait, you can {verb} around the kitchen like a ghost. Say \"boo\" very quietly so the cookies do not get {adjective}.\n\nWhen the cookies are cool, cover them with white frosting. Use two chocolate chips for eyes and a tiny {noun} for the mouth. Some people add {plural noun} on top, too. If you are very quiet, you might hear your ghosts {verb ending in ing}. My little sister says they taste like {plural noun} and {adjective} dreams."}, {"id": "halloween-fun-05", "theme": "Halloween Fun", "title": "My Trick-or-Treat Night", "text": "Dear Diary,\nTonight was Halloween! I dressed up as a {adjective} {noun}. Mom took three days to make my costume, and it has {plural noun} glued all over it. It is hard to walk in, but I love it.\n\nAt six o'clock, Dad and I went trick-or-treating. Dad was dressed as a {adjective} pirate. The first house had a blow-up pumpkin wearing {plural noun}. The lady at the door said my costume was very {adjective}. She gave me two candies and a {noun}.\n\nAt the next house, a man was dressed as a friendly ghost. He {past tense verb} when he saw me, and then we both laughed. Then I saw my friend Zoe. She was dressed as a {animal} and was {verb ending in ing} down the sidewalk.\n\nAt home, I counted {number} pieces of candy. Mom let me pick two to eat {adverb}. Now I am in bed, still wearing my costume. Tomorrow I am going to wear it to breakfast and {verb} until Mom says stop."}, {"id": "halloween-fun-06", "theme": "Halloween Fun", "title": "Rules for Trick-or-Treating", "text": "Trick-or-treating is fun, but there are rules. My big sister Mae wrote these for me, and she says they are very {adjective}.\n\nRule one: Always walk with a grown-up and carry a {adjective} flashlight. Rule two: Only go to houses with the porch light on. If a pumpkin looks like a {noun}, they have the good candy.\n\nRule three: Say \"Trick or treat!\" in a {adjective} voice. Then say thank you {adverb} and wave your {body part}. Never take more than {number} pieces. Rule four: If a house gives out {plural noun} instead of candy, say thank you anyway.\n\nRule five: Do not eat anything until Mom checks it. You may {verb} while you wait. Then you can trade. Mae will trade one chocolate bar for three {plural noun}. Rule six: Hide your bag somewhere {adjective}. Last year, Dad found my bag while he was {verb ending in ing} in the closet. Next year, I am going to hide it inside a {noun}."}, {"id": "halloween-fun-07", "theme": "Halloween Fun", "title": "A Letter from Boo the Friendly Ghost", "text": "Dear Kids of Pine Street,\nMy name is Boo, and I am the friendly ghost who lives in the attic of the yellow house. I am very {adjective}, and I love to play. During the day, I sleep in an old box of {plural noun} under a {adjective} blanket.\n\nEvery Halloween, I float around and look at the costumes. Last year, I saw a boy dressed as a {noun}, a girl dressed as a giant {food}, and a baby dressed as a {adjective} {noun}. I {past tense verb} so hard that I floated into a tree.\n\nMy favorite things are pumpkins, warm socks, and {plural noun}. Candy falls through me, but I like to smell it. I also like to {verb} when the moon is out and sing {adverb} to the owls.\n\nThis year, I will sit on my porch. If you see me, please wave and say \"{silly word}.\" That means hello in ghost. I will wave back with my {adjective} little hands.\nYour friend,\nBoo"}, {"id": "halloween-fun-08", "theme": "Halloween Fun", "title": "Big News on Maple Lane", "text": "Good evening. This is Kip Moore with Halloween news from Maple Lane, where every house is decorated for the big night.\n\nAt the blue house, the Wilsons put up a giant blow-up {animal} that is taller than their roof. It has {number} glowing eyes and a hat made of {plural noun}. Neighbors say it is very {adjective}.\n\nNext door, Mr. Patel covered his porch in orange lights and {plural noun}. When kids ring his doorbell, a {adjective} song plays and a toy pumpkin starts {verb ending in ing}. Kids have been lining up to {verb} on his steps all day.\n\nAt the corner house, Mrs. Ruiz painted her pumpkins to look like {plural noun}. She waved {adverb} at our camera and gave us each a {noun}. Tonight, the whole street will turn on its lights at seven o'clock. Experts say it will be {adjective}. Back to you, {name}!"}, {"id": "halloween-fun-09", "theme": "Halloween Fun", "title": "The Official Candy Trading Guide", "text": "After trick-or-treating, my friends and I trade candy. Here is our official trading guide.\n\nOne lollipop is worth two little chocolate bars. One big chocolate bar is worth {number} lollipops. A box of raisins is worth one sticker and a {noun}. Raisins are my cousin Ava's favorite, so this is a {adjective} deal.\n\nIf you get something odd, like a toothbrush or a bag of {plural noun}, trade it to my dad. He will give you one penny and a {adjective} high five. He says he is {verb ending in ing} for a good cause.\n\nWhen trading, sit up straight and talk {adverb}. No grabbing, and no {verb ending in ing}. If two people want the same candy, they have to {verb} for it. Last year, Ava {past tense verb} for an hour to win a gummy worm. The winner gets the candy, and the other person gets a {adjective} hug. At the end, everyone puts their candy in a {color} bowl, and Mom says it is time to brush our {plural noun}."}, {"id": "halloween-fun-10", "theme": "Halloween Fun", "title": "Welcome to the Not-Scary House", "text": "Welcome to the Not-Scary House! My name is Ruby, and I will be your tour guide. Please stay with the group and keep your hands inside your {plural noun}.\n\nOur first stop is the front hall. Here you will see a friendly ghost made from an old bedsheet and two {plural noun}. His name is Gus, and he loves to {verb}. If you shake his hand, he might say something {adjective}.\n\nNext is the kitchen, where the cat is wearing a {adjective} hat. The bowl on the table is full of green slime made of {food} and jelly. Please do not touch it. My brother touched it last year, and his {body part} was sticky for {number} days.\n\nOur last stop is the living room, where the jack-o'-lanterns are {verb ending in ing} on the windowsill. Each one has a {adjective} face. Before you leave, take a {noun} from the basket by the door and say goodbye {adverb}. Come back next year, when we will have even more {plural noun}!"}, {"id": "camping-trip-01", "theme": "Camping Trip", "title": "Mom's Camping Packing List", "text": "Mom made a packing list for our camping trip. She taped it to the fridge with a {adjective} magnet.\n\n1. One tent. Last year we forgot the poles, so we slept under a {noun} instead.\n2. Three sleeping bags and a pillow shaped like a {animal}.\n3. Twelve {plural noun} for roasting over the campfire.\n4. Bug spray. Dad says mosquitoes love to {verb} {adverb} near his ears.\n5. A flashlight, in case the moon is too {adjective}.\n6. Grandpa's lucky {noun}. He has packed it since he was {number} years old.\n7. Snacks: granola bars, apples, and a jar of {food}.\n8. Extra socks, because last time Dad {past tense verb} right into the lake.\n\nAt the bottom, Dad added one more thing in big letters: DO NOT PACK THE {plural noun}. Mom says that is a long story about a canoe and a very {adjective} raccoon."}, {"id": "camping-trip-02", "theme": "Camping Trip", "title": "Ranger Bob's Campfire Rules", "text": "Welcome to Pine Cone Campground, home of the {adjective} chipmunk! Please read Ranger Bob's campfire rules before you sit down to {verb}.\n\nRule 1: Only grown-ups may light the fire. Kids may help by holding the {noun} and cheering {adverb}.\nRule 2: Sit on a log, not on a {noun}. We learned this the hard way.\nRule 3: Marshmallows should be golden brown. If yours turns {color}, please tell a ranger.\nRule 4: Campfire songs end at {number} o'clock. Our favorite is the song about the {adjective} moose.\nRule 5: Do not feed the fire any {plural noun}. It makes the smoke smell like {food}.\nRule 6: No {verb ending in ing} near the fire. Ranger Bob means it.\n\nAt the end of the night, a grown-up will pour water on the fire. Everyone must wave and tell the fire goodnight {adverb}. Ranger Bob says the fire gets very {adjective} if you forget."}, {"id": "camping-trip-03", "theme": "Camping Trip", "title": "Dear Diary, Night One", "text": "Dear Diary,\n\nToday we drove for {number} hours to get to Lake Wobble. My little brother sang a song about {plural noun} the whole way.\n\nDad set up the tent. It took forever because he kept {verb ending in ing} while he read the instructions upside down. Mom fixed it with a {noun} and some tape. Now our tent looks a little bit {adjective}, but it works.\n\nFor dinner we cooked hot dogs and a pot of {adjective} beans. Dad put {plural noun} in his. Then we roasted marshmallows. Mine got too hot, so I blew on it {adverb}, and it tasted like a {noun}.\n\nTonight I can hear frogs, crickets, and something that goes \"{sound}!\" Mom says it is just a {adjective} owl saying hello. My sleeping bag smells like {food}. Goodnight, Diary. Now I am going to {verb} until morning."}, {"id": "camping-trip-04", "theme": "Camping Trip", "title": "A Postcard from Camp Sunny Pines", "text": "Dear Grandma,\n\nGreetings from Camp Sunny Pines! The lake here is very {adjective}. The water is so cold that I {past tense verb} right out of it.\n\nYesterday we went on a nature hike. Our guide showed us a tree that is {number} years old and a rock shaped like a {noun}. I collected seven {plural noun} for you. They are safe in my {noun}.\n\nThis morning Dad tried to catch a fish. He waited {adverb} for two hours and caught a {noun} instead. He said it still counts. Mom {past tense verb} so hard that she dropped the camera.\n\nTomorrow we will {verb} in canoes. I will wear my life jacket on my {body part} and paddle like a {adjective} {animal}.\n\nLove, your favorite grandchild\n\nP.S. Please save me some {food}."}, {"id": "camping-trip-05", "theme": "Camping Trip", "title": "How to Set Up a Tent", "text": "Setting up a tent is easy. My dad wrote these steps after our last trip.\n\nStep 1: Find a flat spot with no rocks, sticks, or {plural noun} on it.\nStep 2: Unroll the tent. If a {animal} is already napping inside, choose a different spot.\nStep 3: Push the poles through the loops. This part goes better if you hum a {adjective} song.\nStep 4: Lift the tent up {adverb}. Ask a grown-up to hold the other side so it does not {verb}.\nStep 5: Push in the stakes. You should have {number} stakes, but one will always turn up in your {noun} later.\nStep 6: Put your sleeping bag, your {plural noun}, and your favorite {noun} inside.\nStep 7: Crawl in and shout \"{exclamation}!\" so the tent knows you are home.\n\nNow step back and admire your tent. It should look {adjective} and smell a little bit like {plural noun}. If it looks like a {noun} instead, go back to Step 1."}, {"id": "camping-trip-06", "theme": "Camping Trip", "title": "Pine Lake Camp News", "text": "Good evening, campers! This is the Pine Lake Camp News.\n\nTonight was the big Marshmallow Roasting Contest. Twenty families came to the fire pit with their sticks and their {adjective} hats.\n\nFirst, Mr. Hill toasted his marshmallow until it was the size of a {noun}. The crowd {past tense verb}. Next, a girl named Rosie roasted {number} marshmallows at once while {verb ending in ing} on one foot. The judges said it was very {adjective}.\n\nThe winner was Sam, age seven. He toasted his marshmallow {adverb} and served it on a bed of {plural noun}. His prize was a golden {noun} and a blue ribbon.\n\nIn other news, someone left a {adjective} {noun} on the picnic table. Please pick it up at the front office. Remember to brush your teeth and {verb} before bed. Good night, and sleep {adverb}!"}, {"id": "camping-trip-07", "theme": "Camping Trip", "title": "Junior Ranger Fun Facts", "text": "Hi! I am Ava, a Junior Forest Ranger. My new badge has a picture of a {animal} on it. Here are some fun facts from our camping trip.\n\nFact 1: Squirrels hide nuts in the ground. They also hide {plural noun} when nobody is looking.\nFact 2: Pine cones open when it is warm and close when they feel {adjective}.\nFact 3: Owls can turn their heads almost all the way around, so they can {verb} better.\nFact 4: If you listen {adverb} at night, you can hear the trees {verb ending in ing}.\nFact 5: Raccoons wash their food in the creek. Last night one washed my {noun}.\nFact 6: The tallest tree here is taller than {number} school buses stacked on a {noun}.\nFact 7: Moss grows on rocks, logs, and sometimes on sleepy {plural noun}.\nFact 8: A deer can jump higher than a {noun}.\n\nNext summer I want to earn my {adjective} badge. You have to catch a {noun} in a bug net."}, {"id": "camping-trip-08", "theme": "Camping Trip", "title": "Breakfast Menu at Campsite 12", "text": "Good morning, campers! Chef Dad is cooking breakfast on the camp stove. Here is the menu.\n\nPancakes: Fluffy, golden, and shaped like a {noun}. Served with syrup and a side of {plural noun}.\nScrambled Eggs: Stirred {adverb} with Grandpa's lucky {noun}. Chef Dad says this makes them taste {adjective}.\nHot Cocoa: Topped with three marshmallows and a sprinkle of {food}.\nToast: Cooked on a stick until it is crunchy and a little bit {adjective}.\nThe Mystery Special: Chef Dad will not tell us what is in it. It is {color}, and it {past tense verb} a little when Mom poked it.\n\nPlease wait in line and do not {verb} near the stove. Chef Dad gets very {adjective} when people touch his spatula.\n\nAfter breakfast, wash your plate in the bucket. Then shout \"{exclamation}!\" and {verb} {adverb} to thank the chef."}, {"id": "camping-trip-09", "theme": "Camping Trip", "title": "Campground Talent Show Tonight", "text": "Attention, campers! The Shady Oaks Talent Show is tonight at the big fire pit, right after dinner.\n\nHere is who will be performing:\n- The Garcia twins will juggle {number} pine cones while {verb ending in ing}.\n- Grandpa Lou will play the banjo and sing about his {adjective} canoe.\n- Little Max will show everyone how he can {verb} with his eyes closed.\n- Biscuit the dog will balance a {noun} on his {body part}.\n- Aunt Jo will tell jokes about {plural noun}.\n- Mr. Park will {verb} {adverb} for five whole minutes.\n\nRanger Kim will be the judge. The winner gets a {adjective} trophy made out of {plural noun}.\n\nPlease bring a chair or a {noun} to sit on. Snacks include s'mores and {food}. To be in the show, sign up at the ranger station and practice {adverb}!"}, {"id": "camping-trip-10", "theme": "Camping Trip", "title": "A Thank-You Letter to My Tent", "text": "Dear Tent,\n\nThank you for keeping me cozy for {number} nights. You were the best tent in the campground, even when your zipper got stuck and Dad had to open you with a {noun}.\n\nI am sorry about the time my brother {past tense verb} inside you. I am also sorry about the sticky {food} on your floor. We scrubbed it {adverb}, but some is still there.\n\nYou were very {adjective} when the wind blew. You only wobbled a little, like a {adjective} {noun}. You kept out the bugs, the rain, and the {plural noun}.\n\nTomorrow we will fold you up and put you in the car next to the cooler and the {plural noun}. Please do not {verb} on the way home. I will miss your {adjective} smell.\n\nLove,\nEmma\n\nP.S. I will see you next summer. Please say hi to the {animal} that lived in your pocket."}, {"id": "on-the-farm-01", "theme": "On the Farm", "title": "The Sunny Acres Chore Chart", "text": "Here is the chore chart for Sunny Acres Farm. Grandma hung it in the barn next to the {adjective} rooster calendar.\n\n6:00 - Feed the chickens. Each one gets a scoop of corn and a handful of {plural noun}.\n7:00 - Milk Daisy the cow. Sing to her {adverb}, or she will not stand still.\n8:00 - Brush the horses. Bluebell likes her mane braided like a {noun}.\n9:00 - Collect the eggs. Yesterday we found {number} eggs and one {noun}.\n10:00 - Help Grandpa fix the fence. Bring the hammer, the nails, and the {adjective} {noun}.\n11:00 - Give the pigs a bath. They love to {verb} in the mud right after.\n12:00 - Lunch! Grandma is making soup with carrots, beans, and {plural noun}.\n\nAfter chores, everyone gets lemonade on the porch. Grandma says we worked {adverb}. Grandpa says we worked like a team of {plural noun}."}, {"id": "on-the-farm-02", "theme": "On the Farm", "title": "A Letter to Mrs. Lopez", "text": "Dear Mrs. Lopez,\n\nI am spending the summer on my uncle's farm. It is very {adjective} here.\n\nThe farm has six cows, ten sheep, and a goat named Pepper. Pepper eats everything. Yesterday she ate a sock, a sunflower, and my uncle's {adjective} {noun}.\n\nEvery morning I help gather eggs. You have to reach under the hens {adverb} so they do not {verb}. My favorite hen is Lulu. She lays eggs that are a little bit {color}.\n\nOn Saturday we drove the tractor to town to buy seeds, flour, and a bag of {plural noun}. The tractor is very old. It sounds like a {animal} {verb ending in ing}. Everyone waved at us, and my uncle {past tense verb} back.\n\nPlease tell the class I said hello. I can now {verb} like a real farmer, and I can carry {number} buckets of {plural noun} at once.\n\nYour student,\nNoah\n\nP.S. I am bringing you a jar of honey and a {noun}."}, {"id": "on-the-farm-03", "theme": "On the Farm", "title": "Meet the Animals at Maple Hill", "text": "Welcome to Maple Hill Farm! Please follow the path and meet our animals.\n\nStop 1: The Cows. Bessie, Moo-Moo, and Gerald give us milk, cheese, and sometimes {plural noun}. Gerald is the {adjective} one.\nStop 2: The Pigs. Our pig, Waffles, can {verb} and count to {number}.\nStop 3: The Sheep. Their wool makes sweaters, blankets, and {adjective} socks.\nStop 4: The Duck Pond. Please do not feed the ducks any {food}. They like peas and {plural noun}.\nStop 5: The Barn Cat. Pumpkin sleeps {adverb} on a {noun} all day.\nStop 6: The Goat. Hold on to your {noun}. Our goat, Noodle, will try to eat it.\n\nBefore you leave, visit the gift shop. We sell honey, jam, and {adjective} {plural noun}. You can also take a photo with Farmer Joe, who will be {verb ending in ing} by the gate."}, {"id": "on-the-farm-04", "theme": "On the Farm", "title": "Grandma's Famous Farm Pie", "text": "This is Grandma's famous Farm Pie. She makes it every summer for the county fair. She has won a ribbon {number} times.\n\nYou will need:\n2 cups of flour\n1 cup of sugar\n3 fresh eggs\nA big handful of {plural noun}\nA pinch of {food}\n1 {adjective} {noun}\n\nFirst, mix the flour and sugar in a {adjective} bowl. Stir it {adverb} with a wooden spoon. Then crack the eggs and add a few {plural noun}. Grandma says the secret is to {verb} while you stir.\n\nAsk a grown-up to bake the pie for one hour. When the kitchen smells like a {noun}, it is ready.\n\nLet the pie cool on the windowsill. Last year a {animal} tried to sniff it, so Grandpa {past tense verb} on the porch all afternoon to guard it. Grandma says this year's pie is extra {adjective}."}, {"id": "on-the-farm-05", "theme": "On the Farm", "title": "The Barnyard News", "text": "Good morning! This is Ellie, reporting live from Clover Farm for the Barnyard News.\n\nTop story: Henrietta the hen laid an egg as big as a {noun}. Farmer Pat says it is the biggest egg she has ever seen. It is now resting on a {adjective} pillow in the kitchen.\n\nIn other news, the goats have learned how to {verb}. Nobody knows who taught them. They practice {adverb} behind the barn.\n\nWeather: Sunny, with a chance of {plural noun} after lunch. Wear your {adjective} boots.\n\nSports: Yesterday the pigs had a race. Mud Pie won by {number} inches. He ran {adverb} and only stopped once to {verb}. The ducks {past tense verb} the whole time.\n\nThat is all for today. Next week we will visit the {adjective} sheep and ask them about their {plural noun}. Back to you, {name}!"}, {"id": "on-the-farm-06", "theme": "On the Farm", "title": "Farmer Rosa's Garden Steps", "text": "Planting a garden is easy. Just follow these steps from Farmer Rosa.\n\nStep 1: Pick a sunny spot. Make sure the cows are not {verb ending in ing} on it.\nStep 2: Dig a row of little holes. Each hole should be as deep as a {noun}.\nStep 3: Drop two seeds into each hole. Some farmers also drop in a tiny {noun} for luck.\nStep 4: Cover the seeds with dirt and pat them {adverb}.\nStep 5: Water the garden every morning. Seeds also like it when you sing to them about {plural noun}.\nStep 6: Wait {number} days. This is the hardest part. Try not to {verb}.\nStep 7: Put up a scarecrow. Ours wears a {adjective} hat and holds a {noun}.\n\nIf you do everything right, you will grow carrots, beans, tomatoes, and a giant {adjective} {noun}. If a rabbit tries to {verb} in your garden, just say \"{exclamation}!\" and it will hop away."}, {"id": "on-the-farm-07", "theme": "On the Farm", "title": "The Barn Dance Is Saturday", "text": "Attention, neighbors! The Hollow Creek Barn Dance is this Saturday night. Everyone is invited, even the {plural noun}.\n\nThe dance starts at {number} o'clock in the big red barn. Farmer Gus has swept the floor, hung lights from every {noun}, and taught the cows to {verb}.\n\nThe band will play fiddles, banjos, and a {adjective} washboard. Miss June will teach everyone the Chicken Shuffle. First you flap your arms, then you {verb}, then you spin around {adverb}. Last, you wiggle your {body part}.\n\nThere will be cornbread, apple cider, and a giant bowl of {food}. Please keep the goats away from the snack table. Last year they {past tense verb} right into the cupcakes and the {plural noun}.\n\nWear your boots and your most {adjective} hat. The best dancer wins a {noun} and gets to ride on the hay wagon first."}, {"id": "on-the-farm-08", "theme": "On the Farm", "title": "A Week on Aunt Molly's Farm", "text": "Monday: Aunt Molly woke me up at five o'clock. The rooster was already {verb ending in ing} on the fence. I named the smallest chicken {name}.\nTuesday: I rode a pony named Peaches. She walks very {adverb} and stops to sniff every {noun}.\nWednesday: We picked strawberries. I ate {number} strawberries before they got to the basket.\n\nThursday: The pigs got out of their pen! We found them in the garden, sitting on a {adjective} {noun}.\nFriday: Aunt Molly let me drive the tractor with her. It goes slower than a {animal}, but it felt {adjective}.\nSaturday: We sold eggs and jam at the farmers market. A man bought six jars because they smelled like {plural noun}.\n\nSunday: I go home tomorrow. I will miss the {plural noun} so much. Aunt Molly gave me a jar of jam and a {noun} to take home. I told the cows I would {verb} for them every day until I come back."}, {"id": "on-the-farm-09", "theme": "On the Farm", "title": "Help Wanted at Willow Farm", "text": "HELP WANTED at Willow Farm! Farmer Dan needs a helper for the summer. The job is hard work, but it is also very {adjective}.\n\nYour jobs will include:\n- Feeding the goats. They like hay, carrots, and {plural noun}.\n- Counting the sheep. There should be {number} sheep. If there are more, one of them is probably a {noun}.\n- Waking up the rooster. He sleeps late and gets {adjective} if you are too loud.\n- Teaching the ducks how to {verb} across the yard.\n- Brushing the horse's {body part} every night.\n\nThe best helper can {verb} {adverb} and does not mind a little mud.\n\nYou will be paid in fresh eggs, warm {plural noun}, and one {adjective} {noun} at the end of the summer. To sign up, knock on the barn door and say \"{silly word}!\" three times."}, {"id": "on-the-farm-10", "theme": "On the Farm", "title": "A Letter from Daisy the Cow", "text": "Dear Farmer Ben,\n\nHello. It is me, Daisy, the cow in the third stall. I have a few requests.\n\nFirst, the grass in the north field tastes a little bit like {plural noun}. Could we please eat in the south field instead?\n\nSecond, the barn radio is too loud. The chickens like to {verb} to it all night. Please turn it down or play something {adjective}.\n\nThird, your new hat is very nice. It looks like a {noun}. When I showed the pigs, they {past tense verb} {adverb} for an hour.\n\nFourth, the barn cat keeps sleeping on my {noun}. Please ask her to nap on the {plural noun} instead.\n\nLast, I would like a bigger bell. My cousin has one shaped like a {food}. It goes \"{sound}!\" every time she takes a step.\n\nThank you for the {adjective} hay. You are the best farmer in {place}.\n\nMoo,\nDaisy\n\nP.S. The pigs say hello. They are {verb ending in ing} in the mud again."}, {"id": "wild-weather-01", "theme": "Wild Weather", "title": "Weather Wendy's Forecast", "text": "Good morning! This is Weather Wendy with your forecast for Maple Town.\n\nToday will start out sunny and {adjective}. At lunchtime, a light breeze will blow in from the lake. It will smell a little bit like {food}.\n\nThis afternoon, look out for a gentle shower of {plural noun}. You may want to carry a {noun} instead of an umbrella. Tonight the clouds will turn {color} and start {verb ending in ing}. Experts say this is normal for a Tuesday.\n\nTomorrow will be {number} degrees. Please wear sunscreen, a hat, and your most {adjective} sneakers. The wind will blow {adverb} all day, so hold on to your {plural noun}. On Thursday, the moon will be shaped like a {noun}.\n\nThis has been Weather Wendy. Remember, if the sky starts to {verb} , "theme": "Wild Weather", "title": "A Letter to Mr. Cloud", "text": "Dear Mr. Cloud,\n\nMy name is Lily. I am seven years old, and I live in the yellow house on Oak Street. You float over my house almost every day at {number} o'clock.\n\nI have a few questions for you. Why are you so {adjective} on Mondays? Do you ever get tired of {verb ending in ing}? My grandpa says clouds eat {plural noun} for breakfast, but I think he is joking. Is it true that you are as soft as a {noun}?\n\nI also have a favor to ask. My birthday party is on Saturday. Could you please rain {plural noun} instead of water? That would be so {adjective}. If you say yes, I will {verb} {adverb} for you and draw you a picture of a {noun}. My dog, {name}, will {verb} for you too.\n\nYour friend on the ground,\nLily\n\nP.S. Please tell the rainbow I like its {color} stripe the best."}, {"id": "wild-weather-07", "theme": "Wild Weather", "title": "Grandma Sky's Rainbow Recipe", "text": "Have you ever wondered how a rainbow is made? Here is the secret recipe from Grandma Sky's kitchen.\n\nYou will need:\n1 big cloud\n2 cups of sunshine\nA bucket of rain\nA pinch of glitter\n3 {adjective} {plural noun}\nA {adjective} spoon\n\nFirst, put the cloud in a large {noun}. Pour in the rain and stir it {adverb} until it starts to {verb}. Then add the sunshine one cup at a time. Grandma likes to {verb} during this part.\n\nNext, sprinkle in the glitter and a handful of {plural noun}. Grandma Sky says this makes the colors so {adjective}. For an extra stripe, add a little bit of {food}.\n\nBake the rainbow in the sky for {number} minutes. It should stretch from the school all the way to the {noun}. Serve it after a rainy afternoon, and do not forget to shout \"{exclamation}!\""}, {"id": "wild-weather-08", "theme": "Wild Weather", "title": "Greetings from Breezy Hills", "text": "Dear Aunt Rose,\n\nGreetings from Breezy Hills, the windiest town in the country! We are staying here for {number} days.\n\nThe wind never stops. This morning it blew my pancakes off my plate and onto a {noun}. Mom had to hold on to her {adjective} sunglasses all through breakfast. Dad's hat is now {verb ending in ing} somewhere over the lake.\n\nEverybody here flies kites. Our neighbor has a kite shaped like a {animal} that is as big as a bus. My kite flew {adverb} and got stuck on a {noun} for an hour.\n\nYesterday we went to the Wind Museum. They have a jar of wind from long ago. It smells like {plural noun}. The guide told us to {verb} when he opened it. Tomorrow we will watch the Breezy Hills Parade, where everyone goes {verb ending in ing} down Main Street holding a {adjective} {noun}.\n\nLove,\nBen\n\nP.S. I am bringing you a jar of wind. Please open it {adverb}."}, {"id": "wild-weather-09", "theme": "Wild Weather", "title": "Dr. Riley's Weather Facts", "text": "Hi! I am Dr. Riley, junior weather scientist. Here are my favorite facts.\n\nFact 1: Snowflakes have six sides. No two look the same, but some look a little like {plural noun}.\nFact 2: Thunder is the sound clouds make when they try to {verb}.\nFact 3: Hail is little balls of ice. In my town, the hail is soft and the size of a {noun}.\nFact 4: Fog is a cloud that got sleepy and decided to {verb} on the ground.\nFact 5: The hottest day in my backyard was {number} degrees. My ice pop melted {adverb} and dripped on my {body part}.\nFact 6: When it rains while the sun is out, a {adjective} rainbow appears. Look closely and you will see a {animal} {verb ending in ing} on it.\nFact 7: Wind is air in a big hurry, usually on its way to the {noun}.\n\nWhen I grow up, I will wear a {adjective} lab coat and drive a truck full of {plural noun}."}, {"id": "wild-weather-10", "theme": "Wild Weather", "title": "The Town Weather Order Form", "text": "Thank you for calling the Town Weather Office! To order your weather, fill out this form and drop it in the {adjective} box outside City Hall.\n\nName: Jada, age 7\nWeather needed for: Saturday, my {adjectiv melled like {food} and was tied with a {noun}. He read it three times and then {past tense verb} for the rest of the afternoon.\n\nWednesday: The queen ordered {number} boxes of {plural noun} for the garden. The castle goat helped me carry them. Behind the last box, I found the princess {verb ending in ing}. She said she was practicing for the talent show. Thursday: The royal baker got a package marked HANDLE WITH CARE. Inside was one {adjective} {noun}.\n\nFriday: I got a letter of my very own! It said, \"Thank you for being so {adjective}. Please come back next week and bring a {noun}.\" I can't wait to {verb} again on Monday."}, {"id": "castles-and-kingdoms-03", "theme": "Castles and Kingdoms", "title": "Rules for Visiting Sunnyhill Castle", "text": "Welcome to Sunnyhill Castle! Please follow these rules so everyone has a {adjective} visit. Rule one: Wipe your feet before you walk on the royal rug. The rug is three hundred years old and is made of {plural noun}.\n\nRule two: Do not {verb} in the throne room. The king is very {adjective} about his quiet time. If you must talk, please whisper {adverb}. Rule three: The castle cat, Sir Fluffington, may sleep anywhere he wants, even in the queen's {noun}. Do not wake him up, or he will meow for {number} hours.\n\nRule four: The moat is for ducks only. No swimming, no {verb ending in ing}, and no throwing {plural noun} into the water. Rule five: The royal guards must stand very still. Please do not tickle their {body part}.\n\nThank you for visiting! On your way out, please stop by the gift shop and buy a {adjective} {noun}. The money helps us feed the royal {animal}."}, {"id": "castles-and-kingdoms-04", "theme": "Castles and Kingdoms", "title": "The Prince's Birthday Feast Menu", "text": "Tonight the castle celebrates the little prince's sixth birthday! To start, each guest will get a warm bowl of tomato soup with a {noun} floating in the middle. The soup will be served {adverb} by the royal chef, who is wearing her b em.\"\n\nNext we asked about the strangest thing he ever grew. \"One spring, the queen gave me some seeds from far away,\" he said. \"I planted them {adverb}, and they grew into a giant {noun}. Now three {plural noun} live in it.\"\n\nMr. Hobbs also told us his secret for the best vegetables. \"Every Tuesday, I feed the carrots a little bowl of {food},\" he whispered. \"And I never let the rabbits see me {verb ending in ing}.\"\n\nAt the end of our visit, Mr. Hobbs gave us a {adjective} pumpkin and a basket of {plural noun}. He waved {adverb} as we left. What a {adjective} man!"}, {"id": "castles-and-kingdoms-07", "theme": "Castles and Kingdoms", "title": "A Letter from Princess June", "text": "Dear Pen Pal, hello from the castle! My name is Princess June, and I am seven years old. Thank you for your letter about your farm.\n\nOur castle has one hundred rooms, but my favorite is the kitchen. The cook lets me stir the soup and taste the {plural noun}. Yesterday we made muffins with {food} inside, and they tasted very {adjective}.\n\nMy brother and I have a pet {animal} named Duke. He sleeps in a {noun} by the fireplace and snores {adverb}. Every night, he {past tense verb} up the stairs to say goodnight to the {plural noun}.\n\nThis weekend my family is going to {verb} at the lake. My dad, the king, says I can bring my {adjective} kite and {number} friends. Do you want to come? Please write back soon and tell me all about your {plural noun}.\n\nYour {adjective} pen pal,\nPrincess June\nP.S. Duke says hello and wants a {noun}."}, {"id": "castles-and-kingdoms-08", "theme": "Castles and Kingdoms", "title": "The Royal Lost and Found", "text": "The castle Lost and Found is getting very full! If any of these things belong to you, please see Gerald at the front gate.\n\nFound in the throne room: one {adjective} crown, two left shoes, and a jar of {plural noun}. The jar says \"Do not open until Tuesday.\" Found in the garden: a {adjective} {noun} with the queen's name on it. The queen says she has never seen it before. It was found {verb ending in ing} under the apple tree.\n\nFound in the kitchen: {number} wooden spoons and a {color} sock. The sock smells a little bit like {food}. Found in the tower: a book called How to {verb} Like a King. Someone has read it very {adverb}.\n\nIf nobody picks up these things by Friday, Gerald will give them to the royal goat. Last week the goat {past tense verb} on a whole box of {plural noun}. Thank you, and please remember to label your {plural noun}!"}, {"id": "castles-and-kingdoms-09", "theme": "Castles and Kingdoms", "title": "Castle News: The King's New Hat", "text": "Good evening, and welcome to Castle News. Our top story tonight: King Barnaby has a new hat! It came in a box as big as a {noun}. It is tall, shiny, and covered in {plural noun}. The king put it on {adverb} and looked in the mirror for {number} minutes.\n\nPeople all over the kingdom came to see it. A farmer said it looked like a {adjective} {food}. One little girl said the hat made her want to {verb}. The royal dog {past tense verb} at it and then hid under the table.\n\nThere was only one problem. The hat was so tall that the king could not fit through the door. He spent the whole afternoon {verb ending in ing} in the hallway. The castle builders are now making the door a little bit more {adjective}.\n\nThat is all for tonight. Tomorrow we will report on the queen's {adjective} new {plural noun}. Good night, and sleep {adverb}!"}, {"id": "castles-and-kingdoms-10", "theme": "Castles and Kingdoms", "title": "The Big Castle Sleepover Plan", "text": "The prince is having a sleepover at the castle this Saturday! At six o'clock, guests will arrive at the front gate. Please bring a sleeping bag, a toothbrush, and your favorite {noun}. The guards will help carry your {plural noun} up to the tower.\n\nAt seven o'clock, we will eat pizza in the great hall. The royal cook will put {food} on top, because that is what the prince likes best.
